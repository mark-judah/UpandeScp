# SCP: response compression for API + assets
#
# WHY THIS FILE EXISTS
# --------------------
# nginx's built-in default for `gzip_types` is `text/html` ONLY. Debian/Ubuntu
# ships nginx.conf with `gzip on;` but every other gzip directive commented
# out — which reads as "compression is enabled" while every `application/json`
# API response and every JS/CSS asset is in fact sent uncompressed.
#
# Measured on kaitet.local before this file existed:
#   getBedsAndZones          55.4 MB  ->  5.12 MB   (10.8x)
#   heatmaps_grid             5.0 MB  ->  0.29 MB   (16.9x)
#   application_plan_diagnose 617 KB  ->  27.9 KB   (22.1x)
#   a full /scp_app page load  61.2 MB ->  5.48 MB  (11.2x)
#
# INSTALL
# -------
#   sudo cp deploy/nginx/scp-compression.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   bench --site <site> execute upande_scp.serverscripts.tests.check_compression.run
#
# The check command FAILS LOUDLY if compression is not active, so a deploy that
# forgets this file is detectable rather than silently 11x slower.
#
# Directives here are http-context and override the defaults in nginx.conf.

gzip on;
gzip_vary on;
gzip_proxied any;

# Level 5, not 6. The largest responses are multi-MB JSON (getBedsAndZones is
# ~55 MB); level 5 gives nearly the same ratio for materially less CPU per
# request. Measured: level 5 achieves 10.8x on that payload.
gzip_comp_level 5;

gzip_buffers 16 8k;
gzip_http_version 1.1;

# Below ~1 KB the gzip header costs more than it saves, and it adds latency to
# the many small API calls the SPA makes.
gzip_min_length 1024;

# application/json is the whole point — without it, nginx compresses only HTML.
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
