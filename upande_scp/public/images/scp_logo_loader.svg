<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 689 689" width="689" height="689" role="img" aria-label="Upande SCP">
  <!-- Generated by scripts/build_scp_logo.py — edit there. The splash loader:
       the SCP scene on a loop (in, the scouting round, out). Pure CSS. -->
  <style>
    .arrow { transform-box: view-box; transform-origin: 348.5px 347px; }
    .leaf { transform-box: fill-box; transform-origin: 50% 100%; }
    .ring-spot { transform-box: view-box; transform-origin: 309.6px 266.5px; }
    .ring-pest { transform-box: view-box; transform-origin: 306.6px 466.5px; }
    .arrow { animation: scp-in-0 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .scene { animation: scp-in-1 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .leaf { animation: scp-in-2 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .spots { animation: scp-in-3 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .scout { animation: scp-in-4 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .lens { animation: scp-round-0 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .ring-spot { animation: scp-round-1 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .ring-pest { animation: scp-round-2 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .spray { animation: scp-round-3 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    .pest { animation: scp-round-4 3000ms cubic-bezier(.3,.7,.2,1) infinite both; }
    @keyframes scp-in-0 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 1; }
      8.1% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      18% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      82% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      91.9% { transform: translate(0px, 0px) scale(0); opacity: 0; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 1; }
    }
    @keyframes scp-in-1 {
      0% { opacity: 0; }
      2.16% { opacity: 1; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      97.84% { opacity: 1; }
      100% { opacity: 0; }
    }
    @keyframes scp-in-2 {
      0% { transform: scale(0); }
      2.7% { transform: scale(0); }
      12.6% { transform: scale(1.04); }
      14.4% { transform: scale(1); }
      18% { transform: scale(1); }
      82% { transform: scale(1); }
      85.6% { transform: scale(1); }
      87.4% { transform: scale(1.04); }
      97.3% { transform: scale(0); }
      100% { transform: scale(0); }
    }
    @keyframes scp-in-3 {
      0% { opacity: 0; }
      11.16% { opacity: 0; }
      15.3% { opacity: 1; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      84.7% { opacity: 1; }
      88.84% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes scp-in-4 {
      0% { opacity: 0; }
      14.76% { opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      85.24% { opacity: 0; }
      100% { opacity: 0; }
    }
    @keyframes scp-round-0 {
      0% { transform: translate(150px, 610px); }
      18% { transform: translate(150px, 610px); }
      29.52% { transform: translate(309.6px, 266.5px); }
      38.48% { transform: translate(309.6px, 266.5px); }
      47.44% { transform: translate(306.6px, 466.5px); }
      60.24% { transform: translate(306.6px, 466.5px); }
      74.32% { transform: translate(150px, 610px); }
      82% { transform: translate(150px, 610px); }
      100% { transform: translate(150px, 610px); }
    }
    @keyframes scp-round-1 {
      0% { transform: scale(.5); opacity: 0; }
      18% { transform: scale(.5); opacity: 0; }
      30.8% { transform: scale(.5); opacity: 0; }
      32.72% { transform: scale(.75); opacity: 1; }
      39.76% { transform: scale(1.25); opacity: 0; }
      82% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(.5); opacity: 0; }
    }
    @keyframes scp-round-2 {
      0% { transform: scale(.5); opacity: 0; }
      18% { transform: scale(.5); opacity: 0; }
      48.72% { transform: scale(.5); opacity: 0; }
      50.64% { transform: scale(.75); opacity: 1; }
      57.68% { transform: scale(1.25); opacity: 0; }
      82% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(.5); opacity: 0; }
    }
    @keyframes scp-round-3 {
      0% { transform: translate(0px, -70px); opacity: 0; }
      18% { transform: translate(0px, -70px); opacity: 0; }
      56.4% { transform: translate(0px, -70px); opacity: 0; }
      59.6% { transform: translate(0px, -40px); opacity: 1; }
      69.2% { transform: translate(0px, 90px); opacity: 0; }
      82% { transform: translate(0px, 90px); opacity: 0; }
      100% { transform: translate(0px, -70px); opacity: 0; }
    }
    @keyframes scp-round-4 {
      0% { opacity: 1; }
      18% { opacity: 1; }
      65.36% { opacity: 1; }
      70.48% { opacity: 0; }
      78.16% { opacity: 0; }
      82% { opacity: 1; }
      100% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow, .scene, .scene * { animation: none !important; }
      .scene { opacity: 0; }
    }
  </style>
  <clipPath id="scp-disc"><circle cx="344.5" cy="344.5" r="336"/></clipPath>
