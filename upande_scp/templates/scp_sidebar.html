<style>
	:root {
		--scp-sb-w: 232px;
		--scp-sb-w-collapsed: 60px;

		/* Softer slate palette (reduced black intensity) */
		--scp-sb-bg: #ffffff;
		--scp-sb-fg: #374151;
		--scp-sb-body: #4b5563;
		--scp-sb-muted: #6b7280;
		--scp-sb-border: #e5e7eb;
		--scp-sb-hover: #f4f5f6;
		--scp-sb-subtle: #fafbfc;
		--scp-sb-active-bg: #4b5563;
		--scp-sb-active-fg: #ffffff;
		--scp-sb-link: #2563eb;
	}

	.scp-sb {
		width: var(--scp-sb-w);
		flex: 0 0 var(--scp-sb-w);
		height: 100vh;
		background: var(--scp-sb-bg);
		border-right: 1px solid var(--scp-sb-border);
		display: flex;
		flex-direction: column;
		font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
		transition: width 0.18s ease, flex-basis 0.18s ease;
		position: relative;
		z-index: 1000;
	}

	.scp-sb.collapsed {
		width: var(--scp-sb-w-collapsed);
		flex-basis: var(--scp-sb-w-collapsed);
	}

	/* ── Header (brand + actions) ── */
	.scp-sb-header {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 10px 12px;
		border-bottom: 1px solid var(--scp-sb-border);
		min-height: 52px;
		background: var(--scp-sb-bg);
	}

	.scp-sb-brand-wrap {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		flex: 1;
		min-width: 0;
		overflow: hidden;
	}

	.scp-sb-logo {
		width: 30px;
		height: 30px;
		flex-shrink: 0;
		border-radius: 6px;
		background: var(--scp-sb-active-bg);
		color: var(--scp-sb-active-fg);
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.scp-sb-brand {
		font-size: 0.85rem;
		font-weight: 600;
		color: var(--scp-sb-fg);
		letter-spacing: -0.01em;
		white-space: nowrap;
		overflow: hidden;
		opacity: 1;
		transition: opacity 0.15s ease;
	}
	.scp-sb.collapsed .scp-sb-brand {
		opacity: 0;
		width: 0;
	}

	.scp-sb-actions {
		display: flex;
		align-items: center;
		gap: 4px;
		flex-shrink: 0;
		opacity: 1;
		transition: opacity 0.15s ease;
	}
	.scp-sb.collapsed .scp-sb-actions {
		display: none;
	}

	.scp-sb-iconbtn {
		width: 28px;
		height: 28px;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		background: transparent;
		border: 1px solid transparent;
		border-radius: 6px;
		cursor: pointer;
		color: var(--scp-sb-muted);
	}
	.scp-sb-iconbtn svg {
		width: 14px;
		height: 14px;
	}

	/* When collapsed, the toggle floats by itself, centered in the header */
	.scp-sb-toggle-collapsed {
		display: none;
		width: 100%;
		height: 30px;
		align-items: center;
		justify-content: center;
		background: transparent;
		border: 1px solid var(--scp-sb-border);
		border-radius: 6px;
		cursor: pointer;
		color: var(--scp-sb-muted);
	}
	.scp-sb-toggle-collapsed svg {
		width: 14px;
		height: 14px;
	}
	.scp-sb.collapsed .scp-sb-toggle-collapsed {
		display: flex;
	}

	/* Chevron rotation */
	.scp-sb-chevron {
		transition: transform 0.18s ease;
	}
	.scp-sb.collapsed .scp-sb-chevron {
		transform: rotate(180deg);
	}

	/* ── Body / nav ── */
	.scp-sb-body {
		flex: 1;
		overflow-y: auto;
		overflow-x: hidden;
		padding: 8px;
		scrollbar-width: thin;
	}

	/* ── Footer (exit) ── */
	.scp-sb-footer {
		flex-shrink: 0;
		padding: 8px;
		border-top: 1px solid var(--scp-sb-border);
		background: var(--scp-sb-bg);
	}
	.scp-sb-footer .scp-sb-exit {
		color: var(--scp-sb-muted);
	}
	.scp-sb-body::-webkit-scrollbar {
		width: 5px;
	}
	.scp-sb-body::-webkit-scrollbar-thumb {
		background: var(--scp-sb-border);
		border-radius: 999px;
	}

	.scp-sb-section {
		padding: 10px 10px 6px;
		font-size: 0.68rem;
		font-weight: 600;
		text-transform: uppercase;
		letter-spacing: 0.06em;
		color: var(--scp-sb-muted);
		white-space: nowrap;
		overflow: hidden;
	}
	.scp-sb-section:first-child {
		padding-top: 4px;
	}
	.scp-sb.collapsed .scp-sb-section {
		opacity: 0;
		height: 0;
		padding: 0;
	}

	.scp-sb-link {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 7px 10px;
		margin: 1px 0;
		border-radius: 6px;
		color: var(--scp-sb-body);
		text-decoration: none;
		font-size: 0.8rem;
		font-weight: 500;
		white-space: nowrap;
		position: relative;
	}
	.scp-sb-link.active {
		background: var(--scp-sb-active-bg);
		color: var(--scp-sb-active-fg);
	}
	.scp-sb-link svg {
		flex-shrink: 0;
		width: 16px;
		height: 16px;
	}
	.scp-sb-link-label {
		overflow: hidden;
		text-overflow: ellipsis;
		opacity: 1;
		transition: opacity 0.12s ease;
	}
	.scp-sb.collapsed .scp-sb-link {
		justify-content: center;
		padding: 8px;
	}
	.scp-sb.collapsed .scp-sb-link-label {
		opacity: 0;
		width: 0;
	}

	/* Tooltip on collapsed hover */
	.scp-sb.collapsed .scp-sb-link[data-tip]:hover::after,
	.scp-sb.collapsed .scp-sb-iconbtn[data-tip]:hover::after {
		content: attr(data-tip);
		position: absolute;
		left: calc(100% + 8px);
		top: 50%;
		background: var(--scp-sb-active-bg);
		color: var(--scp-sb-active-fg);
		padding: 4px 8px;
		border-radius: 4px;
		font-size: 0.72rem;
		font-weight: 500;
		white-space: nowrap;
		z-index: 2000;
		pointer-events: none;
	}

	/* ── Mobile hamburger trigger ── */
	.scp-sb-mobile-trigger {
		display: none;
		position: fixed;
		top: 12px;
		left: 12px;
		width: 36px;
		height: 36px;
		align-items: center;
		justify-content: center;
		background: var(--scp-sb-bg);
		border: 1px solid var(--scp-sb-border);
		border-radius: 6px;
		color: var(--scp-sb-fg);
		z-index: 1500;
		cursor: pointer;
	}
	.scp-sb-backdrop {
		display: none;
		position: fixed;
		inset: 0;
		background: rgba(17, 24, 39, 0.45);
		backdrop-filter: blur(2px);
		z-index: 999;
	}

	@media (max-width: 768px) {
		.scp-sb {
			position: fixed;
			top: 0;
			left: 0;
			transform: translateX(-100%);
			transition: transform 0.2s ease;
			width: var(--scp-sb-w) !important;
			flex: 0 0 0 !important;
			flex-basis: 0 !important;
		}
		.scp-sb.mobile-open {
			transform: translateX(0);
		}
		.scp-sb-backdrop.visible {
			display: block;
		}
		.scp-sb-mobile-trigger {
			display: flex;
		}
		.scp-sb .scp-sb-brand,
		.scp-sb .scp-sb-section,
		.scp-sb .scp-sb-link-label {
			opacity: 1 !important;
			width: auto !important;
		}
		.scp-sb .scp-sb-actions {
			display: flex !important;
		}
		.scp-sb .scp-sb-toggle-collapsed {
			display: none !important;
		}
	}
</style>

<script>
	(function () {
		var sb = document.getElementById("scpSidebar");
		var toggle = document.getElementById("scpSbToggle");
		var toggleCollapsed = document.getElementById("scpSbToggleCollapsed");
		var trigger = document.getElementById("scpSbMobileTrigger");
		var backdrop = document.getElementById("scpSbBackdrop");
		var STORAGE_KEY = "scp-sidebar-collapsed";

		try {
			if (localStorage.getItem(STORAGE_KEY) === "1") {
				sb.classList.add("collapsed");
			}
		} catch (e) {}

		function flip() {
			sb.classList.toggle("collapsed");
			try {
				localStorage.setItem(
					STORAGE_KEY,
					sb.classList.contains("collapsed") ? "1" : "0"
				);
			} catch (e) {}
		}
		if (toggle) toggle.addEventListener("click", flip);
		if (toggleCollapsed) toggleCollapsed.addEventListener("click", flip);

		function closeMobile() {
			sb.classList.remove("mobile-open");
			backdrop.classList.remove("visible");
		}
		if (trigger) {
			trigger.addEventListener("click", function () {
				sb.classList.add("mobile-open");
				backdrop.classList.add("visible");
			});
		}
		if (backdrop) backdrop.addEventListener("click", closeMobile);
		document.addEventListener("keydown", function (e) {
			if (e.key === "Escape") closeMobile();
		});

		var path = window.location.pathname.replace(/^\//, "");
		document.querySelectorAll(".scp-sb-link[data-page]").forEach(function (a) {
			if (path === a.dataset.page || path.startsWith(a.dataset.page)) {
				a.classList.add("active");
			}
		});
	})();
</script>
