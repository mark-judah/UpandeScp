{% extends "upande_scp/www/map_base.html" %} {% block head %}
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
		}
	}
</script>
<style>
	#map-page {
		height: 100%;
		width: 100%;
		display: flex;
		position: relative;
	}
	#map-container {
		flex: 1;
		position: relative;
		z-index: 1;
	}
	#map {
		height: 100%;
		width: 100%;
	}

	/* ── Toggles row inside the floating filter bar ── */
	.scout-filters .filter-toggles {
		display: flex;
		align-items: center;
		gap: 14px;
		flex-wrap: wrap;
	}
	.scout-filters .toggle-item {
		display: flex;
		align-items: center;
		gap: 6px;
		font-size: 0.72rem;
		color: #4b5563;
		cursor: pointer;
		user-select: none;
	}
	.scout-filters .toggle-item input {
		margin: 0;
		cursor: pointer;
		accent-color: #4b5563;
	}
	.scout-filters .opacity-control {
		display: flex;
		flex-direction: column;
		gap: 3px;
		min-width: 120px;
	}
	.scout-filters .opacity-control input[type="range"] {
		width: 100%;
		accent-color: #4b5563;
		height: 4px;
	}
	.scout-filters .opacity-value {
		font-size: 0.7rem;
		color: #6b7280;
	}

	/* ── Summary details (legend / timeline) ── */
	.scout-summary-details {
		border-top: 1px solid #e5e7eb;
		padding-top: 8px;
		margin-top: 4px;
	}
	.scout-summary-details summary {
		cursor: pointer;
		font-size: 0.7rem;
		font-weight: 600;
		color: #6b7280;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		list-style: none;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 4px 0;
	}
	.scout-summary-details summary::-webkit-details-marker { display: none; }
	.scout-summary-details summary::after {
		content: "▾";
		font-size: 0.6rem;
		color: #9ca3af;
	}
	.scout-summary-details[open] summary::after {
		content: "▴";
	}
	.scout-summary-details > div {
		padding-top: 6px;
		max-height: 220px;
		overflow-y: auto;
	}

	.legend-items {
		display: flex;
		flex-direction: column;
		gap: 0.3rem;
	}
	.legend-item {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.4rem 0.5rem;
		border-radius: 6px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		cursor: pointer;
	}
	.legend-item input[type="checkbox"] {
		width: 14px;
		height: 14px;
		margin: 0;
		cursor: pointer;
		accent-color: #4b5563;
	}
	.color-swatch {
		width: 14px;
		height: 14px;
		border-radius: 4px;
		flex-shrink: 0;
		border: 1px solid #e5e7eb;
	}
	.legend-label {
		flex: 1;
		font-size: 0.75rem;
		font-weight: 500;
		color: #374151;
	}
	.empty-state {
		text-align: center;
		padding: 0.75rem 0.5rem;
		color: #6b7280;
	}
	.empty-state p {
		font-size: 0.75rem;
		margin: 0;
	}

	.timeline-item {
		display: flex;
		flex-direction: column;
		gap: 0.15rem;
		padding: 0.4rem 0.5rem;
		border-radius: 6px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		font-size: 0.72rem;
		margin-bottom: 0.3rem;
	}
	.timeline-top {
		display: flex;
		justify-content: space-between;
		align-items: center;
	}
	.timeline-name {
		font-weight: 600;
		color: var(--text);
	}
	.timeline-block {
		font-size: 0.6875rem;
		color: var(--text-muted);
	}
	.timeline-time {
		font-size: 0.6875rem;
		color: var(--text-muted);
	}

	/* ── Map overlay / empty state ── */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(255,255,255,0.93);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.5rem;
		border-radius: inherit;
	}
	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #2563eb; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }

	#empty-hint {
		position: absolute;
		left: 50%;
		bottom: 24px;
		transform: translateX(-50%);
		z-index: 800;
		background: rgba(255,255,255,0.92);
		border: 1px solid #e5e7eb;
		border-radius: 999px;
		padding: 6px 14px;
		font-size: 0.72rem;
		color: #6b7280;
		display: none;
	}

	#fps {
		position: absolute;
		left: 14px;
		bottom: 14px;
		z-index: 800;
		background: rgba(255,255,255,0.92);
		border: 1px solid #e5e7eb;
		border-radius: 6px;
		padding: 3px 8px;
		font-size: 0.7rem;
		color: #6b7280;
		font-variant-numeric: tabular-nums;
	}
</style>

			<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
			<span class="map-load-status" id="map-load-status">Initialising…</span>
		</div>
		<div id="map"></div>
		<div id="empty-hint">Pick a block to load avocado trees</div>
		<div id="fps">— fps</div>
	</div>

	<!-- Floating filter bar (top) -->

		<div class="scout-filter-item">

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="module">
	import * as THREE from "three";

	const BLOCKS_GEOJSON = {{ blocks_geojson | tojson | safe }};
	const FARM_HIERARCHY = {{ farm_hierarchy | tojson | safe }};
	const LAT  = {{ lat | json }};
	const LON  = {{ lon | json }};
	const ZOOM = {{ default_zoom | json }};
	const CSRF = "{{ csrf_token }}";

	// Same palette as the 2D scouts map so a scout's colour is consistent
	// across pages. Avocado-only doesn't share state, but the visual hue does.
	const palette = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#f43f5e','#22c55e','#a78bfa','#fb923c'];
	const UNSCOUTED_COLOR = '#7c8b6a'; // muted olive — reads as "tree" but quiet

	// Hardcoded farm view defaults — picking the farm pans/zooms here.
	const FARM_DEFAULTS = {
		'Lokitela': { lat: 0.984247, lon: 34.861851, zoom: 16 },
	};

	const setProgress = (pct, msg) => {
		const fill = document.getElementById('map-load-fill');
		const status = document.getElementById('map-load-status');
		if (fill) fill.style.width = Math.min(100, pct) + '%';
		if (status && msg) status.textContent = msg;
	};
	const showOverlay = (msg) => {
		setProgress(0, msg || 'Initialising…');
		document.getElementById('map-loader').style.display = 'flex';
	};
	const hideOverlay = () => {
		document.getElementById('map-loader').style.display = 'none';
	};

	// ── Map ────────────────────────────────────────────────────────────────
	const map = new maplibregl.Map({
		container: 'map',
		style: 'https://tiles.openfreemap.org/styles/liberty',
		center: [LON, LAT],
		zoom: ZOOM,
		pitch: 60,
		bearing: 0,
		hash: false,
		attributionControl: { compact: true },
	});
	map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
	map.addControl(new maplibregl.ScaleControl(), 'bottom-left');
	window.map = map;

	// ── FPS counter (only updates when meaningful) ────────────────────────
	(() => {
		const out = document.getElementById('fps');
		let frames = 0, last = performance.now();
		function tick(now) {
			frames++;
			if (now - last >= 500) {
				const fps = (frames * 1000) / (now - last);
				out.textContent = `~${fps.toFixed(0)} fps`;
				frames = 0; last = now;
			}
			requestAnimationFrame(tick);
		}
		requestAnimationFrame(tick);
	})();

	// ── Block boundaries ──────────────────────────────────────────────────
	const BOUNDARY_FILL_COLOR = '#3b82f6';
	const BOUNDARY_LINE_COLOR = '#1d4ed8';

	function addBlocksLayers() {
		if (map.getSource('blocks')) return;
		map.addSource('blocks', { type: 'geojson', data: BLOCKS_GEOJSON });
		map.addLayer({
			id: 'blocks-fill',
			type: 'fill',
			source: 'blocks',
			paint: {
				'fill-color': BOUNDARY_FILL_COLOR,
				'fill-opacity': 0.25,
			},
		});
		map.addLayer({
			id: 'blocks-line',
			type: 'line',
			source: 'blocks',
			paint: {
				'line-color': BOUNDARY_LINE_COLOR,
				'line-width': 1.5,
				'line-opacity': 0.85,
			},
		});
		map.addLayer({
			id: 'blocks-labels',
			type: 'symbol',
			source: 'blocks',
			layout: {
				'text-field': ['get', 'block_label'],
				'text-size': 12,
				'text-allow-overlap': false,
			},
			paint: {
				'text-color': '#1e293b',
				'text-halo-color': '#ffffff',
				'text-halo-width': 1.5,
			},
		});
		map.on('click', 'blocks-fill', (e) => {
			const f = e.features && e.features[0];
			if (!f) return;
			const block = f.properties.block;
			document.getElementById('block-select').value = block;
			loadScope({ block, farm: '' });
		});
		map.on('mouseenter', 'blocks-fill', () => {
			map.getCanvas().style.cursor = 'pointer';
		});
		map.on('mouseleave', 'blocks-fill', () => {
			map.getCanvas().style.cursor = '';
		});
	}

	function setBlocksVisibility(show) {
		for (const id of ['blocks-fill', 'blocks-labels']) {
			if (map.getLayer(id)) {
				map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none');
			}
		}
	}
	function setBoundariesVisibility(show) {
		if (map.getLayer('blocks-line')) {
			map.setLayoutProperty('blocks-line', 'visibility', show ? 'visible' : 'none');
		}
	}
	function setBoundaryOpacity(pct) {
		if (map.getLayer('blocks-fill')) {
			map.setPaintProperty('blocks-fill', 'fill-opacity', pct / 100);
		}
	}

	// ── Trees layer (Three.js InstancedMesh, per-scout canopy color) ─────
	class TreesLayer {
		constructor(features, treeColors) {
			this.id = 'trees';
			this.type = 'custom';
			this.renderingMode = '3d';
			this.features = features;
			this.treeColors = treeColors; // Map<treeName, hex>
			this.trunkH = 1.5;
			this.canopyH = 2.5;
			this.canopyR = 1.2;
		}

		onAdd(map, gl) {
			this.map = map;
			this.camera = new THREE.Camera();
			this.scene = new THREE.Scene();

			this.scene.add(new THREE.AmbientLight(0xffffff, 0.55));
			const sun = new THREE.DirectionalLight(0xffffff, 0.9);
			sun.position.set(0.4, 1, 0.6);
			this.scene.add(sun);

			const [lng0, lat0] = this.features[0].geometry.coordinates;
			this.anchor = maplibregl.MercatorCoordinate.fromLngLat([lng0, lat0], 0);

			// Trunk: cylinder, base at y=0.
			const trunkGeo = new THREE.CylinderGeometry(0.12, 0.16, this.trunkH, 8);
			trunkGeo.translate(0, this.trunkH / 2, 0);
			const trunkMat = new THREE.MeshLambertMaterial({ color: 0x6b3f1e });
			const trunkMesh = new THREE.InstancedMesh(trunkGeo, trunkMat, this.features.length);

			// Canopy: low-poly perturbed icosahedron. Vertices jittered by hash
			// so duplicate vertices share offsets and faces still meet cleanly.
			const canopyGeo = new THREE.IcosahedronGeometry(this.canopyR, 1);
			canopyGeo.scale(1, this.canopyH / (2 * this.canopyR), 1);
			const cpos = canopyGeo.attributes.position;
			const cTmp = new THREE.Vector3();
			const cOffsets = new Map();
			const jitter = this.canopyR * 0.20;
			for (let i = 0; i < cpos.count; i++) {
				cTmp.fromBufferAttribute(cpos, i);
				const key = cTmp.x.toFixed(4) + '_' + cTmp.y.toFixed(4) + '_' + cTmp.z.toFixed(4);
				let o = cOffsets.get(key);
				if (!o) {
					const seed = Math.abs(cTmp.x * 12.9 + cTmp.y * 78.2 + cTmp.z * 37.7) + 1;
					const f = (k) => ((Math.sin(seed * k) * 43758.5453) % 1) * jitter;
					o = [f(1.1), f(2.7), f(4.3)];
					cOffsets.set(key, o);
				}
				cpos.setXYZ(i, cTmp.x + o[0], cTmp.y + o[1], cTmp.z + o[2]);
			}
			cpos.needsUpdate = true;
			canopyGeo.computeVertexNormals();
			canopyGeo.translate(0, this.trunkH + this.canopyH / 2, 0);

			// MeshLambertMaterial respects per-instance color when
			// `instanceColor` is set via `setColorAt` + needsUpdate.
			const canopyMat = new THREE.MeshLambertMaterial({
				color: 0xffffff, // white base — multiplied by instance color
				flatShading: true,
				vertexColors: false,
			});
			const canopyMesh = new THREE.InstancedMesh(canopyGeo, canopyMat, this.features.length);

			const meter = this.anchor.meterInMercatorCoordinateUnits();
			const tmp = new THREE.Matrix4();
			const tmpColor = new THREE.Color();
			const defaultColor = new THREE.Color(UNSCOUTED_COLOR);

			for (let i = 0; i < this.features.length; i++) {
				const [lng, lat] = this.features[i].geometry.coordinates;
				const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], 0);
				const dx = (m.x - this.anchor.x) / meter;
				const dz = (m.y - this.anchor.y) / meter;
				tmp.makeTranslation(dx, 0, dz);
				trunkMesh.setMatrixAt(i, tmp);
				canopyMesh.setMatrixAt(i, tmp);

				const tn = this.features[i].properties && this.features[i].properties.tree_name;
				const hex = (tn && this.treeColors.get(tn)) || null;
				if (hex) {
					tmpColor.set(hex);
					canopyMesh.setColorAt(i, tmpColor);
				} else {
					canopyMesh.setColorAt(i, defaultColor);
				}
			}
			trunkMesh.instanceMatrix.needsUpdate = true;
			canopyMesh.instanceMatrix.needsUpdate = true;
			if (canopyMesh.instanceColor) canopyMesh.instanceColor.needsUpdate = true;

			this.trunkMesh = trunkMesh;
			this.canopyMesh = canopyMesh;
			this.scene.add(trunkMesh);
			this.scene.add(canopyMesh);

			this.renderer = new THREE.WebGLRenderer({
				canvas: map.getCanvas(),
				context: gl,
				antialias: true,
			});
			this.renderer.autoClear = false;
		}

		// Recolor without rebuilding instance matrices — much cheaper than
		// removing & re-adding the layer when only scout assignments change.
		updateColors(treeColors) {
			if (!this.canopyMesh) return;
			this.treeColors = treeColors;
			const tmpColor = new THREE.Color();
			const defaultColor = new THREE.Color(UNSCOUTED_COLOR);
			for (let i = 0; i < this.features.length; i++) {
				const tn = this.features[i].properties && this.features[i].properties.tree_name;
				const hex = (tn && treeColors.get(tn)) || null;
				if (hex) {
					tmpColor.set(hex);
					this.canopyMesh.setColorAt(i, tmpColor);
				} else {
					this.canopyMesh.setColorAt(i, defaultColor);
				}
			}
			if (this.canopyMesh.instanceColor) this.canopyMesh.instanceColor.needsUpdate = true;
			map.triggerRepaint();
		}

		render(gl, args) {
			let matrix = args;
			if (args && !Array.isArray(args) && typeof args !== 'function') {
				matrix =
					(args.defaultProjectionData &&
						(args.defaultProjectionData.mainMatrix ||
							args.defaultProjectionData.matrix)) ||
					args.matrix ||
					args;
			}
			if (!matrix || matrix.length !== 16) return;

			const meter = this.anchor.meterInMercatorCoordinateUnits();
			const rotX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
			const world = new THREE.Matrix4()
				.makeTranslation(this.anchor.x, this.anchor.y, this.anchor.z)
				.scale(new THREE.Vector3(meter, -meter, meter))
				.multiply(rotX);
			this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(world);
			this.renderer.resetState();
			this.renderer.render(this.scene, this.camera);
			this.map.triggerRepaint();
		}

		onRemove() {
			this.scene.traverse((o) => {
				if (o.geometry) o.geometry.dispose();
				if (o.material) o.material.dispose();
			});
		}
	}

	// ── State ─────────────────────────────────────────────────────────────
	let activeTrees = null;
	let lastTreeFeatures = null;     // FeatureCollection.features for current scope
	let lastScoutingData = null;     // last avocado payload
	let scoutColorMap = new Map();   // scout name -> hex
	let savedPitch = 60;
	let savedBearing = 0;
	let abortCtrl = null;
	// Bumped on every loadScope(); in-flight async work reads this and
	// bails if it has been superseded — prevents farm A's late-arriving
	// data from clobbering farm/block B's render.
	let selectionToken = 0;

	// ── Filters cascade ──────────────────────────────────────────────────
	const farmsByName = new Map((FARM_HIERARCHY || []).map(f => [f.name, f]));

	function buildBlockOptions(farmName) {
		const select = document.getElementById('block-select');
		const previous = select.value;
		const allBlocks = (BLOCKS_GEOJSON.features || [])
			.map(f => ({ name: f.properties.block, label: f.properties.block_label, farm: f.properties.farm }))
			.filter(b => !farmName || b.farm === farmName);
		// Dedupe by block name (each block is one feature in our build)
		const seen = new Set();
		const unique = [];
		for (const b of allBlocks) {
			if (seen.has(b.name)) continue;
			seen.add(b.name);
			unique.push(b);
		}
		unique.sort((a, b) => (a.label || '').localeCompare(b.label || ''));

		select.innerHTML = '<option value="">— pick a block —</option>';
		for (const b of unique) {
			const opt = document.createElement('option');
			opt.value = b.name;
			opt.textContent = b.label;
			select.appendChild(opt);
		}
		// Preserve previous selection if still available
		if (previous && unique.some(b => b.name === previous)) {
			select.value = previous;
		}
	}

	// ── Data fetching ────────────────────────────────────────────────────
	function fetchTrees({ block, farm } = {}) {
		const qs = block
			? `block=${encodeURIComponent(block)}`
			: (farm ? `farm=${encodeURIComponent(farm)}` : '');
		if (!qs) return Promise.resolve({ type: 'FeatureCollection', features: [] });
		return fetch(`/api/method/upande_scp.serverscripts.get_orchard_trees.get_orchard_trees_geojson?${qs}`, {
			headers: { 'X-Frappe-CSRF-Token': CSRF },
		})
			.then(r => r.ok ? r.json() : { message: { type: 'FeatureCollection', features: [] } })
			.then(j => j.message || { type: 'FeatureCollection', features: [] });
	}

	function fetchScouting(date, block) {
		if (abortCtrl) abortCtrl.abort();
		abortCtrl = new AbortController();
		const body = { date };
		if (block) body.block = block;
		return fetch('/api/method/upande_scp.serverscripts.get_avocado_scouting.get_avocado_scouting', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': CSRF },
			body: JSON.stringify(body),
			signal: abortCtrl.signal,
		})
			.then(r => r.ok ? r.json() : { message: null })
			.then(j => j.message || { scouting_entries: [], scout_movement_timeline: [], scouting_summary: {} });
	}

	// ── Scout colors / paths / legend ────────────────────────────────────
	function buildScoutColorMap(entries) {
		const seen = [];
		for (const e of entries) {
			if (e.scouts_name && !seen.includes(e.scouts_name)) seen.push(e.scouts_name);
		}
		const m = new Map();
		seen.forEach((name, i) => m.set(name, palette[i % palette.length]));
		return m;
	}

	function buildTreeColorMap(entries, scoutColors) {
		const m = new Map();
		for (const e of entries) {
			if (!e.tree || !e.scouts_name) continue;
			const c = scoutColors.get(e.scouts_name);
			if (c) m.set(e.tree, c);
		}
		return m;
	}

	function buildScoutPathFC(entries, treeFeatures) {
		// Coordinate lookup: prefer the planted tree's coord (precise),
		// fall back to the entry's lat/lon if the tree id isn't found.
		const treeCoord = new Map();
		for (const f of (treeFeatures || [])) {
			const tn = f.properties && f.properties.tree_name;
			if (tn) treeCoord.set(tn, f.geometry.coordinates);
		}
		const sorted = [...entries].sort((a, b) => {
			const ka = `${a.date_of_capture} ${a.time_of_capture}`;
			const kb = `${b.date_of_capture} ${b.time_of_capture}`;
			return ka.localeCompare(kb);
		});
		const byScout = new Map();
		for (const e of sorted) {
			if (!e.scouts_name) continue;
			let coord = e.tree ? treeCoord.get(e.tree) : null;
			if (!coord && e.longitude && e.latitude) {
				coord = [parseFloat(e.longitude), parseFloat(e.latitude)];
			}
			if (!coord) continue;
			if (!byScout.has(e.scouts_name)) byScout.set(e.scouts_name, []);
			byScout.get(e.scouts_name).push(coord);
		}
		const features = [];
		byScout.forEach((coords, scout) => {
			if (coords.length < 2) return;
			features.push({
				type: 'Feature',
				geometry: { type: 'LineString', coordinates: coords },
				properties: { scout, color: scoutColorMap.get(scout) || '#6b7280' },
			});
		});
		return { type: 'FeatureCollection', features };
	}

	function ensureScoutPathLayer() {
		if (map.getSource('scout-paths')) return;
		map.addSource('scout-paths', {
			type: 'geojson',
			data: { type: 'FeatureCollection', features: [] },
		});
		map.addLayer({
			id: 'scout-paths',
			type: 'line',
			source: 'scout-paths',
			layout: { 'line-cap': 'round', 'line-join': 'round' },
			paint: {
				'line-color': ['get', 'color'],
				'line-width': 2.5,
				'line-opacity': 0.85,
			},
		});
	}

	function setScoutPathFilter(visibleScouts) {
		// `null` = show all
		if (!map.getLayer('scout-paths')) return;
		if (!visibleScouts) {
			map.setFilter('scout-paths', null);
		} else {
			map.setFilter('scout-paths', ['in', ['get', 'scout'], ['literal', Array.from(visibleScouts)]]);
		}
	}

	function renderLegend(scoutColors) {
		const legend = document.getElementById('scout-legend');
		legend.innerHTML = '';
		if (!scoutColors.size) {
			legend.innerHTML = '<div class="empty-state"><p>No avocado scouting on this date</p></div>';
			return;
		}
		const visible = new Set(scoutColors.keys());
		scoutColors.forEach((color, name) => {
			const item = document.createElement('label');
			item.className = 'legend-item';
			item.innerHTML = `<input type="checkbox" data-scout="${name}" checked>
				<span class="color-swatch" style="background:${color}"></span>
				<span class="legend-label">${name}</span>`;
			item.querySelector('input').addEventListener('change', (e) => {
				const scout = e.target.dataset.scout;
				if (e.target.checked) visible.add(scout); else visible.delete(scout);
				setScoutPathFilter(visible);
				// Recolor canopies: hide => default, show => scout color
				if (activeTrees && lastScoutingData) {
					const treeColors = buildTreeColorMap(
						(lastScoutingData.scouting_entries || []).filter(en => visible.has(en.scouts_name)),
						scoutColors,
					);
					activeTrees.updateColors(treeColors);
				}
			});
			legend.appendChild(item);
		});
	}

	function renderTimeline(timeline) {
		const section = document.getElementById('timeline-section');
		const container = document.getElementById('scout-timeline');
		if (!timeline || !timeline.length) { section.style.display = 'none'; return; }
		section.style.display = 'block';
		container.innerHTML = '';
		timeline.forEach(t => {
			const formatT = (s) => String(s).slice(0, 5);
			const el = document.createElement('div');
			el.className = 'timeline-item';
			el.innerHTML = `
				<div class="timeline-top">
					<span class="timeline-name">${t.name}</span>
					<span class="timeline-block">${t.block}</span>
				</div>
				<div class="timeline-time">${formatT(t.start)} – ${formatT(t.end)} · ${t.trees} trees · ${(t.minutesPerTree || 0).toFixed(1)} min/tree</div>`;
			container.appendChild(el);
		});
	}

	function updateKPIs(summary, entries) {
		document.getElementById('kpi-scouts').textContent = summary.total_unique_scouts ?? '—';
		document.getElementById('kpi-trees').textContent = summary.total_trees_scouted ?? '—';
		document.getElementById('kpi-blocks').textContent = summary.total_blocks_covered ?? '—';
		const m = summary.average_minutes_per_tree;
		document.getElementById('kpi-min-tree').textContent = m ? Number(m).toFixed(1) : '—';
	}

	// ── Row arrows (per-block, ROW{r}_T{n} parsing) ──────────────────────
	function bearingDeg(a, b) {
		const lat1 = a[1] * Math.PI / 180;
		const lat2 = b[1] * Math.PI / 180;
		const dLon = (b[0] - a[0]) * Math.PI / 180;
		const y = Math.sin(dLon) * Math.cos(lat2);
		const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
		return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
	}

	function buildRowFlow(features) {
		const re = /^(.+)_ROW(\d+)_T\d+$/i;
		const blocks = new Map();
		for (const f of features) {
			const tn = f.properties && f.properties.tree_name;
			const m = tn && tn.match(re);
			if (!m) continue;
			const block = m[1];
			const r = parseInt(m[2], 10);
			if (!blocks.has(block)) blocks.set(block, new Map());
			const rows = blocks.get(block);
			if (!rows.has(r)) rows.set(r, { sx: 0, sy: 0, n: 0 });
			const acc = rows.get(r);
			acc.sx += f.geometry.coordinates[0];
			acc.sy += f.geometry.coordinates[1];
			acc.n += 1;
		}
		const lineFeats = [];
		const ptFeats = [];
		for (const [block, rows] of blocks) {
			const cs = [];
			for (const [r, acc] of rows) cs.push({ r, c: [acc.sx / acc.n, acc.sy / acc.n] });
			cs.sort((a, b) => a.r - b.r);
			if (cs.length < 2) continue;
			const start = cs[0], end = cs[cs.length - 1];
			lineFeats.push({
				type: 'Feature',
				geometry: { type: 'LineString', coordinates: [start.c, end.c] },
				properties: { block },
			});
			ptFeats.push({
				type: 'Feature',
				geometry: { type: 'Point', coordinates: end.c },
				properties: { bearing: bearingDeg(start.c, end.c) },
			});
		}
		return {
			line: { type: 'FeatureCollection', features: lineFeats },
			head: { type: 'FeatureCollection', features: ptFeats },
		};
	}

	function showRowArrows() {
		if (!lastTreeFeatures || !lastTreeFeatures.length) return;
		const data = buildRowFlow(lastTreeFeatures);
		if (!map.getSource('row-flow-line')) {
			map.addSource('row-flow-line', { type: 'geojson', data: data.line });
			map.addSource('row-flow-pts', { type: 'geojson', data: data.head });
			map.addLayer({
				id: 'row-flow-line',
				type: 'line',
				source: 'row-flow-line',
				paint: {
					'line-color': '#1d4ed8',
					'line-width': 3,
					'line-opacity': 0.85,
					'line-dasharray': [2, 1.5],
				},
			});
			map.addLayer({
				id: 'row-flow-head',
				type: 'symbol',
				source: 'row-flow-pts',
				layout: {
					'text-field': '▲',
					'text-size': 26,
					'text-rotate': ['get', 'bearing'],
					'text-rotation-alignment': 'map',
					'text-pitch-alignment': 'map',
					'text-allow-overlap': true,
					'text-anchor': 'center',
				},
				paint: {
					'text-color': '#1d4ed8',
					'text-halo-color': '#ffffff',
					'text-halo-width': 2,
				},
			});
		} else {
			map.getSource('row-flow-line').setData(data.line);
			map.getSource('row-flow-pts').setData(data.head);
		}
	}
	function hideRowArrows() {
		for (const id of ['row-flow-head', 'row-flow-line']) {
			if (map.getLayer(id)) map.removeLayer(id);
		}
		for (const id of ['row-flow-pts', 'row-flow-line']) {
			if (map.getSource(id)) map.removeSource(id);
		}
	}

	// ── Block selection orchestrator ─────────────────────────────────────
	function flyToBlock(block) {
		const f = (BLOCKS_GEOJSON.features || []).find(fe => fe.properties.block === block);
		if (!f || !f.geometry) return;
		// Compute bbox of the polygon
		let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
		const visit = (coords) => {
			if (typeof coords[0] === 'number') {
				if (coords[0] < minX) minX = coords[0];
				if (coords[0] > maxX) maxX = coords[0];
				if (coords[1] < minY) minY = coords[1];
				if (coords[1] > maxY) maxY = coords[1];
			} else {
				coords.forEach(visit);
			}
		};
		visit(f.geometry.coordinates);
		if (isFinite(minX)) {
			map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 80, pitch: 60, duration: 1000 });
		}
	}

	function clearTrees() {
		if (activeTrees && map.getLayer('trees')) {
			map.removeLayer('trees');
			activeTrees = null;
		}
		lastTreeFeatures = null;
		hideRowArrows();
	}

	function flyToFarm(farmName) {
		const c = FARM_DEFAULTS[farmName];
		if (c) {
			map.flyTo({ center: [c.lon, c.lat], zoom: c.zoom, pitch: 60, duration: 800 });
		}
	}

	async function loadScope({ block = '', farm = '' } = {}) {
		clearTrees();
		// Empty hint only when there's no scope at all.
		document.getElementById('empty-hint').style.display = (block || farm) ? 'none' : 'block';
		if (!block && !farm) return;

		const token = ++selectionToken;
		const scopeLabel = block ? 'block' : 'farm';
		showOverlay(`Loading ${scopeLabel} trees…`);
		setProgress(10, `Fetching ${scopeLabel} trees…`);
		if (block) flyToBlock(block);
		else flyToFarm(farm);

		const date = document.getElementById('scout-date-picker').value;
		const [treeFC, scouting] = await Promise.all([
			fetchTrees({ block, farm }),
			fetchScouting(date, block),
		]);
		if (token !== selectionToken) return; // superseded
		setProgress(60, 'Building scene…');

		lastTreeFeatures = treeFC.features || [];
		lastScoutingData = scouting;

		const entries = scouting.scouting_entries || [];
		scoutColorMap = buildScoutColorMap(entries);
		const treeColors = buildTreeColorMap(entries, scoutColorMap);

		if (lastTreeFeatures.length) {
			activeTrees = new TreesLayer(lastTreeFeatures, treeColors);
			map.addLayer(activeTrees);
		}

		// Scout paths
		ensureScoutPathLayer();
		const pathFC = buildScoutPathFC(entries, lastTreeFeatures);
		map.getSource('scout-paths').setData(pathFC);
		setScoutPathFilter(null);

		renderLegend(scoutColorMap);
		renderTimeline(scouting.scout_movement_timeline);
		updateKPIs(scouting.scouting_summary || {}, entries);

		if (document.getElementById('toggle-row-arrows').checked) showRowArrows();

		setProgress(100, 'Ready');
		setTimeout(hideOverlay, 250);
	}

	async function refreshScoutingForCurrentScope() {
		const block = document.getElementById('block-select').value;
		const farm = document.getElementById('farm-select').value;
		if (!block && !farm) return;
		const date = document.getElementById('scout-date-picker').value;
		const token = ++selectionToken;
		const scouting = await fetchScouting(date, block);
		if (token !== selectionToken) return;
		lastScoutingData = scouting;
		const entries = scouting.scouting_entries || [];
		scoutColorMap = buildScoutColorMap(entries);
		const treeColors = buildTreeColorMap(entries, scoutColorMap);
		if (activeTrees) activeTrees.updateColors(treeColors);

		if (map.getSource('scout-paths')) {
			map.getSource('scout-paths').setData(buildScoutPathFC(entries, lastTreeFeatures));
			setScoutPathFilter(null);
		}
		renderLegend(scoutColorMap);
		renderTimeline(scouting.scout_movement_timeline);
		updateKPIs(scouting.scouting_summary || {}, entries);
	}

	// ── Wire up UI ───────────────────────────────────────────────────────
	map.on('load', () => {
		addBlocksLayers();
		buildBlockOptions('');

		// Date picker → today
		const today = new Date().toISOString().slice(0, 10);
		document.getElementById('scout-date-picker').value = today;

		// Default farm: Lokitela if present → load farm-wide.
		const farmSelect = document.getElementById('farm-select');
		const hasLokitela = [...farmSelect.options].some(o => o.value === 'Lokitela');
		if (hasLokitela) {
			farmSelect.value = 'Lokitela';
			buildBlockOptions('Lokitela');
			loadScope({ farm: 'Lokitela' });
		} else {
			document.getElementById('empty-hint').style.display = 'block';
		}
		hideOverlay();
	});

	document.getElementById('farm-select').addEventListener('change', (e) => {
		const farm = e.target.value;
		buildBlockOptions(farm);
		// Reset block selection — farm change implies "look at whole farm"
		document.getElementById('block-select').value = '';
		loadScope({ farm });
	});

	document.getElementById('block-select').addEventListener('change', (e) => {
		const block = e.target.value;
		const farm = document.getElementById('farm-select').value;
		// Empty block + farm set → fall back to farm-wide
		loadScope({ block, farm: block ? '' : farm });
	});

	document.getElementById('scout-date-picker').addEventListener('change', () => {
		refreshScoutingForCurrentScope();
	});

	document.getElementById('toggle-blocks').addEventListener('change', (e) => {
		setBlocksVisibility(e.target.checked);
	});
	document.getElementById('toggle-boundaries').addEventListener('change', (e) => {
		setBoundariesVisibility(e.target.checked);
	});
	document.getElementById('boundary-opacity').addEventListener('input', (e) => {
		const v = parseInt(e.target.value, 10);
		document.getElementById('boundary-opacity-val').textContent = v + '%';
		setBoundaryOpacity(v);
	});
	document.getElementById('toggle-row-arrows').addEventListener('change', (e) => {
		if (e.target.checked) showRowArrows();
		else hideRowArrows();
	});
	document.getElementById('toggle-topdown').addEventListener('change', (e) => {
		if (e.target.checked) {
			savedPitch = map.getPitch();
			savedBearing = map.getBearing();
			map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
		} else {
			map.easeTo({ pitch: savedPitch, bearing: savedBearing, duration: 600 });
		}
	});
	map.on('pitchend', () => {
		const cb = document.getElementById('toggle-topdown');
		const isFlat = map.getPitch() < 1;
		if (cb.checked !== isFlat) cb.checked = isFlat;
	});

	// ── Click-to-name on trees (raycast via projection) ──────────────────
	function nearestTreeAt(point, maxPx = 25) {
		if (!lastTreeFeatures || !lastTreeFeatures.length) return null;
		const px = point.x, py = point.y;
		let best = null, bestD = Infinity;
		for (const f of lastTreeFeatures) {
			const p = map.project(f.geometry.coordinates);
			const d = (p.x - px) ** 2 + (p.y - py) ** 2;
			if (d < bestD) { bestD = d; best = f; }
		}
		return best && bestD < maxPx * maxPx ? best : null;
	}
	map.on('click', (e) => {
		// Skip if click landed on the blocks fill (handled separately)
		const hit = map.queryRenderedFeatures(e.point, { layers: ['blocks-fill'] });
		if (hit && hit.length) return;
		const f = nearestTreeAt(e.point, 20);
		if (!f) return;
		const tn = (f.properties && f.properties.tree_name) || '(unnamed)';
		const tc = (f.properties && f.properties.tree_code) || '';
		const entry = (lastScoutingData?.scouting_entries || []).find(en => en.tree === tn);
		const html = `<div style="font-size:0.8rem;line-height:1.4;">
			<strong>${tc || tn}</strong>
			${entry ? `<br>Scouted by ${entry.scouts_name}` : '<br><span style="color:#9ca3af">Not scouted today</span>'}
		</div>`;
		new maplibregl.Popup({ closeOnClick: true })
			.setLngLat(f.geometry.coordinates)
			.setHTML(html)
			.addTo(map);
	});
</script>
