<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Applications{% endblock %}</title>
		<link rel="stylesheet" href="/assets/frappe/css/frappe-web.css" />

		<script src="/assets/frappe/js/frappe-web.min.js"></script>

		<script src="https://cdn.tailwindcss.com"></script>
		<script>
			tailwind.config = {
				prefix: "tw-",
			};
		</script>

		<style>
			.navbar.navbar-light {
				display: none !important;
			}

			.web-footer {
				display: none !important;
			}

			:root {
				--bg: var(--bg-color, #f5f7fa);
				--panel-bg: var(--fg-color, #ffffff);
				--sidebar-bg: var(--fg-color, #ffffff);

				--text: var(--heading-color, #111827);
				--text-muted: var(--text-color, #6b7280);
				--border: var(--border-color, #e5e7eb);
				--accent: var(--primary, #030303);

				--radius-card: 8px;
				--radius-input: 6px;
				--shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
				--shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
				--hover: var(--gray-100, #f3f4f6);
			}

			html,
			body {
				height: 100%;
				width: 100%;
				overflow: hidden;
				font-family: var(
					--font-stack,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					sans-serif
				);
				background: var(--bg);
				color: var(--text);
			}

			.custom-navbar {
				position: sticky;
				top: 0;
				z-index: 3000;
				background: var(--panel-bg);
				border-bottom: 1px solid var(--border);
				box-shadow: var(--shadow-sm);
			}

			.page-content {
				height: calc(100vh - 52px);
				overflow: auto;
				position: relative;
			}

			#map-loader {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(255, 255, 255, 0.92);
				z-index: 2000;
				display: none;
				justify-content: center;
				align-items: center;
				flex-direction: column;
				color: var(--text-muted);
			}

			[data-theme="dark"] #map-loader {
				background-color: rgba(22, 26, 31, 0.92);
			}

			.spinner {
				border: 3px solid var(--border);
				border-top-color: var(--accent);
				border-radius: 999px;
				width: 40px;
				height: 40px;
				animation: spin 1s linear infinite;
				margin-bottom: 10px;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}

				100% {
					transform: rotate(360deg);
				}
			}
		</style>

		{% block head %}{% endblock %}
	</head>

	<body>
		<header class="custom-navbar">
			{% include "upande_scp/templates/chemical_navbar.html" %}
		</header>

		<main class="page-content">{% block page_content %}{% endblock %}</main>

		{% block script %}{% endblock %}
	</body>
</html>
