<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Maps — Scouting & Crop Protection{% endblock %}</title>
		<link rel="stylesheet" href="/assets/frappe/css/frappe-web.css" />
		<script src="/assets/frappe/js/frappe-web.min.js"></script>
		<script
			type="text/javascript"
			src="/assets/frappe/dist/js/frappe-web.bundle.IFD3LIMJ.js"
		></script>

		<style>
			/* ── Hide Frappe web chrome ── */
			.navbar.navbar-light {
				display: none !important;
			}
			.web-footer {
				display: none !important;
			}

			:root {
				--bg: var(--bg-color, #f5f7fa);
				--panel-bg: var(--fg-color, #ffffff);
				--sidebar-bg: var(--fg-color, #ffffff);

				--text: var(--heading-color, #111827);
				--text-muted: var(--text-color, #6b7280);
				--border: var(--border-color, #e5e7eb);
				--accent: var(--primary, #4f46e5);

				--radius-card: 8px;
				--radius-input: 6px;
				--shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
				--shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
				--hover: var(--gray-100, #f3f4f6);

				--success: #10b981;
				--warning: #f59e0b;
				--danger: #ef4444;
			}

			/* ── Page shell ── */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				height: 100%;
				width: 100%;
				overflow: hidden;
				font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
				background: var(--bg);
				color: var(--text);
			}

			.custom-navbar {
				flex-shrink: 0;
				position: sticky;
				top: 0;
				z-index: 3000;
				background: var(--bg);
			}

			.page-content {
				height: calc(100vh - 52px);
				overflow: auto;
				position: relative;
				display: flex;
				flex-direction: column;
			}

			/* ── Shared loader (overridden per-page if needed) ── */
			#map-loader {
				position: absolute;
				inset: 0;
				background: rgba(255, 255, 255, 0.92);
				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				z-index: 2000;
				gap: 1rem;
			}
			#map-loader.visible {
				display: flex;
			}
			[data-theme="dark"] #map-loader {
				background: rgba(22, 26, 31, 0.92);
			}
			.spinner {
				width: 36px;
				height: 36px;
				border: 3px solid var(--border);
				border-top-color: var(--accent);
				border-radius: 50%;
				animation: spin 0.7s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			.loader-text {
				font-size: 0.875rem;
				font-weight: 500;
				color: var(--text);
			}
		</style>

		{% block head %}{% endblock %}
	</head>

	<body style="display: flex; flex-direction: column">
		<header class="custom-navbar">{% include "upande_scp/templates/map_navbar.html" %}</header>

		<main class="page-content">{% block page_content %}{% endblock %}</main>

		{% block script %}{% endblock %}
	</body>
</html>
