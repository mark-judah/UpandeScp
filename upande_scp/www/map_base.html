<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{% block title %}Maps — Scouting & Crop Protection{% endblock %}</title>
		<link rel="stylesheet" href="/assets/frappe/css/frappe-web.css" />
		<script src="/assets/frappe/js/frappe-web.min.js"></script>
		<script
			type="text/javascript"
			src="/assets/frappe/dist/js/frappe-web.bundle.IFD3LIMJ.js"
		></script>

		<style>
			/* ── Hide Frappe web chrome ── */
			.navbar.navbar-light {
				display: none !important;
			}
			.web-footer {
				display: none !important;
			}

			:root {
				--scp-bw-bg: #ffffff;
				--scp-bw-text: #111111;
				--scp-bw-border: #000000;
				--scp-bw-muted: rgba(0, 0, 0, 0.7);

				--bg: var(--scp-bw-bg);
				--text: var(--scp-bw-text);
				--border: var(--scp-bw-border);
				--accent: var(--scp-bw-border);
				--panel-bg: var(--scp-bw-bg);
				--sidebar-bg: var(--scp-bw-bg);
				--hover: transparent;
				--success: #10b981;
				--warning: #f59e0b;
				--danger: #ef4444;
			}

			/* ── Page shell ── */
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			html,
			body {
				height: 100%;
				width: 100%;
				overflow: hidden;
				font-family: var(
					--font-stack,
					-apple-system,
					BlinkMacSystemFont,
					"Segoe UI",
					Roboto,
					sans-serif
				);
				background: var(--bg);
				color: var(--text);
			}

			.custom-navbar {
				flex-shrink: 0;
				position: sticky;
				top: 0;
				z-index: 3000;
				background: var(--bg);
			}

			.page-content {
				height: calc(100vh - 52px);
				overflow: auto;
				position: relative;
				display: flex;
				flex-direction: column;
			}

			/* ── Shared loader (overridden per-page if needed) ── */
			#map-loader {
				position: absolute;
				inset: 0;
				background: rgba(255, 255, 255, 0.92);
				display: none;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				z-index: 2000;
				gap: 1rem;
			}
			#map-loader.visible {
				display: flex;
			}
			.spinner {
				width: 36px;
				height: 36px;
				border: 3px solid var(--border);
				border-top-color: var(--accent);
				border-radius: 50%;
				animation: spin 0.7s linear infinite;
			}
			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
			.loader-text {
				font-size: 0.875rem;
				font-weight: 500;
				color: var(--text);
			}
		</style>

		{% block head %}{% endblock %}
	</head>

	<body style="display: flex; flex-direction: column">
		<header class="custom-navbar">{% include "upande_scp/templates/map_navbar.html" %}</header>

		<main class="page-content">{% block page_content %}{% endblock %}</main>

		{% block script %}{% endblock %}
	</body>
</html>
