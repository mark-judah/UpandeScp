{% extends "upande_scp/www/map_base.html" %} {% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
	#map-page {
		height: 100%;
		width: 100%;
		display: flex;
		position: relative;
	}

	/* Type pills in floating filter bar */
	#type-pills {
		display: flex;
		gap: 0.3rem;
		flex-wrap: wrap;
		align-items: center;
	}

	.type-pill {
		display: flex;
		align-items: center;
		gap: 0.3rem;
		padding: 0.25rem 0.6rem;
		border: 1px solid #e5e7eb;
		border-radius: 20px;
		background: #ffffff;
		color: #374151;
		font-size: 0.72rem;
		font-weight: 500;
		cursor: pointer;
		white-space: nowrap;
		user-select: none;
	}
	.type-pill.active {
		background: #4b5563;
		border-color: #4b5563;
		color: #ffffff;
	}
	.type-pill .badge {
		font-size: 0.65rem;
		font-weight: 600;
		background: rgba(255, 255, 255, 0.25);
		border-radius: 10px;
		padding: 0 0.35rem;
		line-height: 1.4;
	}
	.type-pill:not(.active) .badge {
		background: #f4f5f6;
		color: #6b7280;
	}
	.type-pill.inactive {
		opacity: 0.4;
	}

	/* ── Summary collapsible details ── */
	.scout-summary-details {
		border-top: 1px solid #e5e7eb;
		padding-top: 8px;
		margin-top: 4px;
	}
	.scout-summary-details summary {
		cursor: pointer;
		font-size: 0.7rem;
		font-weight: 600;
		color: #6b7280;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		list-style: none;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 4px 0;
	}
	.scout-summary-details summary::-webkit-details-marker { display: none; }
	.scout-summary-details summary::after {
		content: "▾";
		font-size: 0.6rem;
		color: #9ca3af;
	}
	.scout-summary-details[open] summary::after { content: "▴"; }
	.scout-summary-details > div {
		padding-top: 6px;
		max-height: 220px;
		overflow-y: auto;
	}

	/* Legend items inside summary */
	.legend-list {
		display: flex;
		flex-direction: column;
		gap: 0.3rem;
	}
	.legend-item {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.35rem 0.5rem;
		border-radius: 6px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		cursor: pointer;
	}
	.legend-item.dimmed { opacity: 0.35; }
	.legend-item input[type="checkbox"] {
		width: 13px;
		height: 13px;
		margin: 0;
		cursor: pointer;
		accent-color: #4b5563;
		flex-shrink: 0;
	}
	.color-dot {
		width: 10px;
		height: 10px;
		border-radius: 50%;
		flex-shrink: 0;
		border: 1px solid #e5e7eb;
	}
	.legend-name {
		flex: 1;
		font-size: 0.75rem;
		font-weight: 500;
		color: #374151;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.legend-count {
		font-size: 0.65rem;
		font-weight: 600;
		padding: 0.05rem 0.35rem;
		border-radius: 10px;
		background: #f4f5f6;
		color: #6b7280;
		flex-shrink: 0;
	}

	.toggle-row {
		display: flex;
		gap: 0.3rem;
		margin-bottom: 0.4rem;
	}
	.toggle-btn {
		font-size: 0.7rem;
		padding: 0.2rem 0.55rem;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		border-radius: 6px;
		cursor: pointer;
		color: #374151;
		font-weight: 500;
	}

	.zones-stat {
		font-size: 0.7rem;
		color: #6b7280;
		padding: 0.15rem 0;
		display: flex;
		align-items: center;
		gap: 0.35rem;
	}
	.zones-stat strong { color: #374151; }

	.empty-panel {
		text-align: center;
		padding: 0.75rem 0.5rem;
		color: #6b7280;
		font-size: 0.72rem;
	}
	.empty-panel svg { display: none; }

	/* ── Map ── */
	#map-container {
		flex: 1;
		position: relative;
		z-index: 1;
	}
	#map {
		height: 100%;
		width: 100%;
	}

	/* ── Map overlay / empty state ── */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(255,255,255,0.93);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.5rem;
	}
	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #2563eb; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }
	#map-empty {
		position: absolute; inset: 0;
		display: none; flex-direction: column;
		align-items: center; justify-content: center;
		gap: 0.75rem; z-index: 1999; color: #94a3b8;
		font-size: 0.875rem; pointer-events: none;
	}

.style-option {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.25rem 0.5rem;
		cursor: pointer;
		border-radius: var(--radius-input);
	}	.style-option label {
		font-size: 0.8125rem;
		cursor: pointer;
	}
	.style-option input {
		width: 14px;
		height: 14px;
		accent-color: var(--text);
		cursor: pointer;
	}

	/* Map popup styling */
	.obs-popup {
		min-width: 200px;
		max-width: 280px;
		font-size: 0.8125rem;
	}
	.obs-popup strong {
		display: block;
		font-size: 0.875rem;
		margin-bottom: 0.5rem;
		border-bottom: 1px solid var(--border);
		padding-bottom: 0.375rem;
	}
	.obs-popup .obs-row {
		display: flex;
		align-items: center;
		gap: 0.4rem;
		padding: 0.2rem 0;
	}
	.obs-popup .obs-dot {
		width: 8px;
		height: 8px;
		border-radius: 50%;
		flex-shrink: 0;
	}
	.obs-popup .obs-name {
		flex: 1;
		font-weight: 500;
	}
	.obs-popup .obs-meta {
		font-size: 0.6875rem;
		color: var(--text-muted);
	}
	.obs-popup .obs-type-header {
		font-size: 0.6875rem;
		font-weight: 700;
		text-transform: uppercase;
		letter-spacing: 0.05em;
		color: var(--text-muted);
		margin: 0.4rem 0 0.2rem;
	}

	.leaflet-control-zoom {
		border: 1px solid var(--border) !important;
				border-radius: var(--radius-card) !important;
		overflow: hidden;
	}
	.leaflet-control-zoom a {
		border: none !important;
		border-bottom: 1px solid var(--border) !important;
		color: var(--text) !important;
		background: var(--panel-bg) !important;
	}
	.leaflet-control-layers {
		border: 1px solid var(--border) !important;
				border-radius: var(--radius-card) !important;
		overflow: hidden;
	}
	.leaflet-popup-content-wrapper {
		border-radius: var(--radius-card) !important;
				border: 1px solid var(--border) !important;
	}

	@media (max-width: 640px) {
		#type-pills .type-pill span:not(.badge) {
			display: none;
		}
	}

	/* ── Greenhouse modal ── */
	.gh-modal {
		position: fixed; inset: 0; z-index: 5000;
		display: none;
		align-items: center; justify-content: center;
	}
	.gh-modal.open { display: flex; }
	.gh-modal-backdrop {
		position: absolute; inset: 0;
		background: rgba(15, 23, 42, 0.55);
		backdrop-filter: blur(2px);
	}
	.gh-modal-content {
		position: relative;
		width: min(1280px, 96vw);
		height: min(880px, 92vh);
		background: #fff;
		border-radius: 10px;
		overflow: hidden;
		display: flex;
		flex-direction: column;
		box-shadow: 0 20px 60px rgba(0,0,0,0.25);
	}
	.gh-modal-header {
		display: flex; align-items: center; justify-content: space-between;
		padding: 12px 16px;
		border-bottom: 1px solid #e5e7eb;
		flex-shrink: 0;
	}
	.gh-modal-titles { display: flex; flex-direction: column; min-width: 0; }
	.gh-modal-title {
		font-size: 1rem; font-weight: 600; color: #111827; margin: 0;
		white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
	}
	.gh-modal-subtitle { font-size: 0.72rem; color: #6b7280; margin-top: 2px; }
	.gh-modal-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
	.gh-modal-btn {
		background: #fff; border: 1px solid #e5e7eb; border-radius: 6px;
		padding: 4px 10px; font-size: 0.75rem; cursor: pointer; color: #374151;
	}
	.gh-modal-btn:hover { background: #f9fafb; }
	.gh-modal-close {
		background: transparent; border: none; cursor: pointer;
		font-size: 1.5rem; line-height: 1; color: #9ca3af; padding: 0 6px;
	}
	.gh-modal-close:hover { color: #374151; }
	.gh-modal-body {
		flex: 1; min-height: 0;
		display: flex;
		overflow: hidden;
	}
	.gh-modal-svg-wrap {
		flex: 1; min-width: 0;
		display: flex; align-items: center; justify-content: center;
		background: #f9fafb;
		padding: 16px;
	}
	.gh-modal-svg-wrap svg {
		width: 100%; height: 100%;
		max-width: 100%; max-height: 100%;
	}
	.gh-modal-side {
		width: 280px;
		border-left: 1px solid #e5e7eb;
		padding: 14px 16px;
		overflow-y: auto;
		background: #fff;
		flex-shrink: 0;
	}
	.gh-side-section-title {
		font-size: 0.68rem; font-weight: 700; color: #6b7280;
		text-transform: uppercase; letter-spacing: 0.05em;
		margin: 10px 0 4px;
	}
	.gh-side-section-title:first-child { margin-top: 0; }
	.gh-side-row {
		display: flex; align-items: center; gap: 6px;
		padding: 3px 0; font-size: 0.78rem; color: #374151;
	}
	.gh-side-row .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
	.gh-side-row .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.gh-side-row .ct { font-size: 0.7rem; color: #6b7280; flex-shrink: 0; }
	.gh-side-empty { color: #94a3b8; font-size: 0.78rem; padding: 10px 0; }
	.gh-side-hint { color: #9ca3af; font-size: 0.7rem; margin-top: 14px; }

	.gh-zone {
		cursor: pointer;
		transition: stroke-opacity 0.12s ease, filter 0.12s ease;
		stroke-linejoin: miter;
		stroke-linecap: butt;
	}
	.gh-zone:hover { filter: brightness(0.85); }
	.gh-zone.selected {
		stroke-opacity: 1 !important;
		filter: brightness(0.82) saturate(1.15);
	}
	.gh-bed-label {
		font-size: 8px;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
		font-weight: 500;
		fill: #6b7280;
		dominant-baseline: middle;
		pointer-events: none;
	}
	.gh-bed-baseline {
		stroke: #cbd5e1;
		stroke-width: 0.6;
		stroke-opacity: 0.55;
		fill: none;
		pointer-events: none;
	}
</style>

<div id="map-page">
	<!-- Map -->
	<div id="map-container">
		<div id="map-loader">
			<span class="map-load-title">Loading observations</span>
			<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
			<span class="map-load-status" id="map-load-status">Initialising…</span>
		</div>
		<div id="map-empty">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40" style="opacity:0.3"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
			<span>No observations on this date</span>
		</div>
		<div id="map"></div>
	</div>

	<!-- Floating filter bar (top) -->
	<div class="scout-filters">
		<div class="scout-filter-item">
			<label for="gh-select">Greenhouse</label>
			<select id="gh-select">
				<option value="">All Greenhouses</option>
				{% for gh in greenhouses_geojson %}

			</select>
		</div>
		<div class="scout-filter-item">

		<div class="scout-filter-pills" id="type-pills"></div>
	</div>

	<!-- Floating summary (bottom-right) -->
	<div class="scout-summary" id="panel">
		<div class="panel-title">Today's Summary</div>
		<div class="scout-summary-grid">
			<div class="scout-stat">
				<div class="scout-stat-label">Zones</div>
				<div class="scout-stat-value" id="stat-zones">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Beds</div>
				<div class="scout-stat-value" id="stat-beds">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Scouts</div>
				<div class="scout-stat-value" id="stat-scouts">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Entries</div>
				<div class="scout-stat-value" id="stat-entries">—</div>
			</div>
		</div>

		<details class="scout-summary-details" id="legend-section" open>
			<summary id="legend-title">Legend</summary>
			<div>
				<div class="toggle-row">
					<button class="toggle-btn" id="select-all-btn">All</button>
					<button class="toggle-btn" id="select-none-btn">None</button>
				</div>
				<div class="zones-stat" id="zones-stat" style="display: none">
					<span id="zones-stat-text"></span>
				</div>
				<div class="legend-list" id="legend-list">
					<div class="empty-panel">Select a date to load data</div>
				</div>
			</div>
		</details>
	</div>

	<!-- Greenhouse upright-view modal -->
	<div class="gh-modal" id="gh-modal" role="dialog" aria-modal="true" aria-hidden="true">
		<div class="gh-modal-backdrop" id="gh-modal-backdrop"></div>
		<div class="gh-modal-content">
			<div class="gh-modal-header">
				<div class="gh-modal-titles">
					<h3 class="gh-modal-title" id="gh-modal-title">Greenhouse</h3>
					<div class="gh-modal-subtitle" id="gh-modal-subtitle"></div>
				</div>
				<div class="gh-modal-actions">
					<button class="gh-modal-btn" id="gh-modal-download" title="Download SVG">Download SVG</button>
					<button class="gh-modal-close" id="gh-modal-close" aria-label="Close">&times;</button>
				</div>
			</div>
			<div class="gh-modal-body">
				<div class="gh-modal-svg-wrap" id="gh-modal-svg-wrap"></div>
				<div class="gh-modal-side" id="gh-modal-side"></div>
			</div>
		</div>
	</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-providers/1.13.0/leaflet-providers.min.js"></script>

<script>
	window.onload = function () {
	    const LAT = {{ lat | tojson }};
	    const LON = {{ lon | tojson }};
	    const ZOOM = {{ default_zoom | tojson }};
	    const CSRF = "{{csrf_token}}";

	    // ── Observation type definitions ──
	    const OBS_TYPES = {
	        pests_scouting_entry:            { label: "Pests",       short: "Pests" },
	        diseases_scouting_entry:         { label: "Diseases",    short: "Diseases" },
	        predators_scouting_entry:        { label: "Predators",   short: "Predators" },
	        weeds_scouting_entry:            { label: "Weeds",       short: "Weeds" },
	        incidents_scouting_entry:        { label: "Incidents",   short: "Incidents" },
	        physiological_disorders_entry:   { label: "Disorders",   short: "Disorders" }
	    };

	    // ── State ──
	    let activeType = "pests_scouting_entry";
	    let activeData = null;           // last API response
	    let hiddenItems = new Set();     // unchecked observation names
	    let abortCtrl = null;
	    let mapInitialized = false;
	    let zoneLayer = null;
	    let lineLabels = null;

	    // Zone GeoJSON parse cache: zone.name → parsed object
	    const zoneCache = new Map();
	    // Client-side data cache: "date_greenhouse" → API response
	    const dataCache = new Map();

	    // Canvas renderer for performance
	    const canvasRenderer = L.canvas({ padding: 0.5 });

	    // ── DOM refs ──
	    const ghSelect   = document.getElementById('gh-select');
	    const datePicker = document.getElementById('date-picker');
	    const typePills  = document.getElementById('type-pills');
	    const legendList = document.getElementById('legend-list');
	    const legendTitle = document.getElementById('legend-title');
	    const zonesStat  = document.getElementById('zones-stat');
	    const zonesStatText = document.getElementById('zones-stat-text');

	    const setProgress = (pct) => {
	        const fill = document.getElementById('map-load-fill');
	        const status = document.getElementById('map-load-status');
	        if (fill) fill.style.width = Math.min(100, pct) + '%';
	        if (status) status.textContent = Math.round(Math.min(100, pct)) + '%';
	    };

	    const streamResponse = (response, onProgress) => {
	        const contentLength = response.headers.get('content-length');
	        const reader = response.body.getReader();
	        const chunks = [];
	        let received = 0;
	        const ESTIMATE = 600 * 1024;
	        const read = () => reader.read().then(({ done, value }) => {
	            if (done) {
	                const buf = new Uint8Array(received);
	                let pos = 0;
	                for (const c of chunks) { buf.set(c, pos); pos += c.length; }
	                if (onProgress) onProgress(83, 'Parsing response…');
	                return JSON.parse(new TextDecoder().decode(buf));
	            }
	            chunks.push(value);
	            received += value.length;
	            if (onProgress) {
	                const pct = contentLength
	                    ? 48 + (received / +contentLength) * 33
	                    : 48 + Math.min(received / ESTIMATE, 1) * 33;
	                onProgress(pct);
	            }
	            return read();
	        });
	        return read();
	    };

	    const showOverlay = () => {
	        setProgress(0, 'Initialising…');
	        document.getElementById('map-loader').style.display = 'flex';
	        document.getElementById('map-empty').style.display = 'none';
	    };
	    const hideOverlay = (empty = false) => {
	        document.getElementById('map-loader').style.display = 'none';
	        document.getElementById('map-empty').style.display = empty ? 'flex' : 'none';
	    };

	    function debounce(fn, ms) {
	        let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
	    }

	    function parseZone(zone) {
	        if (!zoneCache.has(zone.name)) {
	            try { zoneCache.set(zone.name, JSON.parse(zone.raw_geojson)); }
	            catch { zoneCache.set(zone.name, null); }
	        }
	        return zoneCache.get(zone.name);
	    }

	    function getZoneCoords(geo) {
	        if (!geo?.features?.length) return [];
	        const coords = [];
	        geo.features.forEach(f => {
	            if (f.geometry?.coordinates) {
	                f.geometry.coordinates.forEach(c => coords.push([c[1], c[0]]));
	            }
	        });
	        return coords;
	    }

	    function intensityToOpacity(count, maxCount) {
	        if (!count || !maxCount) return 0;
	        const ratio = count / maxCount;
	        return 0.15 + ratio * 0.75; // 0.15 → 0.9
	    }

	    // ── Build zone → observations map for active type ──
	    function buildZoneObsMap(data, type) {
	        const result = {}; // zone_name → { obs_name → {color, totalCount, stage, plant_section} }
	        for (const entry of (data.scouting_entries || [])) {
	            const obs = entry[type] || [];
	            for (const o of obs) {
	                if (!result[entry.zone]) result[entry.zone] = {};
	                if (!result[entry.zone][o.name]) {
	                    result[entry.zone][o.name] = { color: o.color || '#999', count: 0, stage: o.stage, plant_section: o.plant_section };
	                }
	                result[entry.zone][o.name].count += (o.count || 1);
	            }
	        }
	        return result;
	    }

	    // Build full popup: all types present in this zone
	    function buildZoneAllObs(data, zoneName) {
	        const result = {}; // type → { obs_name → {color, count, stage, plant_section} }
	        for (const entry of (data.scouting_entries || [])) {
	            if (entry.zone !== zoneName) continue;
	            for (const type of Object.keys(OBS_TYPES)) {
	                const obs = entry[type] || [];
	                for (const o of obs) {
	                    if (!result[type]) result[type] = {};
	                    if (!result[type][o.name]) {
	                        result[type][o.name] = { color: o.color || '#999', count: 0, stage: o.stage, plant_section: o.plant_section };
	                    }
	                    result[type][o.name].count += (o.count || 1);
	                }
	            }
	        }
	        return result;
	    }

	    function buildPopupHTML(zoneName, allObs) {
	        let html = `<div class="obs-popup"><strong>${zoneName}</strong>`;
	        let hasAny = false;
	        for (const [type, items] of Object.entries(allObs)) {
	            if (!Object.keys(items).length) continue;
	            hasAny = true;
	            const meta = OBS_TYPES[type] || {};
	            html += `<div class="obs-type-header">${meta.label || type}</div>`;
	            for (const [name, info] of Object.entries(items)) {
	                html += `<div class="obs-row">
	                    <span class="obs-dot" style="background:${info.color}"></span>
	                    <span class="obs-name">${name}</span>
	                    <span class="obs-meta">×${info.count}${info.stage ? ' · '+info.stage : ''}${info.plant_section ? ' · '+info.plant_section : ''}</span>
	                </div>`;
	            }
	        }
	        if (!hasAny) html += '<div style="color:#94a3b8;font-size:0.75rem;padding:0.5rem 0">No observations recorded</div>';
	        html += '</div>';
	        return html;
	    }

	    // ── Greenhouse upright-view modal ──
	    const ghOf = (zoneName) => zoneName ? zoneName.split(' - ')[0] : '';

	    function pcaAngle(points, latScale) {
	        // Fallback: principal axis from vertex distribution
	        const n = points.length;
	        if (n < 2) return 0;
	        let mx = 0, my = 0;
	        for (const [lng, lat] of points) { mx += lng * latScale; my += lat; }
	        mx /= n; my /= n;
	        let cxx = 0, cxy = 0, cyy = 0;
	        for (const [lng, lat] of points) {
	            const dx = lng * latScale - mx, dy = lat - my;
	            cxx += dx * dx; cxy += dx * dy; cyy += dy * dy;
	        }
	        return 0.5 * Math.atan2(2 * cxy, cxx - cyy);
	    }

	    // Average direction of all bed lines (geojson features), weighted by length.
	    // Uses the axial (double-angle) mean to handle 180° ambiguity.
	    function bedLineAngle(zones, latScale) {
	        let sumCos = 0, sumSin = 0, found = false;
	        for (const z of zones) {
	            for (const ring of z.rings) {
	                if (!ring || ring.length < 2) continue;
	                const first = ring[0], last = ring[ring.length - 1];
	                const dx = (last[0] - first[0]) * latScale;
	                const dy = last[1] - first[1];
	                const len2 = dx*dx + dy*dy;
	                if (len2 < 1e-20) continue;
	                const a = Math.atan2(dy, dx);
	                const len = Math.sqrt(len2);
	                sumCos += Math.cos(2*a) * len;
	                sumSin += Math.sin(2*a) * len;
	                found = true;
	            }
	        }
	        if (!found) return null;
	        return 0.5 * Math.atan2(sumSin, sumCos);
	    }

	    function buildGreenhouseSVG(ghName, data) {
	        const ghZones = (data.all_zones_geojson || []).filter(z => ghOf(z.name) === ghName);
	        if (!ghZones.length) return null;

	        // Collect rings per zone (each "feature" in geojson = one row/line)
	        const zones = [];
	        const allPoints = [];
	        for (const zone of ghZones) {
	            const geo = parseZone(zone);
	            if (!geo?.features) continue;
	            const rings = [];
	            const lineIds = [];
	            geo.features.forEach(f => {
	                const c = f.geometry?.coordinates;
	                if (Array.isArray(c) && c.length) {
	                    const ring = c.map(p => [p[0], p[1]]);
	                    rings.push(ring);
	                    lineIds.push(f.properties?.line_id ?? null);
	                    allPoints.push(...ring);
	                }
	            });
	            if (rings.length) zones.push({ name: zone.name, rings, lineIds });
	        }
	        if (!allPoints.length) return null;

	        // Equirectangular projection: scale lng by cos(meanLat) to preserve aspect
	        let sumLat = 0;
	        for (const [, lat] of allPoints) sumLat += lat;
	        const meanLat = sumLat / allPoints.length;
	        const latScale = Math.cos(meanLat * Math.PI / 180);

	        // Bed direction from line features (fall back to PCA on outline if unavailable).
	        // Rotate so beds run horizontally (parallel to screen width, left→right).
	        let bedDir = bedLineAngle(zones, latScale);
	        if (bedDir === null) bedDir = pcaAngle(allPoints, latScale);
	        const rot = -bedDir;
	        const cos = Math.cos(rot), sin = Math.sin(rot);

	        // Centroid in scaled coords
	        let cxRaw = 0, cyRaw = 0;
	        for (const [lng, lat] of allPoints) { cxRaw += lng * latScale; cyRaw += lat; }
	        cxRaw /= allPoints.length; cyRaw /= allPoints.length;

	        const project = ([lng, lat]) => {
	            const x = lng * latScale - cxRaw;
	            const y = lat - cyRaw;
	            return [x * cos - y * sin, x * sin + y * cos];
	        };

	        // Rotate every ring + bounding box
	        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
	        const projected = zones.map(z => {
	            const rings = z.rings.map(ring => {
	                const out = ring.map(project);
	                for (const [x, y] of out) {
	                    if (x < minX) minX = x; if (x > maxX) maxX = x;
	                    if (y < minY) minY = y; if (y > maxY) maxY = y;
	                }
	                return out;
	            });
	            return { name: z.name, rings, lineIds: z.lineIds };
	        });

	        const w = maxX - minX, h = maxY - minY;
	        if (w === 0 || h === 0) return null;

	        // Cluster the *raw rings* (not aggregated beds) into horizontal
	        // blocks. Critical: line_id can repeat across blocks (e.g. each
	        // block restarts numbering at 1), so aggregating by line_id first
	        // would merge a block-1 bed with its block-2 namesake into one
	        // entry that spans the whole greenhouse — hiding the gap and
	        // producing baselines that stretch across every block.
	        const allRings = [];
	        for (const z of projected) {
	            for (let i = 0; i < z.rings.length; i++) {
	                const lid = z.lineIds[i];
	                const ring = z.rings[i];
	                if (lid == null || lid === '' || !ring.length) continue;
	                let sx = 0, sy = 0, mn = Infinity, mx = -Infinity;
	                for (const [x, y] of ring) {
	                    sx += x; sy += y;
	                    if (x < mn) mn = x;
	                    if (x > mx) mx = x;
	                }
	                allRings.push({
	                    lid, ring,
	                    cx: sx / ring.length,
	                    cy: sy / ring.length,
	                    minX: mn, maxX: mx
	                });
	            }
	        }
	        // Sweep by ring centroid x; a gap > 5% of total greenhouse width
	        // starts a new block.
	        const sortedRings = allRings.slice().sort((a, b) => a.cx - b.cx);
	        const GAP_THRESHOLD = w * 0.05;
	        const blocks = [];
	        for (const r of sortedRings) {
	            const last = blocks[blocks.length - 1];
	            if (!last || r.cx > last.maxX + GAP_THRESHOLD) {
	                blocks.push({ rings: [r], minX: r.minX, maxX: r.maxX });
	            } else {
	                last.rings.push(r);
	                if (r.maxX > last.maxX) last.maxX = r.maxX;
	                if (r.minX < last.minX) last.minX = r.minX;
	            }
	        }
	        // Group each block's rings by line_id → that block's beds. Each bed
	        // gets bbox + centroid for baseline / label / thickness math.
	        for (const blk of blocks) {
	            const bedMap = {};
	            for (const r of blk.rings) {
	                if (!bedMap[r.lid]) bedMap[r.lid] = { lid: r.lid, pts: [] };
	                for (const p of r.ring) bedMap[r.lid].pts.push(p);
	            }
	            blk.beds = Object.values(bedMap).map(b => {
	                let mn = Infinity, mx = -Infinity, sx = 0, sy = 0;
	                for (const [x, y] of b.pts) {
	                    if (x < mn) mn = x;
	                    if (x > mx) mx = x;
	                    sx += x; sy += y;
	                }
	                return {
	                    lid: b.lid,
	                    minX: mn, maxX: mx,
	                    cx: sx / b.pts.length,
	                    cy: sy / b.pts.length
	                };
	            });
	        }
	        // Flat list across blocks — used by the thickness clustering.
	        const bedMeta = blocks.flatMap(blk => blk.beds);

	        // Only block 1's labels need a margin (they hang off the left edge).
	        // Subsequent blocks' labels live inside the inter-block gaps.
	        const PAD = 16;
	        const LABEL_MARGIN = 24;
	        const padLeft = LABEL_MARGIN;
	        const padRight = PAD;
	        const TARGET_W = 1100, TARGET_H = 760;
	        const scale = Math.min((TARGET_W - padLeft - padRight) / w, (TARGET_H - 2*PAD) / h);
	        const svgW = w * scale + padLeft + padRight;
	        const svgH = h * scale + 2*PAD;

	        // SVG y grows downward → flip y
	        const toSvg = ([x, y]) => [
	            padLeft + (x - minX) * scale,
	            PAD + (maxY - y) * scale
	        ];

	        // Bed thickness: cluster centroids on each axis — the perpendicular
	        // (stack) axis is the one with more clusters, since every bed has a
	        // distinct centre in that direction. Use that axis's extent divided
	        // by the cluster count to get true row spacing, regardless of
	        // whether beds end up horizontal or vertical after rotation.
	        const countClusters = (vals, tol) => {
	            if (!vals.length) return 1;
	            const s = vals.slice().sort((a, b) => a - b);
	            let n = 1;
	            for (let i = 1; i < s.length; i++) {
	                if (s[i] - s[i-1] > tol) n++;
	            }
	            return n;
	        };
	        const yCenters = bedMeta.map(b => b.cy);
	        const xCenters = bedMeta.map(b => b.cx);
	        const yClusters = countClusters(yCenters, h * 0.02);
	        const xClusters = countClusters(xCenters, w * 0.02);
	        const stackExtent = ((yClusters >= xClusters) ? h : w) * scale;
	        const stackedBeds = Math.max(1, Math.max(yClusters, xClusters));
	        const bedSpacing = stackExtent / stackedBeds;
	        const bedThickness = Math.max(1.5, Math.min(4, bedSpacing * 0.25));

	        // Observations / colors per zone (active type, current filters)
	        const zoneObsMap = buildZoneObsMap(data, activeType);
	        const zoneCounts = {};
	        for (const [zn, items] of Object.entries(zoneObsMap)) {
	            let total = 0;
	            for (const [n, info] of Object.entries(items)) {
	                if (!hiddenItems.has(n)) total += info.count;
	            }
	            if (total > 0) zoneCounts[zn] = total;
	        }
	        const maxCount = Math.max(...Object.values(zoneCounts), 1);

	        // Layer 1 — baselines: one faint line per bed, capped at *its own
	        // block's* extent (NOT the whole greenhouse). Block 2 stops at
	        // block 2's left edge; it does not bleed into block 1.
	        let baselines = '';
	        for (const blk of blocks) {
	            for (const bed of blk.beds) {
	                const [x0, y0] = toSvg([blk.maxX, bed.cy]);
	                const [x1, y1] = toSvg([blk.minX, bed.cy]);
	                baselines += `<line class="gh-bed-baseline" x1="${x0.toFixed(2)}" y1="${y0.toFixed(2)}" x2="${x1.toFixed(2)}" y2="${y1.toFixed(2)}"/>`;
	            }
	        }

	        // Layer 2 — coloured zone polylines (one per bed-segment in the
	        // zone, so a bed reads as a continuous line with colour changes
	        // at zone boundaries).
	        let body = '';
	        for (const z of projected) {
	            const count = zoneCounts[z.name] || 0;
	            const items = zoneObsMap[z.name] || {};
	            const visible = Object.entries(items).filter(([n]) => !hiddenItems.has(n));
	            let color = '#cbd5e1';
	            if (visible.length) {
	                visible.sort((a, b) => b[1].count - a[1].count);
	                color = visible[0][1].color;
	            }
	            const hasObs = count > 0;
	            const ratio = hasObs ? Math.min(1, count / maxCount) : 0;
	            const opacity = hasObs ? (0.7 + ratio * 0.3) : 0.55;
	            const safeName = z.name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

	            for (const ring of z.rings) {
	                if (ring.length < 2) continue;
	                const pts = ring.map(p => toSvg(p).join(',')).join(' ');
	                body += `<polyline class="gh-zone" data-zone="${safeName}" points="${pts}" `
	                    + `fill="none" stroke="${color}" stroke-width="${bedThickness.toFixed(2)}" `
	                    + `stroke-opacity="${opacity}">`
	                    + `<title>${safeName}${hasObs ? ' · ' + count : ''}</title></polyline>`;
	            }
	        }

	        // Layer 3 — bed numbers, always on the LEFT side of the bed. For
	        // block 1 that's the greenhouse's left margin; for any block N>1
	        // it lands in the gap between block N-1 and block N.
	        let labels = '';
	        for (const blk of blocks) {
	            for (const bed of blk.beds) {
	                const [ix, iy] = toSvg([blk.minX, bed.cy]);
	                const safeLid = String(bed.lid).replace(/&/g, '&amp;').replace(/</g, '&lt;');
	                labels += `<text class="gh-bed-label" x="${(ix - 4).toFixed(2)}" y="${iy.toFixed(2)}" text-anchor="end">${safeLid}</text>`;
	            }
	        }

	        return {
	            svg: `<svg viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${baselines}${body}${labels}</svg>`,
	            width: svgW, height: svgH
	        };
	    }

	    function buildGhSummaryHTML(ghName, data) {
	        const ghEntries = (data.scouting_entries || []).filter(e => ghOf(e.zone) === ghName);
	        const obsByType = {};
	        for (const entry of ghEntries) {
	            for (const type of Object.keys(OBS_TYPES)) {
	                for (const obs of (entry[type] || [])) {
	                    if (!obsByType[type]) obsByType[type] = {};
	                    if (!obsByType[type][obs.name]) {
	                        obsByType[type][obs.name] = { color: obs.color || '#999', count: 0 };
	                    }
	                    obsByType[type][obs.name].count += (obs.count || 1);
	                }
	            }
	        }

	        const zonesScouted = new Set(ghEntries.map(e => e.zone)).size;
	        let html = `<div class="gh-side-section-title">Greenhouse summary</div>`;
	        html += `<div class="gh-side-row"><span class="nm">Entries</span><span class="ct">${ghEntries.length}</span></div>`;
	        html += `<div class="gh-side-row"><span class="nm">Zones scouted</span><span class="ct">${zonesScouted}</span></div>`;

	        let any = false;
	        for (const [type, items] of Object.entries(obsByType)) {
	            if (!Object.keys(items).length) continue;
	            any = true;
	            const meta = OBS_TYPES[type] || {};
	            html += `<div class="gh-side-section-title">${meta.label}</div>`;
	            const sorted = Object.entries(items).sort((a, b) => b[1].count - a[1].count);
	            for (const [name, info] of sorted) {
	                html += `<div class="gh-side-row">`
	                    + `<span class="dot" style="background:${info.color}"></span>`
	                    + `<span class="nm" title="${name}">${name}</span>`
	                    + `<span class="ct">×${info.count}</span></div>`;
	            }
	        }
	        if (!any) html += '<div class="gh-side-empty">No observations recorded</div>';
	        html += '<div class="gh-side-hint">Click a zone to see its details.</div>';
	        return html;
	    }

	    function buildZoneDetailHTML(zoneName, data) {
	        const allObs = buildZoneAllObs(data, zoneName);
	        const shortZone = zoneName.split(' - ').slice(1).join(' - ') || zoneName;
	        let html = `<div class="gh-side-section-title">${shortZone}</div>`;
	        let any = false;
	        for (const [type, items] of Object.entries(allObs)) {
	            if (!Object.keys(items).length) continue;
	            any = true;
	            const meta = OBS_TYPES[type] || {};
	            html += `<div class="gh-side-section-title">${meta.label}</div>`;
	            for (const [name, info] of Object.entries(items)) {
	                html += `<div class="gh-side-row">`
	                    + `<span class="dot" style="background:${info.color}"></span>`
	                    + `<span class="nm" title="${name}">${name}</span>`
	                    + `<span class="ct">×${info.count}${info.stage ? ' · '+info.stage : ''}</span></div>`;
	            }
	        }
	        if (!any) html += '<div class="gh-side-empty">No observations recorded for this zone</div>';
	        return html;
	    }

	    let _ghModalCurrent = null; // { ghName, data }

	    function openGhModal(ghName) {
	        if (!activeData) return;
	        const built = buildGreenhouseSVG(ghName, activeData);
	        if (!built) return;

	        _ghModalCurrent = { ghName, data: activeData };

	        document.getElementById('gh-modal-title').textContent = ghName;
	        const ghEntries = (activeData.scouting_entries || []).filter(e => ghOf(e.zone) === ghName);
	        const zonesScouted = new Set(ghEntries.map(e => e.zone)).size;
	        document.getElementById('gh-modal-subtitle').textContent =
	            `${ghEntries.length} ${ghEntries.length === 1 ? 'entry' : 'entries'} · `
	            + `${zonesScouted} zone${zonesScouted !== 1 ? 's' : ''} scouted · `
	            + (OBS_TYPES[activeType]?.label || activeType);

	        document.getElementById('gh-modal-svg-wrap').innerHTML = built.svg;
	        document.getElementById('gh-modal-side').innerHTML = buildGhSummaryHTML(ghName, activeData);

	        document.querySelectorAll('#gh-modal-svg-wrap .gh-zone').forEach(p => {
	            p.addEventListener('click', () => {
	                const zoneName = p.getAttribute('data-zone');
	                document.querySelectorAll('#gh-modal-svg-wrap .gh-zone.selected')
	                    .forEach(s => s.classList.remove('selected'));
	                p.classList.add('selected');
	                document.getElementById('gh-modal-side').innerHTML =
	                    buildZoneDetailHTML(zoneName, activeData);
	            });
	        });

	        const modal = document.getElementById('gh-modal');
	        modal.classList.add('open');
	        modal.setAttribute('aria-hidden', 'false');
	    }

	    function closeGhModal() {
	        const modal = document.getElementById('gh-modal');
	        modal.classList.remove('open');
	        modal.setAttribute('aria-hidden', 'true');
	        _ghModalCurrent = null;
	    }

	    function downloadGhSvg() {
	        if (!_ghModalCurrent) return;
	        const svgEl = document.querySelector('#gh-modal-svg-wrap svg');
	        if (!svgEl) return;
	        const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(svgEl);
	        const blob = new Blob([xml], { type: 'image/svg+xml' });
	        const url = URL.createObjectURL(blob);
	        const a = document.createElement('a');
	        a.href = url;
	        a.download = `${_ghModalCurrent.ghName.replace(/[^\w\-]+/g, '_')}.svg`;
	        document.body.appendChild(a); a.click(); a.remove();
	        setTimeout(() => URL.revokeObjectURL(url), 0);
	    }

	    document.getElementById('gh-modal-close').addEventListener('click', closeGhModal);
	    document.getElementById('gh-modal-backdrop').addEventListener('click', closeGhModal);
	    document.getElementById('gh-modal-download').addEventListener('click', downloadGhSvg);
	    document.addEventListener('keydown', (e) => {
	        if (e.key === 'Escape' && document.getElementById('gh-modal').classList.contains('open')) {
	            closeGhModal();
	        }
	    });

	    // ── Render zone fill layer ──
	    function renderZoneFills(data) {
	        if (zoneLayer) { window.map.removeLayer(zoneLayer); zoneLayer = null; }
	        if (lineLabels) { window.map.removeLayer(lineLabels); lineLabels = null; }
	        if (!data) return;

	        const zoneObsMap = buildZoneObsMap(data, activeType);
	        const allNames = data.all_observation_names?.[activeType] || [];
	        const activeNames = allNames.filter(n => !hiddenItems.has(n.name));

	        // Compute per-zone counts for intensity (only visible items)
	        const zoneCounts = {};
	        for (const [zoneName, items] of Object.entries(zoneObsMap)) {
	            let total = 0;
	            for (const [name, info] of Object.entries(items)) {
	                if (!hiddenItems.has(name)) total += info.count;
	            }
	            if (total > 0) zoneCounts[zoneName] = total;
	        }
	        const maxCount = Math.max(...Object.values(zoneCounts), 1);

	        const features = [];
	        const lineMap = {};

	        for (const zone of (data.all_zones_geojson || [])) {
	            if (!zone.name) continue;
	            const geo = parseZone(zone);
	            if (!geo?.features) continue;

	            const ghName = zone.name.split(' - ')[0];
	            geo.features.forEach(f => {
	                const lid = f.properties?.line_id;
	                const key = `${ghName}_${lid}`;
	                if (!lineMap[key]) lineMap[key] = [];
	                lineMap[key].push(f.geometry.coordinates.map(c => [c[1], c[0]]));
	            });

	            const coords = getZoneCoords(geo);
	            if (!coords.length) continue;

	            const count = zoneCounts[zone.name] || 0;
	            const zoneItems = zoneObsMap[zone.name] || {};
	            const visibleItems = Object.entries(zoneItems).filter(([n]) => !hiddenItems.has(n));

	            // Dominant color: highest-count visible item
	            let dominantColor = '#94a3b8';
	            if (visibleItems.length) {
	                visibleItems.sort((a, b) => b[1].count - a[1].count);
	                dominantColor = visibleItems[0][1].color;
	            }

	            const opacity = intensityToOpacity(count, maxCount);
	            const hasObs = count > 0;

	            // Build a GeoJSON polygon feature from the coordinates
	            // Close the ring by adding first coord at end if needed
	            const ring = [...coords];
	            if (ring.length > 1) {
	                const first = ring[0], last = ring[ring.length - 1];
	                if (first[0] !== last[0] || first[1] !== last[1]) ring.push(first);
	            }

	            features.push({
	                type: 'Feature',
	                geometry: {
	                    type: 'Polygon',
	                    coordinates: [ring.map(c => [c[1], c[0]])] // back to [lng, lat] for GeoJSON
	                },
	                properties: {
	                    zone_name: zone.name,
	                    fill_color: hasObs ? dominantColor : 'transparent',
	                    fill_opacity: hasObs ? opacity : 0,
	                    stroke_color: hasObs ? dominantColor : '#94a3b8',
	                    stroke_weight: hasObs ? 4 : 0.5,
	                    has_obs: hasObs
	                }
	            });
	        }

	        zoneLayer = L.geoJSON({ type: 'FeatureCollection', features }, {
	            renderer: canvasRenderer,
	            style: f => ({
	                fillColor: f.properties.fill_color,
	                fillOpacity: f.properties.fill_opacity,
	                color: f.properties.stroke_color,
	                weight: f.properties.stroke_weight,
	                opacity: 0.7
	            }),
	            onEachFeature: (f, layer) => {
	                const zoneName = f.properties.zone_name;
	                if (!zoneName) return;
	                layer.bindTooltip(zoneName, { sticky: true, className: '' });
	                layer.on('click', () => {
	                    const gh = ghOf(zoneName);
	                    if (gh) openGhModal(gh);
	                });
	            }
	        });

	        // Build line-id labels
	        lineLabels = L.layerGroup();
	        Object.values(lineMap).forEach(coordSets => {
	            if (!coordSets.length) return;
	            const all = coordSets.flat();
	            if (!all.length) return;
	            const pt = all[0];
	            // We don't have line_id easily here, skip labels (or could rebuild from features)
	        });

	        window.map.on('zoomend', () => {
	            const z = window.map.getZoom();
	            if (z >= 15) { if (!window.map.hasLayer(zoneLayer)) zoneLayer.addTo(window.map); }
	            else { if (zoneLayer && window.map.hasLayer(zoneLayer)) window.map.removeLayer(zoneLayer); }
	        });

	        const z = window.map.getZoom();
	        if (z >= 15) zoneLayer.addTo(window.map);

	        // Update zones-affected stat
	        const affectedZones = Object.keys(zoneCounts).length;
	        if (affectedZones > 0) {
	            zonesStat.style.display = 'flex';
	            zonesStatText.textContent = `${affectedZones} zone${affectedZones !== 1 ? 's' : ''} with observations`;
	        } else {
	            zonesStat.style.display = 'none';
	        }
	    }

	    // ── Type pills ──
	    function renderTypePills(data) {
	        typePills.innerHTML = '';
	        const activeCounts = data?.all_observation_names || {};
	        const activeTypes = data?.active_observation_types || [];

	        for (const [type, cfg] of Object.entries(OBS_TYPES)) {
	            const names = activeCounts[type] || [];
	            const count = names.reduce((s, n) => {
	                // Sum all counts across entries for this type
	                let c = 0;
	                for (const entry of (data?.scouting_entries || [])) {
	                    for (const obs of (entry[type] || [])) { c += (obs.count || 1); }
	                }
	                return s + c; // just count items for now
	            }, 0);

	            const totalCount = names.length; // number of unique observations
	            const isActive = type === activeType;
	            const hasData = activeTypes.includes(type);

	            const pill = document.createElement('button');
	            pill.className = `type-pill${isActive ? ' active' : ''}${!hasData ? ' inactive' : ''}`;
	            pill.dataset.type = type;
	            pill.innerHTML = `<span>${cfg.short}</span><span class="badge">${totalCount}</span>`;
	            pill.addEventListener('click', () => {
	                activeType = type;
	                document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
	                pill.classList.add('active');
	                renderLegend(data);
	                renderZoneFills(data);
	            });
	            typePills.appendChild(pill);
	        }
	    }

	    // ── Legend ──
	    function renderLegend(data) {
	        const meta = OBS_TYPES[activeType] || {};
	        legendTitle.textContent = meta.label || activeType;

	        const names = data?.all_observation_names?.[activeType] || [];
	        if (!names.length) {
	            legendList.innerHTML = '<div class="empty-panel"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>No data for this date</div>';
	            zonesStat.style.display = 'none';
	            return;
	        }

	        // Count per observation name across all entries
	        const obsCounts = {};
	        for (const entry of (data?.scouting_entries || [])) {
	            for (const obs of (entry[activeType] || [])) {
	                obsCounts[obs.name] = (obsCounts[obs.name] || 0) + (obs.count || 1);
	            }
	        }

	        legendList.innerHTML = '';
	        names.sort((a, b) => (obsCounts[b.name] || 0) - (obsCounts[a.name] || 0));

	        for (const item of names) {
	            const count = obsCounts[item.name] || 0;
	            const hidden = hiddenItems.has(item.name);
	            const el = document.createElement('label');
	            el.className = `legend-item${hidden ? ' dimmed' : ''}`;
	            el.innerHTML = `
	                <input type="checkbox" ${hidden ? '' : 'checked'} data-name="${item.name}">
	                <span class="color-dot" style="background:${item.color}"></span>
	                <span class="legend-name" title="${item.name}">${item.name}</span>
	                <span class="legend-count">${count}</span>`;
	            el.querySelector('input').addEventListener('change', e => {
	                if (e.target.checked) hiddenItems.delete(item.name);
	                else hiddenItems.add(item.name);
	                el.classList.toggle('dimmed', !e.target.checked);
	                renderZoneFills(data);
	            });
	            legendList.appendChild(el);
	        }

	        // All / None buttons
	        document.getElementById('select-all-btn').onclick = () => {
	            hiddenItems.clear();
	            renderLegend(data);
	            renderZoneFills(data);
	        };
	        document.getElementById('select-none-btn').onclick = () => {
	            for (const item of names) hiddenItems.add(item.name);
	            renderLegend(data);
	            renderZoneFills(data);
	        };
	    }

	    // ── Summary stats ──
	    function renderSummary(data) {
	        const s = data?.summary || {};
	        const entries = data?.scouting_entries?.length || 0;
	        document.getElementById('stat-zones').textContent = s.zones_scouted ?? '—';
	        document.getElementById('stat-beds').textContent = s.beds_count ?? '—';
	        document.getElementById('stat-scouts').textContent = s.scouts_count ?? '—';
	        document.getElementById('stat-entries').textContent = entries;
	    }

	    // ── Render from cached data ──
	    const _renderObsData = (data, onProgress = () => {}) => {
	        activeData = data;
	        onProgress(86, 'Drawing zones…');
	        renderZoneFills(data);
	        onProgress(93, 'Updating legend…');
	        renderSummary(data);
	        renderTypePills(data);
	        renderLegend(data);
	        onProgress(98, 'Updating summary…');
	        onProgress(100, 'Complete');
	        setTimeout(() => hideOverlay(false), 350);
	    };

	    // ── Fetch observations (background=true silently pre-populates cache) ──
	    function fetchObservations(date, greenhouse, background = false) {
	        const cacheKey = `${date}_${greenhouse || ''}`;

	        // Cache hit — render immediately, no network request
	        if (dataCache.has(cacheKey)) {
	            if (!background) {
	                showOverlay();
	                _renderObsData(dataCache.get(cacheKey), setProgress);
	            }
	            return;
	        }

	        const ctrl = background
	            ? new AbortController()
	            : (abortCtrl && abortCtrl.abort(), abortCtrl = new AbortController(), abortCtrl);

	        if (!background) showOverlay();

	        const body = { date };
	        if (greenhouse) body.greenhouse = greenhouse;

	        let serverPct = 5, serverTimer = null;
	        if (!background) {
	            setProgress(serverPct, 'Sending request…');
	            serverTimer = setInterval(() => {
	                serverPct = Math.min(serverPct + 1.2, 45);
	                setProgress(serverPct, 'Server processing…');
	            }, 150);
	        }

	        fetch('/api/method/upande_scp.serverscripts.get_scouting_observations.getScoutingObservations', {
	            method: 'POST',
	            headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': CSRF },
	            body: JSON.stringify(body),
	            signal: ctrl.signal
	        })
	        .then(r => {
	            clearInterval(serverTimer);
	            if (!r.ok) throw new Error('HTTP ' + r.status);
	            if (!background) setProgress(48, 'Downloading…');
	            return streamResponse(r, background ? null : setProgress);
	        })
	        .then(r => {
	            const data = r.message || r.data || {};
	            const hasEntries = (data.scouting_entries || []).length > 0;
	            dataCache.set(cacheKey, data);
	            if (!background) {
	                if (hasEntries) {
	                    _renderObsData(data, setProgress);
	                    prefetchPastDays(date, greenhouse);
	                } else {
	                    hideOverlay(true);
	                }
	            }
	        })
	        .catch(err => {
	            clearInterval(serverTimer);
	            if (err.name === 'AbortError') return;
	            if (!background) {
	                console.error('Observations fetch error:', err);
	                hideOverlay(true);
	            }
	        });
	    }

	    const localDateISO = (d = new Date()) => {
	        const y = d.getFullYear();
	        const m = String(d.getMonth() + 1).padStart(2, '0');
	        const day = String(d.getDate()).padStart(2, '0');
	        return `${y}-${m}-${day}`;
	    };

	    const prefetchPastDays = (fromDate, greenhouse) => {
	        const d = new Date(fromDate + 'T00:00:00');
	        for (let i = 1; i <= 3; i++) {
	            d.setDate(d.getDate() - 1);
	            const day = localDateISO(d);
	            if (!dataCache.has(`${day}_${greenhouse || ''}`)) {
	                fetchObservations(day, greenhouse, true);
	            }
	        }
	    };

	    const debouncedFetch = debounce((date, gh) => fetchObservations(date, gh), 300);

	    // ── Map initialisation ──
	    function initMap() {
	        if (mapInitialized) return;
	        window.map = L.map('map', { zoomSnap: 0.1, zoomDelta: 0.1, maxZoom: 22.4, zoomControl: true });
	        mapInitialized = true;

	        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	            maxNativeZoom: 19,
	            maxZoom: 22.4,
	            attribution: '© OpenStreetMap contributors'
	        }).addTo(window.map);

	        window.map.setView([LAT, LON], ZOOM);

	        // Set today's date and do initial fetch (local timezone)
	        const today = localDateISO();
	        datePicker.value = today;

	        fetchObservations(today, ghSelect.value);
	    }

	    // ── Event listeners ──
	    datePicker.addEventListener('change', e => debouncedFetch(e.target.value, ghSelect.value));
	    ghSelect.addEventListener('change', () => {
	        zoneCache.clear(); // Clear cache when greenhouse changes
	        debouncedFetch(datePicker.value, ghSelect.value);
	    });

	    initMap();
	};
</script>
{% endblock %}
