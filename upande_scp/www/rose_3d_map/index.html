{% extends "upande_scp/www/map_base.html" %} {% block head %}
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" />
<script type="importmap">
	{
		"imports": {
			"three": "https://unpkg.com/three@0.160.0/build/three.module.js"
		}
	}
</script>
<style>
	#map-page {
		height: 100%;
		width: 100%;
		display: flex;
		position: relative;
	}
	#map-container {
		flex: 1;
		position: relative;
		z-index: 1;
	}
	#map {
		height: 100%;
		width: 100%;
	}

	/* ── Toggles row inside the floating filter bar ── */
	.scout-filters .filter-toggles {
		display: flex;
		align-items: center;
		gap: 14px;
		flex-wrap: wrap;
	}
	.scout-filters .toggle-item {
		display: flex;
		align-items: center;
		gap: 6px;
		font-size: 0.72rem;
		color: #4b5563;
		cursor: pointer;
		user-select: none;
	}
	.scout-filters .toggle-item input {
		margin: 0;
		cursor: pointer;
		accent-color: #4b5563;
	}
	.scout-filters .opacity-control {
		display: flex;
		flex-direction: column;
		gap: 3px;
		min-width: 120px;
	}
	.scout-filters .opacity-control input[type="range"] {
		width: 100%;
		accent-color: #4b5563;
		height: 4px;
	}
	.scout-filters .opacity-value {
		font-size: 0.7rem;
		color: #6b7280;
	}

	/* ── Map overlay / empty state ── */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(255,255,255,0.93);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.5rem;
		border-radius: inherit;
	}
	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #db2777; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }

	#empty-hint {
		position: absolute;
		left: 50%;
		bottom: 24px;
		transform: translateX(-50%);
		z-index: 800;
		background: rgba(255,255,255,0.92);
		border: 1px solid #e5e7eb;
		border-radius: 999px;
		padding: 6px 14px;
		font-size: 0.72rem;
		color: #6b7280;
		display: none;
	}

	#fps {
		position: absolute;
		left: 14px;
		bottom: 14px;
		z-index: 800;
		background: rgba(255,255,255,0.92);
		border: 1px solid #e5e7eb;
		border-radius: 6px;
		padding: 3px 8px;
		font-size: 0.7rem;
		color: #6b7280;
		font-variant-numeric: tabular-nums;
	}

	#rose-hover-tip {
		position: absolute;
		z-index: 850;
		pointer-events: none;
		background: rgba(17, 24, 39, 0.92);
		color: #f9fafb;
		font-size: 0.72rem;
		line-height: 1.35;
		padding: 5px 9px;
		border-radius: 6px;
		white-space: nowrap;
		display: none;
		transform: translate(-50%, calc(-100% - 10px));
		box-shadow: 0 4px 10px rgba(0,0,0,0.18);
	}
	#rose-hover-tip strong { color: #fda4af; font-weight: 600; }
</style>
{% endblock %} {% block page_content %}
<div id="map-page">
	<div id="map-container">
		<div id="map-loader">
			<span class="map-load-title">Loading greenhouses</span>
			<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
			<span class="map-load-status" id="map-load-status">Initialising…</span>
		</div>
		<div id="map"></div>
		<div id="empty-hint">No zones in this scope — pick a different farm or greenhouse</div>
		<div id="fps">— fps</div>
		<div id="rose-hover-tip"></div>
	</div>

	<!-- Floating filter bar (top) -->
	<div class="scout-filters" id="scout-filters">
		<div class="scout-filter-item">
			<label for="farm-select">Farm</label>
			<select id="farm-select">
				<option value="">All Farms</option>
				{% for farm in farm_hierarchy %}
				<option value="{{ farm.name }}">{{ farm.name }}</option>
				{% endfor %}
			</select>
		</div>
		<div class="scout-filter-item">
			<label for="section-select">Section</label>
			<select id="section-select" disabled>
				<option value="">All Sections</option>
			</select>
		</div>
		<div class="scout-filter-item">
			<label for="gh-select">Greenhouse</label>
			<select id="gh-select">
				<option value="">All Greenhouses</option>
			</select>
		</div>

		<div class="filter-toggles">
			<label class="toggle-item">
				<input type="checkbox" id="toggle-greenhouses" checked />
				<span>Greenhouses</span>
			</label>
			<label class="toggle-item">
				<input type="checkbox" id="toggle-roses" checked />
				<span>Roses</span>
			</label>
			<label class="toggle-item">
				<input type="checkbox" id="toggle-topdown" />
				<span>Top-down</span>
			</label>
			<div class="opacity-control">
				<label for="gh-opacity">Greenhouse opacity <span class="opacity-value" id="gh-opacity-val">55%</span></label>
				<input type="range" id="gh-opacity" min="0" max="100" step="1" value="55" />
			</div>
		</div>
	</div>

	<!-- Floating summary (bottom-right) -->
	<div class="scout-summary" id="scout-summary">
		<div class="panel-title">Greenhouse Summary</div>
		<div class="scout-summary-grid">
			<div class="scout-stat">
				<div class="scout-stat-label">Greenhouses</div>
				<div class="scout-stat-value" id="kpi-greenhouses">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Beds</div>
				<div class="scout-stat-value" id="kpi-beds">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Zones</div>
				<div class="scout-stat-value" id="kpi-zones">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Visible Roses</div>
				<div class="scout-stat-value" id="kpi-visible">—</div>
			</div>
		</div>
	</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="module">
	import * as THREE from "three";

	const GREENHOUSES   = {{ greenhouses_geojson | tojson | safe }};
	const FARM_HIERARCHY = {{ farm_hierarchy | tojson | safe }};
	const ZONE_CENTROIDS = {{ zone_centroids | tojson | safe }};
	const LAT  = {{ lat | json }};
	const LON  = {{ lon | json }};
	const ZOOM = {{ default_zoom | json }};
	const FARM_DEFAULTS = {{ farm_coordinates | tojson | safe }};
	const CSRF = "{{ csrf_token }}";

	// Rose colour palette — varies bloom hue per-instance for visual richness.
	const ROSE_PALETTE = [
		'#e11d48', // crimson
		'#f43f5e', // rose
		'#fb7185', // pink
		'#f472b6', // hot pink
		'#fcd34d', // yellow
		'#fdba74', // peach
		'#ffffff', // white
	];
	const STEM_COLOR = 0x2f6f3f;
	const LEAF_COLOR = 0x3f8a4a;

	const setProgress = (pct, msg) => {
		const fill = document.getElementById('map-load-fill');
		const status = document.getElementById('map-load-status');
		if (fill) fill.style.width = Math.min(100, pct) + '%';
		if (status && msg) status.textContent = msg;
	};
	const showOverlay = (msg) => {
		setProgress(0, msg || 'Initialising…');
		document.getElementById('map-loader').style.display = 'flex';
	};
	const hideOverlay = () => {
		document.getElementById('map-loader').style.display = 'none';
	};

	// ── Map ────────────────────────────────────────────────────────────────
	const map = new maplibregl.Map({
		container: 'map',
		style: 'https://tiles.openfreemap.org/styles/liberty',
		center: [LON, LAT],
		zoom: ZOOM,
		pitch: 60,
		bearing: 0,
		hash: false,
		attributionControl: { compact: true },
	});
	map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
	map.addControl(new maplibregl.ScaleControl(), 'bottom-left');
	window.map = map;

	// ── FPS counter ──────────────────────────────────────────────────────
	(() => {
		const out = document.getElementById('fps');
		let frames = 0, last = performance.now();
		function tick(now) {
			frames++;
			if (now - last >= 500) {
				const fps = (frames * 1000) / (now - last);
				out.textContent = `~${fps.toFixed(0)} fps`;
				frames = 0; last = now;
			}
			requestAnimationFrame(tick);
		}
		requestAnimationFrame(tick);
	})();

	// ── Greenhouse polygons (FeatureCollection from precomputed input) ───
	const GH_FILL_COLOR = '#5b8a4a';
	const GH_LINE_COLOR = '#22543d';

	function buildGreenhousesFC() {
		const feats = [];
		for (const gh of (GREENHOUSES || [])) {
			const g = gh && gh.geojson;
			if (!g || !Array.isArray(g.features)) continue;
			for (const f of g.features) {
				if (!f || !f.geometry) continue;
				feats.push({
					type: 'Feature',
					geometry: f.geometry,
					properties: {
						gh_name: gh.name,
						gh_label: gh.short_name || gh.name,
					},
				});
			}
		}
		return { type: 'FeatureCollection', features: feats };
	}

	function addGreenhousesLayers() {
		if (map.getSource('greenhouses')) return;
		map.addSource('greenhouses', { type: 'geojson', data: buildGreenhousesFC() });
		map.addLayer({
			id: 'greenhouses-fill',
			type: 'fill',
			source: 'greenhouses',
			paint: {
				'fill-color': GH_FILL_COLOR,
				'fill-opacity': 0.55,
			},
		});
		map.addLayer({
			id: 'greenhouses-line',
			type: 'line',
			source: 'greenhouses',
			paint: {
				'line-color': GH_LINE_COLOR,
				'line-width': 1.4,
				'line-opacity': 0.85,
			},
		});
		map.addLayer({
			id: 'greenhouses-labels',
			type: 'symbol',
			source: 'greenhouses',
			layout: {
				'text-field': ['get', 'gh_label'],
				'text-size': 12,
				'text-allow-overlap': false,
			},
			paint: {
				'text-color': '#1e293b',
				'text-halo-color': '#ffffff',
				'text-halo-width': 1.5,
			},
			minzoom: 15.5,
		});
		map.on('click', 'greenhouses-fill', (e) => {
			const f = e.features && e.features[0];
			if (!f) return;
			const ghName = f.properties.gh_name;
			const sel = document.getElementById('gh-select');
			if ([...sel.options].some(o => o.value === ghName)) {
				sel.value = ghName;
				applyFilters();
			}
		});
		map.on('mouseenter', 'greenhouses-fill', () => {
			map.getCanvas().style.cursor = 'pointer';
		});
		map.on('mouseleave', 'greenhouses-fill', () => {
			map.getCanvas().style.cursor = '';
		});
	}

	function setGreenhousesVisibility(show) {
		for (const id of ['greenhouses-fill', 'greenhouses-line', 'greenhouses-labels']) {
			if (map.getLayer(id)) {
				map.setLayoutProperty(id, 'visibility', show ? 'visible' : 'none');
			}
		}
	}
	function setGreenhouseOpacity(pct) {
		if (map.getLayer('greenhouses-fill')) {
			map.setPaintProperty('greenhouses-fill', 'fill-opacity', pct / 100);
		}
	}

	// ── Roses layer (Three.js InstancedMesh: stem + bloom + leaf) ────────
	// Each "rose" is three instances sharing the same matrix index:
	//   stem   — green cylinder (anchored at y=0)
	//   leaf   — small flat oval to the side of the stem
	//   bloom  — perturbed icosahedron at the top, per-instance colored
	class RosesLayer {
		constructor(features) {
			this.id = 'roses';
			this.type = 'custom';
			this.renderingMode = '3d';
			this.features = features;
			// Slimmed silhouette — still legible from a farm viewport but
			// less visually heavy when many zones are in view.
			this.stemH   = 8.0;
			this.stemR   = 0.25;
			this.bloomR  = 2.2;
			this.bloomH  = 3.0;
			this.leafW   = 1.8;
			this.leafL   = 3.0;
		}

		onAdd(map, gl) {
			this.map = map;
			this.camera = new THREE.Camera();
			this.scene = new THREE.Scene();

			this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
			const sun = new THREE.DirectionalLight(0xffffff, 0.85);
			sun.position.set(0.4, 1, 0.6);
			this.scene.add(sun);

			if (!this.features.length) {
				this.renderer = new THREE.WebGLRenderer({
					canvas: map.getCanvas(), context: gl, antialias: true,
				});
				this.renderer.autoClear = false;
				return;
			}

			const [lng0, lat0] = this.features[0].coord;
			this.anchor = maplibregl.MercatorCoordinate.fromLngLat([lng0, lat0], 0);
			const meter = this.anchor.meterInMercatorCoordinateUnits();

			const N = this.features.length;

			// ── Stem (4-sided prism — silhouette reads the same as a 6-sided cylinder at distance) ──
			const stemGeo = new THREE.CylinderGeometry(this.stemR, this.stemR * 1.15, this.stemH, 4, 1, true);
			stemGeo.translate(0, this.stemH / 2, 0);
			const stemMat = new THREE.MeshLambertMaterial({ color: STEM_COLOR });
			const stemMesh = new THREE.InstancedMesh(stemGeo, stemMat, N);

			// ── Leaf (flat ellipsoid — coarsened to ~30 tris) ──────────
			const leafGeo = new THREE.SphereGeometry(1, 5, 3);
			leafGeo.scale(this.leafW, 0.025, this.leafL);
			leafGeo.translate(this.leafW * 0.9, this.stemH * 0.55, 0);
			const leafMat = new THREE.MeshLambertMaterial({ color: LEAF_COLOR, flatShading: true });
			const leafMesh = new THREE.InstancedMesh(leafGeo, leafMat, N);

			// ── Bloom: base icosahedron (20 tris) with vertex jitter ──
			const bloomGeo = new THREE.IcosahedronGeometry(this.bloomR, 0);
			bloomGeo.scale(1, this.bloomH / (2 * this.bloomR), 1);
			const bpos = bloomGeo.attributes.position;
			const bTmp = new THREE.Vector3();
			const bOffsets = new Map();
			const bJitter = this.bloomR * 0.30;
			for (let i = 0; i < bpos.count; i++) {
				bTmp.fromBufferAttribute(bpos, i);
				const key = bTmp.x.toFixed(4) + '_' + bTmp.y.toFixed(4) + '_' + bTmp.z.toFixed(4);
				let o = bOffsets.get(key);
				if (!o) {
					const seed = Math.abs(bTmp.x * 12.9 + bTmp.y * 78.2 + bTmp.z * 37.7) + 1;
					const f = (k) => ((Math.sin(seed * k) * 43758.5453) % 1) * bJitter;
					o = [f(1.1), f(2.7), f(4.3)];
					bOffsets.set(key, o);
				}
				bpos.setXYZ(i, bTmp.x + o[0], bTmp.y + o[1], bTmp.z + o[2]);
			}
			bpos.needsUpdate = true;
			bloomGeo.computeVertexNormals();
			bloomGeo.translate(0, this.stemH + this.bloomH / 2, 0);

			const bloomMat = new THREE.MeshLambertMaterial({
				color: 0xffffff,
				flatShading: true,
				vertexColors: false,
			});
			const bloomMesh = new THREE.InstancedMesh(bloomGeo, bloomMat, N);

			const tmp = new THREE.Matrix4();
			const tmpRot = new THREE.Matrix4();
			const tmpTrans = new THREE.Matrix4();
			const tmpColor = new THREE.Color();

			for (let i = 0; i < N; i++) {
				const [lng, lat] = this.features[i].coord;
				const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], 0);
				const dx = (m.x - this.anchor.x) / meter;
				const dz = (m.y - this.anchor.y) / meter;

				// Pseudo-random rotation per rose so leaves and bloom faces
				// don't all align — derived deterministically from coords.
				const seed = Math.sin(lng * 12.9898 + lat * 78.233) * 43758.5453;
				const rot = (seed - Math.floor(seed)) * Math.PI * 2;

				tmpTrans.makeTranslation(dx, 0, dz);
				tmpRot.makeRotationY(rot);
				tmp.multiplyMatrices(tmpTrans, tmpRot);

				stemMesh.setMatrixAt(i, tmp);
				leafMesh.setMatrixAt(i, tmp);
				bloomMesh.setMatrixAt(i, tmp);

				// Color rotates through palette — visually distinguishable
				// blooms even within the same bed.
				const hex = ROSE_PALETTE[i % ROSE_PALETTE.length];
				tmpColor.set(hex);
				bloomMesh.setColorAt(i, tmpColor);
			}
			stemMesh.instanceMatrix.needsUpdate = true;
			leafMesh.instanceMatrix.needsUpdate = true;
			bloomMesh.instanceMatrix.needsUpdate = true;
			if (bloomMesh.instanceColor) bloomMesh.instanceColor.needsUpdate = true;

			// Visibility filter mask — index → visible?
			this.visibleMask = new Uint8Array(N).fill(1);
			this.stemMesh = stemMesh;
			this.leafMesh = leafMesh;
			this.bloomMesh = bloomMesh;
			this.scene.add(stemMesh);
			this.scene.add(leafMesh);
			this.scene.add(bloomMesh);

			this.renderer = new THREE.WebGLRenderer({
				canvas: map.getCanvas(),
				context: gl,
				antialias: true,
			});
			this.renderer.autoClear = false;
		}

		// Show only instances whose `pred(feature)` returns true.
		// Three.js InstancedMesh has no per-instance hide flag — we collapse
		// hidden instances to a zero-scaled matrix at the origin which the
		// rasterizer culls trivially.
		setVisibilityFilter(pred) {
			if (!this.stemMesh) return 0;
			const meter = this.anchor.meterInMercatorCoordinateUnits();
			const tmp = new THREE.Matrix4();
			const tmpRot = new THREE.Matrix4();
			const tmpTrans = new THREE.Matrix4();
			const hidden = new THREE.Matrix4().makeScale(0, 0, 0);
			let visible = 0;
			for (let i = 0; i < this.features.length; i++) {
				const f = this.features[i];
				if (pred(f)) {
					const [lng, lat] = f.coord;
					const m = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], 0);
					const dx = (m.x - this.anchor.x) / meter;
					const dz = (m.y - this.anchor.y) / meter;
					const seed = Math.sin(lng * 12.9898 + lat * 78.233) * 43758.5453;
					const rot = (seed - Math.floor(seed)) * Math.PI * 2;
					tmpTrans.makeTranslation(dx, 0, dz);
					tmpRot.makeRotationY(rot);
					tmp.multiplyMatrices(tmpTrans, tmpRot);
					this.stemMesh.setMatrixAt(i, tmp);
					this.leafMesh.setMatrixAt(i, tmp);
					this.bloomMesh.setMatrixAt(i, tmp);
					this.visibleMask[i] = 1;
					visible++;
				} else {
					this.stemMesh.setMatrixAt(i, hidden);
					this.leafMesh.setMatrixAt(i, hidden);
					this.bloomMesh.setMatrixAt(i, hidden);
					this.visibleMask[i] = 0;
				}
			}
			this.stemMesh.instanceMatrix.needsUpdate = true;
			this.leafMesh.instanceMatrix.needsUpdate = true;
			this.bloomMesh.instanceMatrix.needsUpdate = true;
			map.triggerRepaint();
			return visible;
		}

		setOverallVisibility(show) {
			if (!this.stemMesh) return;
			this.stemMesh.visible = show;
			this.leafMesh.visible = show;
			this.bloomMesh.visible = show;
			map.triggerRepaint();
		}

		render(gl, args) {
			if (!this.anchor) return;
			let matrix = args;
			if (args && !Array.isArray(args) && typeof args !== 'function') {
				matrix =
					(args.defaultProjectionData &&
						(args.defaultProjectionData.mainMatrix ||
							args.defaultProjectionData.matrix)) ||
					args.matrix ||
					args;
			}
			if (!matrix || matrix.length !== 16) return;

			const meter = this.anchor.meterInMercatorCoordinateUnits();
			const rotX = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(1, 0, 0), Math.PI / 2);
			const world = new THREE.Matrix4()
				.makeTranslation(this.anchor.x, this.anchor.y, this.anchor.z)
				.scale(new THREE.Vector3(meter, -meter, meter))
				.multiply(rotX);
			this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(world);
			this.renderer.resetState();
			this.renderer.render(this.scene, this.camera);
			this.map.triggerRepaint();
		}

		onRemove() {
			this.scene.traverse((o) => {
				if (o.geometry) o.geometry.dispose();
				if (o.material) o.material.dispose();
			});
		}
	}

	// ── State ─────────────────────────────────────────────────────────────
	let activeRoses = null;
	let savedPitch = 60;
	let savedBearing = 0;

	// Greenhouse → Farm lookup so a greenhouse selection can also flyTo and
	// the section dropdown can be populated from the farm hierarchy.
	const ghToFarm = new Map();
	const ghToSection = new Map();
	for (const farm of (FARM_HIERARCHY || [])) {
		for (const sec of (farm.sections || [])) {
			for (const block of (sec.blocks || [])) {
				if (block.type === 'Greenhouse') {
					ghToFarm.set(block.name, farm.name);
					ghToSection.set(block.name, sec.name || '');
				}
			}
		}
	}

	// Each ZONE_CENTROIDS entry already has greenhouse+bed+lng+lat. Pre-shape
	// it once into the form RosesLayer expects.
	const ROSE_FEATURES = (ZONE_CENTROIDS || [])
		.filter(z => z.lng && z.lat)
		.map(z => ({
			coord: [z.lng, z.lat],
			zone: z.name,
			greenhouse: z.greenhouse || '',
			bed: z.bed || '',
			farm: ghToFarm.get(z.greenhouse) || '',
			section: ghToSection.get(z.greenhouse) || '',
		}));

	// ── Filters cascade ──────────────────────────────────────────────────
	const farmsByName = new Map((FARM_HIERARCHY || []).map(f => [f.name, f]));

	function populateSections(farmName) {
		const sectionSelect = document.getElementById('section-select');
		const farm = farmsByName.get(farmName);
		sectionSelect.innerHTML = '<option value="">All Sections</option>';
		if (!farm) { sectionSelect.disabled = true; return; }
		(farm.sections || []).forEach(sec => {
			const opt = document.createElement('option');
			opt.value = sec.name;
			opt.textContent = sec.label;
			sectionSelect.appendChild(opt);
		});
		sectionSelect.disabled = (farm.sections || []).length === 0;
	}

	function populateGreenhouses(farmName, sectionName) {
		const previous = document.getElementById('gh-select').value;
		const ghSelect = document.getElementById('gh-select');
		ghSelect.innerHTML = '<option value="">All Greenhouses</option>';

		const farms = farmName
			? [farmsByName.get(farmName)].filter(Boolean)
			: (FARM_HIERARCHY || []);
		const sections = farms.flatMap(f => (f.sections || []).filter(
			s => sectionName === '' || sectionName == null ? true : s.name === sectionName
		));
		const greenhouses = sections.flatMap(sec =>
			(sec.blocks || []).filter(b => b.type === 'Greenhouse')
		);
		// Dedupe by name
		const seen = new Set();
		for (const gh of greenhouses) {
			if (seen.has(gh.name)) continue;
			seen.add(gh.name);
			const opt = document.createElement('option');
			opt.value = gh.name;
			opt.textContent = gh.label || gh.name;
			ghSelect.appendChild(opt);
		}
		if (previous && [...ghSelect.options].some(o => o.value === previous)) {
			ghSelect.value = previous;
		}
	}

	// ── Apply filters → recompute rose visibility & summary KPIs ─────────
	function applyFilters() {
		const farm = document.getElementById('farm-select').value;
		const section = document.getElementById('section-select').value;
		const gh = document.getElementById('gh-select').value;

		const greenhouseSet = new Set();
		const farms = farm
			? [farmsByName.get(farm)].filter(Boolean)
			: (FARM_HIERARCHY || []);
		for (const f of farms) {
			for (const sec of (f.sections || [])) {
				if (section && sec.name !== section) continue;
				for (const b of (sec.blocks || [])) {
					if (b.type !== 'Greenhouse') continue;
					if (gh && b.name !== gh) continue;
					greenhouseSet.add(b.name);
				}
			}
		}

		const pred = gh
			? (f) => f.greenhouse === gh
			: (f) => greenhouseSet.has(f.greenhouse);

		const visible = activeRoses ? activeRoses.setVisibilityFilter(pred) : 0;
		document.getElementById('kpi-visible').textContent = visible.toLocaleString();
		document.getElementById('empty-hint').style.display =
			visible === 0 ? 'block' : 'none';

		updateGreenhouseFilter(greenhouseSet, gh);

		// Fit to whatever's actually visible. flyToFarm(farm) uses the
		// configured Map Settings centre, but that often doesn't match where
		// the zones live — so prefer fitting the rose bbox if we have one.
		if (gh) {
			flyToGreenhouse(gh);
		} else {
			fitToVisibleRoses(pred, farm);
		}
	}

	function fitToVisibleRoses(pred, farm) {
		let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, n = 0;
		for (const f of ROSE_FEATURES) {
			if (!pred(f)) continue;
			const [x, y] = f.coord;
			if (x < minX) minX = x;
			if (x > maxX) maxX = x;
			if (y < minY) minY = y;
			if (y > maxY) maxY = y;
			n++;
		}
		if (n && isFinite(minX) && (maxX - minX > 0 || maxY - minY > 0)) {
			map.fitBounds([[minX, minY], [maxX, maxY]], {
				padding: 80, pitch: 60, duration: 800, maxZoom: 18.5,
			});
		} else if (farm) {
			flyToFarm(farm);
		}
	}

	// Restrict the visible greenhouses on the map source itself, so
	// labels/fills only show the in-scope set.
	function updateGreenhouseFilter(allowed, ghPick) {
		if (!map.getLayer('greenhouses-fill')) return;
		if (ghPick) {
			const filter = ['==', ['get', 'gh_name'], ghPick];
			map.setFilter('greenhouses-fill', filter);
			map.setFilter('greenhouses-line', filter);
			map.setFilter('greenhouses-labels', filter);
			return;
		}
		if (!allowed || !allowed.size) {
			map.setFilter('greenhouses-fill', null);
			map.setFilter('greenhouses-line', null);
			map.setFilter('greenhouses-labels', null);
			return;
		}
		const filter = ['in', ['get', 'gh_name'], ['literal', Array.from(allowed)]];
		map.setFilter('greenhouses-fill', filter);
		map.setFilter('greenhouses-line', filter);
		map.setFilter('greenhouses-labels', filter);
	}

	function flyToGreenhouse(ghName) {
		const gh = (GREENHOUSES || []).find(g => g.name === ghName);
		if (!gh || !gh.geojson || !Array.isArray(gh.geojson.features)) return;
		let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
		const visit = (coords) => {
			if (typeof coords[0] === 'number') {
				if (coords[0] < minX) minX = coords[0];
				if (coords[0] > maxX) maxX = coords[0];
				if (coords[1] < minY) minY = coords[1];
				if (coords[1] > maxY) maxY = coords[1];
			} else {
				coords.forEach(visit);
			}
		};
		gh.geojson.features.forEach(f => {
			if (f && f.geometry && f.geometry.coordinates) visit(f.geometry.coordinates);
		});
		if (isFinite(minX)) {
			map.fitBounds([[minX, minY], [maxX, maxY]], { padding: 80, pitch: 60, duration: 800 });
		}
	}

	function flyToFarm(farmName) {
		const c = FARM_DEFAULTS[farmName];
		if (c) {
			map.flyTo({ center: [c.lon, c.lat], zoom: c.zoom, pitch: 60, duration: 800 });
		}
	}

	function updateBaseKPIs() {
		// Counts the *underlying* dataset, independent of filters.
		const ghs = new Set();
		const beds = new Set();
		for (const f of ROSE_FEATURES) {
			if (f.greenhouse) ghs.add(f.greenhouse);
			if (f.bed) beds.add(f.bed);
		}
		document.getElementById('kpi-greenhouses').textContent = ghs.size.toLocaleString();
		document.getElementById('kpi-beds').textContent = beds.size.toLocaleString();
		document.getElementById('kpi-zones').textContent = ROSE_FEATURES.length.toLocaleString();
	}

	// ── Wire up UI ───────────────────────────────────────────────────────
	map.on('load', () => {
		setProgress(20, 'Drawing greenhouses…');
		addGreenhousesLayers();

		setProgress(50, 'Building rose scene…');
		activeRoses = new RosesLayer(ROSE_FEATURES);
		map.addLayer(activeRoses);

		setProgress(80, 'Wiring filters…');
		populateSections('');
		populateGreenhouses('', '');
		updateBaseKPIs();

		// Default farm: same heuristic as avocado map — pick the first farm
		// with configured Map Settings coordinates, fall back to the first
		// farm in the dropdown.
		const farmSelect = document.getElementById('farm-select');
		const configured = Object.keys(FARM_DEFAULTS || {});
		const farmOptions = [...farmSelect.options].map(o => o.value).filter(Boolean);
		const defaultFarm =
			configured.find(f => farmOptions.includes(f)) ||
			farmOptions[0] ||
			'';
		if (defaultFarm) {
			farmSelect.value = defaultFarm;
			populateSections(defaultFarm);
			populateGreenhouses(defaultFarm, '');
		}
		applyFilters();

		setProgress(100, 'Ready');
		setTimeout(hideOverlay, 250);
	});

	document.getElementById('farm-select').addEventListener('change', (e) => {
		const farm = e.target.value;
		populateSections(farm);
		populateGreenhouses(farm, '');
		document.getElementById('gh-select').value = '';
		applyFilters();
	});

	document.getElementById('section-select').addEventListener('change', () => {
		populateGreenhouses(
			document.getElementById('farm-select').value,
			document.getElementById('section-select').value,
		);
		document.getElementById('gh-select').value = '';
		applyFilters();
	});

	document.getElementById('gh-select').addEventListener('change', () => {
		applyFilters();
	});

	document.getElementById('toggle-greenhouses').addEventListener('change', (e) => {
		setGreenhousesVisibility(e.target.checked);
	});
	document.getElementById('toggle-roses').addEventListener('change', (e) => {
		if (activeRoses) activeRoses.setOverallVisibility(e.target.checked);
	});
	document.getElementById('gh-opacity').addEventListener('input', (e) => {
		const v = parseInt(e.target.value, 10);
		document.getElementById('gh-opacity-val').textContent = v + '%';
		setGreenhouseOpacity(v);
	});
	document.getElementById('toggle-topdown').addEventListener('change', (e) => {
		if (e.target.checked) {
			savedPitch = map.getPitch();
			savedBearing = map.getBearing();
			map.easeTo({ pitch: 0, bearing: 0, duration: 600 });
		} else {
			map.easeTo({ pitch: savedPitch, bearing: savedBearing, duration: 600 });
		}
	});
	map.on('pitchend', () => {
		const cb = document.getElementById('toggle-topdown');
		const isFlat = map.getPitch() < 1;
		if (cb.checked !== isFlat) cb.checked = isFlat;
	});

	// ── Click-to-name on roses ───────────────────────────────────────────
	function nearestVisibleRoseAt(point, maxPx = 20) {
		if (!activeRoses || !activeRoses.visibleMask) return null;
		const px = point.x, py = point.y;
		let best = null, bestD = Infinity;
		for (let i = 0; i < ROSE_FEATURES.length; i++) {
			if (!activeRoses.visibleMask[i]) continue;
			const f = ROSE_FEATURES[i];
			const p = map.project(f.coord);
			const d = (p.x - px) ** 2 + (p.y - py) ** 2;
			if (d < bestD) { bestD = d; best = f; }
		}
		return best && bestD < maxPx * maxPx ? best : null;
	}

	map.on('click', (e) => {
		// Skip click that already triggered a greenhouse polygon handler.
		const hit = map.queryRenderedFeatures(e.point, { layers: ['greenhouses-fill'] });
		if (hit && hit.length) return;

		const f = nearestVisibleRoseAt(e.point, 18);
		if (!f) return;
		const html = `<div style="font-size:0.8rem;line-height:1.4;">
			<strong>${f.zone || '(zone)'}</strong>
			<br><span style="color:#6b7280">${f.bed || '—'}</span>
			<br><span style="color:#6b7280">${f.greenhouse || ''}</span>
		</div>`;
		new maplibregl.Popup({ closeOnClick: true })
			.setLngLat(f.coord)
			.setHTML(html)
			.addTo(map);
	});

	// ── Hover tooltip (zone name only, throttled to one rAF) ─────────────
	const hoverTip = document.getElementById('rose-hover-tip');
	let hoverPending = false;
	let lastHoverEvent = null;
	function handleHover() {
		hoverPending = false;
		const e = lastHoverEvent;
		if (!e) return;
		const f = nearestVisibleRoseAt(e.point, 22);
		if (!f) {
			hoverTip.style.display = 'none';
			map.getCanvas().style.cursor = '';
			return;
		}
		const p = map.project(f.coord);
		hoverTip.style.left = p.x + 'px';
		hoverTip.style.top  = p.y + 'px';
		hoverTip.innerHTML = `<strong>${f.zone || '(zone)'}</strong>`;
		hoverTip.style.display = 'block';
		map.getCanvas().style.cursor = 'pointer';
	}
	map.on('mousemove', (e) => {
		lastHoverEvent = e;
		if (hoverPending) return;
		hoverPending = true;
		requestAnimationFrame(handleHover);
	});
	map.on('mouseout', () => {
		hoverTip.style.display = 'none';
		map.getCanvas().style.cursor = '';
	});
</script>
{% endblock %}
