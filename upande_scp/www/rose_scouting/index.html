{% extends "upande_scp/www/map_base.html" %} {% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
	#map-page {
		height: 100%;
		width: 100%;
		display: flex;
		position: relative;
	}
	#map-container {
		flex: 1;
		position: relative;
		z-index: 1;
	}
	#map {
		height: 100%;
		width: 100%;
	}

	/* ── Summary details (legend / timeline) ── */
	.scout-summary-details {
		border-top: 1px solid #e5e7eb;
		padding-top: 8px;
		margin-top: 4px;
	}
	.scout-summary-details summary {
		cursor: pointer;
		font-size: 0.7rem;
		font-weight: 600;
		color: #6b7280;
		text-transform: uppercase;
		letter-spacing: 0.04em;
		list-style: none;
		display: flex;
		align-items: center;
		justify-content: space-between;
		padding: 4px 0;
	}
	.scout-summary-details summary::-webkit-details-marker { display: none; }
	.scout-summary-details summary::after {
		content: "▾";
		font-size: 0.6rem;
		color: #9ca3af;
	}
	.scout-summary-details[open] summary::after {
		content: "▴";
	}
	.scout-summary-details > div {
		padding-top: 6px;
		max-height: 220px;
		overflow-y: auto;
	}

	.legend-items {
		display: flex;
		flex-direction: column;
		gap: 0.3rem;
	}
	.legend-item {
		display: flex;
		align-items: center;
		gap: 0.5rem;
		padding: 0.4rem 0.5rem;
		border-radius: 6px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		cursor: pointer;
	}
	.legend-item input[type="checkbox"] {
		width: 14px;
		height: 14px;
		margin: 0;
		cursor: pointer;
		accent-color: #4b5563;
	}
	.color-swatch {
		width: 14px;
		height: 14px;
		border-radius: 4px;
		flex-shrink: 0;
		border: 1px solid #e5e7eb;
	}
	.legend-label {
		flex: 1;
		font-size: 0.75rem;
		font-weight: 500;
		color: #374151;
	}

	.empty-state {
		text-align: center;
		padding: 0.75rem 0.5rem;
		color: #6b7280;
	}
	.empty-state p {
		font-size: 0.75rem;
		margin: 0;
	}
	.empty-state svg { display: none; }

	.timeline-item {
		display: flex;
		flex-direction: column;
		gap: 0.15rem;
		padding: 0.4rem 0.5rem;
		border-radius: 6px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		font-size: 0.72rem;
		margin-bottom: 0.3rem;
	}
	.timeline-top {
		display: flex;
		justify-content: space-between;
		align-items: center;
	}
	.timeline-name {
		font-weight: 600;
		color: var(--text);
	}
	.timeline-gh {
		font-size: 0.6875rem;
		color: var(--text-muted);
	}
	.timeline-time {
		font-size: 0.6875rem;
		color: var(--text-muted);
	}
	.timeline-bar {
		height: 4px;
		border-radius: var(--radius-input);
		background: rgba(0, 0, 0, 0.15);
		margin-top: 0.25rem;
		position: relative;
		overflow: hidden;
	}
	.timeline-bar-fill {
		height: 100%;
		border-radius: var(--radius-input);
		background: var(--text);
	}

	/* ── Map style ── */
	.style-selector {
		display: flex;
		flex-direction: column;
		gap: 0.375rem;
	}
	.style-option {
		display: flex;
		align-items: center;
		gap: 0.625rem;
		padding: 0.4rem 0.625rem;
		border-radius: var(--radius-input);
		cursor: pointer;
	}	.style-option input {
		width: 14px;
		height: 14px;
		accent-color: var(--text);
	}
	.style-option label {
		font-size: 0.8125rem;
		cursor: pointer;
	}

	/* ── Map overlay / empty state ── */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(255,255,255,0.93);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.5rem;
		border-radius: inherit;
	}
	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #2563eb; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }
	#map-empty {
		position: absolute; inset: 0;
		display: none; flex-direction: column;
		align-items: center; justify-content: center;
		gap: 0.75rem; z-index: 1999; color: #94a3b8;
		font-size: 0.875rem; pointer-events: none;
	}

	.leaflet-control-zoom {
		border: 1px solid var(--border) !important;
				border-radius: var(--radius-card) !important;
		overflow: hidden;
	}
	.leaflet-control-zoom a {
		border: none !important;
		border-bottom: 1px solid var(--border) !important;
		color: var(--text) !important;
		background: var(--panel-bg) !important;
	}
	.leaflet-control-layers {
		border: 1px solid var(--border) !important;
				border-radius: var(--radius-card) !important;
		overflow: hidden;
	}
	.line-id-label {
		background: none !important;
		border: none !important;
		pointer-events: none;
	}

	/* No hover tooltips on this page — the sticky variant was racing pan/zoom. */
	.leaflet-tooltip { display: none !important; }

	@media (max-width: 768px) {
		.scout-filters {
			gap: 8px;
		}
		.scout-filters select,
		.scout-filters input[type="date"] {
			min-width: 100px;
		}
	}
</style>
{% endblock %} {% block page_content %}
<div id="map-page">
	<div id="map-container">
		<div id="map-loader">
			<span class="map-load-title">Loading scout data</span>
			<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
			<span class="map-load-status" id="map-load-status">Initialising…</span>
		</div>
		<div id="map-empty">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40" style="opacity:0.3"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/></svg>
			<span>No scouting activity on this date</span>
		</div>
		<div id="map"></div>
	</div>

	<!-- Floating filter bar (top) -->
	<div class="scout-filters" id="scout-filters">
		<div class="scout-filter-item">
			<label for="farm-select">Farm</label>
			<select id="farm-select">
				<option value="">All Farms</option>
				{% for farm in farm_hierarchy %}
				<option value="{{ farm.name }}">{{ farm.name }}</option>
				{% endfor %}
			</select>
		</div>
		<div class="scout-filter-item">
			<label for="section-select">Section</label>
			<select id="section-select" disabled>
				<option value="">All Sections</option>
			</select>
		</div>
		<div class="scout-filter-item">
			<label for="gh-select">Block / Greenhouse</label>
			<select id="gh-select">
				<option value="">All</option>
			</select>
		</div>
		<div class="scout-filter-item">
			<label for="scout-date-picker">Date</label>
			<input type="date" id="scout-date-picker" />
		</div>
	</div>

	<!-- Floating summary (bottom-right) -->
	<div class="scout-summary" id="scout-summary">
		<div class="panel-title">Today's Summary</div>
		<div class="scout-summary-grid">
			<div class="scout-stat">
				<div class="scout-stat-label">Scouts</div>
				<div class="scout-stat-value" id="kpi-scouts">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Beds</div>
				<div class="scout-stat-value" id="kpi-beds">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Zones</div>
				<div class="scout-stat-value" id="kpi-zones">—</div>
			</div>
			<div class="scout-stat">
				<div class="scout-stat-label">Min/Bed</div>
				<div class="scout-stat-value" id="kpi-min-bed">—</div>
			</div>
		</div>

		<details class="scout-summary-details">
			<summary>Coverage</summary>
			<div class="legend-items" id="scout-legend">
				<div class="empty-state"><p>Select a date to load scouts</p></div>
			</div>
		</details>

		<details class="scout-summary-details" id="timeline-section" style="display: none">
			<summary>Timeline</summary>
			<div id="scout-timeline"></div>
		</details>
	</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-providers/1.13.0/leaflet-providers.min.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script>
	window.onload = function () {
	    window.greenhouses_geojson = {{ greenhouses_geojson | tojson | safe }};
	    window.farm_hierarchy = {{ farm_hierarchy | tojson | safe }};
	    const LAT  = {{ lat | json }};
	    const LON  = {{ lon | json }};
	    const ZOOM = {{ default_zoom | json }};
	    const FARM_DEFAULTS = {{ farm_coordinates | tojson | safe }};
	    const CSRF = "{{csrf_token}}";

	    const palette = ['#ef4444','#3b82f6','#10b981','#f59e0b','#8b5cf6','#06b6d4','#f43f5e','#22c55e','#a78bfa','#fb923c'];

	    let mapInitialized = false;
	    let abortCtrl      = null;

	    window.zoneLayer      = null;
	    window.lineIdLabels   = null;
	    window.scoutLayers    = {};
	    window.scoutedBedOverlay = null;
	    window.lastScoutingData  = null;
	    window.allLatLngs = [];
	    let ghOverlay = null;

	    // Rose-only filter: keep entries where crop_scouted is empty or matches /rose/i.
	    const isRoseEntry = (e) => {
	        const c = (e && e.crop_scouted) || '';
	        return !c || /rose/i.test(c);
	    };
	    const filterToRoses = (data) => {
	        if (!data || !Array.isArray(data.scouting_entries)) return data;
	        data.scouting_entries = data.scouting_entries.filter(isRoseEntry);
	        return data;
	    };

	    // Zone GeoJSON parse cache
	    const zoneCache = new Map();
	    // Client-side data cache: "date_greenhouse" → API response
	    const dataCache = new Map();

	    const canvasRenderer = L.canvas({ padding: 0.5 });

	    const setProgress = (pct) => {
	        const fill = document.getElementById('map-load-fill');
	        const status = document.getElementById('map-load-status');
	        if (fill) fill.style.width = Math.min(100, pct) + '%';
	        if (status) status.textContent = Math.round(Math.min(100, pct)) + '%';
	    };
	    const showOverlay = () => {
	        setProgress(0, 'Initialising…');
	        document.getElementById('map-loader').style.display = 'flex';
	        document.getElementById('map-empty').style.display = 'none';
	    };
	    const hideOverlay = (empty = false) => {
	        document.getElementById('map-loader').style.display = 'none';
	        document.getElementById('map-empty').style.display = empty ? 'flex' : 'none';
	    };

	    // Streams the response body so we can report real download KB
	    const streamResponse = (response, onProgress) => {
	        const contentLength = response.headers.get('content-length');
	        const reader = response.body.getReader();
	        const chunks = [];
	        let received = 0;
	        const ESTIMATE = 600 * 1024;
	        const read = () => reader.read().then(({ done, value }) => {
	            if (done) {
	                const buf = new Uint8Array(received);
	                let pos = 0;
	                for (const c of chunks) { buf.set(c, pos); pos += c.length; }
	                if (onProgress) onProgress(83, 'Parsing response…');
	                return JSON.parse(new TextDecoder().decode(buf));
	            }
	            chunks.push(value);
	            received += value.length;
	            if (onProgress) {
	                const pct = contentLength
	                    ? 48 + (received / +contentLength) * 33
	                    : 48 + Math.min(received / ESTIMATE, 1) * 33;
	                onProgress(pct);
	            }
	            return read();
	        });
	        return read();
	    };

	    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

	    function parseZone(zone) {
	        if (!zoneCache.has(zone.name)) {
	            try { zoneCache.set(zone.name, JSON.parse(zone.raw_geojson)); }
	            catch { zoneCache.set(zone.name, null); }
	        }
	        return zoneCache.get(zone.name);
	    }

	    const generateScoutColors = data => {
	        const scouts = (data.scouting_entries || []).map(i => i.scouts_name).filter(Boolean);
	        const colors = {};
	        let idx = 0;
	        [...new Set(scouts)].forEach(n => { colors[n] = palette[idx++ % palette.length]; });
	        return colors;
	    };

	    const getGeoJsonCentroid = geo => {
	        try {
	            const f = geo.features[0];
	            if (f?.geometry?.coordinates) {
	                const c = turf.centroid(f);
	                return [c.geometry.coordinates[1], c.geometry.coordinates[0]];
	            }
	        } catch {}
	        return null;
	    };

	    function getEdgeMidpoint(coords) {
	        try {
	            const pts = coords.map(c => [c[1], c[0]]);
	            let maxDist = 0, pair = [];
	            for (let i = 0; i < pts.length; i++) {
	                const p1 = pts[i], p2 = pts[(i+1) % pts.length];
	                const dist = turf.distance(turf.point([p1[1],p1[0]]), turf.point([p2[1],p2[0]]));
	                if (dist > maxDist) { maxDist = dist; pair = [p1, p2]; }
	            }
	            return [(pair[0][0]+pair[1][0])/2, (pair[0][1]+pair[1][1])/2];
	        } catch { return coords[0] ? [coords[0][1],coords[0][0]] : null; }
	    }

	    const addGreenhouseOverlay = () => {
	        if (ghOverlay) { window.map.removeLayer(ghOverlay); ghOverlay = null; }
	        if (!window.greenhouses_geojson?.length) return;
	        const features = [];
	        window.greenhouses_geojson.forEach(gh => {
	            if (!gh.geojson?.features) return;
	            gh.geojson.features.forEach(f => {
	                const c = JSON.parse(JSON.stringify(f));
	                c.properties = { gh_name: gh.short_name || gh.name };
	                features.push(c);
	            });
	        });
	        if (!features.length) return;
	        ghOverlay = L.geoJSON({ type:'FeatureCollection', features }, {
	            style: { fillColor:'#5b684a', fillOpacity:0.64, color:'transparent', weight:0, interactive:false }
	        }).addTo(window.map);
	        if (window.zoneLayer) window.zoneLayer.bringToFront();
	    };

	    const renderZones = data => {
	        addGreenhouseOverlay();
	        if (window.zoneLayer) { window.map.removeLayer(window.zoneLayer); window.zoneLayer = null; }
	        if (window.lineIdLabels) { window.map.removeLayer(window.lineIdLabels); window.lineIdLabels = null; }

	        const lines = {};
	        (data.all_zones_geojson || []).forEach(zone => {
	            const geo = parseZone(zone);
	            if (!geo?.features) return;
	            const ghName = zone.name.split(' - ')[0];
	            geo.features.forEach(f => {
	                const lid = f.properties?.line_id;
	                const key = `${ghName}_line_${lid}`;
	                f.properties.zone_name = zone.name;
	                if (!lines[key]) lines[key] = [];
	                lines[key].push(f);
	            });
	        });

	        window.lineIdLabels = L.layerGroup();
	        Object.keys(lines).forEach(key => {
	            const feats = lines[key];
	            if (!feats.length) return;
	            feats.sort((a,b) => a.properties.zone_id - b.properties.zone_id);
	            const coords = feats.flatMap(f => f.geometry.coordinates);
	            const lid = feats[0].properties.line_id;
	            const isOdd = parseInt(lid) % 2 !== 0;
	            const pt = isOdd ? coords[0] : coords[coords.length-1];
	            const lbl = L.marker([pt[1],pt[0]], { icon: L.divIcon({
	                className:'line-id-label',
	                html:`<div style="font-size:6px;font-weight:200;color:#334155;transform:rotate(45deg)">${lid}</div>`,
	                iconSize:[20,10], iconAnchor:[0,0]
	            })});
	            window.lineIdLabels.addLayer(lbl);
	        });

	        const allFeats = { type:'FeatureCollection', features: Object.values(lines).flat() };
	        window.zoneLayer = L.geoJSON(allFeats, {
	            renderer: canvasRenderer,
	            style: { color: '#1e293b', weight:0.7, opacity:0.6, fill:false },
	            interactive: false
	        });

	        window.map.on('zoomend', () => {
	            const z = window.map.getZoom();
	            if (z >= 15) { if (!window.map.hasLayer(window.zoneLayer)) window.zoneLayer.addTo(window.map); }
	            else { if (window.zoneLayer && window.map.hasLayer(window.zoneLayer)) window.map.removeLayer(window.zoneLayer); }
	            if (z >= 19) { if (!window.map.hasLayer(window.lineIdLabels)) window.lineIdLabels.addTo(window.map); }
	            else { if (window.lineIdLabels && window.map.hasLayer(window.lineIdLabels)) window.map.removeLayer(window.lineIdLabels); }
	        });

	        const z = window.map.getZoom();
	        if (z >= 15) window.zoneLayer.addTo(window.map);
	        if (z >= 19) window.lineIdLabels.addTo(window.map);
	    };

	    const renderScoutedBeds = (scoutingData, zonesGeojson, scoutColors) => {
	        const zoneScoutMap = {};
	        scoutingData.forEach(entry => {
	            if (!zoneScoutMap[entry.zone]) zoneScoutMap[entry.zone] = { scout: entry.scouts_name, count: 0, latestEntry: null };
	            zoneScoutMap[entry.zone].count++;
	            if (!zoneScoutMap[entry.zone].latestEntry || entry.creation > zoneScoutMap[entry.zone].latestEntry) zoneScoutMap[entry.zone].latestEntry = entry.creation;
	            if (!window.scoutLayers[entry.scouts_name]) window.scoutLayers[entry.scouts_name] = L.layerGroup();
	        });

	        const zoneMap = new Map((zonesGeojson || []).map(z => [z.name, z]));
	        Object.entries(zoneScoutMap).forEach(([zoneName, info]) => {
	            const zone = zoneMap.get(zoneName);
	            if (!zone) return;
	            const geo = parseZone(zone);
	            if (!geo?.features) return;
	            try {
	                const coords = geo.features[0].geometry.coordinates.map(c => [c[1],c[0]]);
	                const color = scoutColors[info.scout];
	                const line = L.polyline(coords, { color, weight:0, opacity:1, pane:'overlayPane', interactive:false });
	                window.scoutLayers[info.scout].addLayer(line);
	                window.allLatLngs.push(...coords);
	                if (!window.scoutedBedOverlay.hasLayer(window.scoutLayers[info.scout])) window.scoutedBedOverlay.addLayer(window.scoutLayers[info.scout]);
	            } catch {}
	        });
	    };

	    const renderScoutFlowLines = (scoutingEntries, zonesGeojson, scoutColors) => {
	        const zoneMap = new Map((zonesGeojson || []).map(z => [z.name, z]));
	        const movement = new Map();

	        [...scoutingEntries].sort((a,b) => new Date(a.creation) - new Date(b.creation)).forEach(entry => {
	            const zone = zoneMap.get(entry.zone);
	            if (!zone) return;
	            const geo = parseZone(zone);
	            if (!geo) return;
	            try {
	                const centroid = getGeoJsonCentroid(geo);
	                if (centroid) {
	                    if (!movement.has(entry.scouts_name)) movement.set(entry.scouts_name, []);
	                    const path = movement.get(entry.scouts_name);
	                    const last = path.slice(-1)[0];
	                    if (!last || last.zoneName !== entry.zone) {
	                        path.push({ zoneName: entry.zone, coords: geo.features[0].geometry.coordinates, centroid });
	                    }
	                }
	            } catch (e) { console.warn('flow error', e); }
	        });

	        movement.forEach((visits, scoutName) => {
	            const color = scoutColors[scoutName] || palette[0];
	            if (!window.scoutLayers[scoutName]) window.scoutLayers[scoutName] = L.layerGroup();
	            const group = window.scoutLayers[scoutName];
	            for (let i = 0; i < visits.length - 1; i++) {
	                const start = getEdgeMidpoint(visits[i].coords);
	                const end   = getEdgeMidpoint(visits[i+1].coords);
	                if (!start || !end) continue;
	                const line = L.polyline([start, end], { color, weight:2.5, opacity:0.8, smoothFactor:1.2, lineJoin:'round', interactive:false });
	                group.addLayer(line);
	            }
	        });
	    };

	    const renderScoutLegend = scoutColors => {
	        const legend = document.getElementById('scout-legend');
	        legend.innerHTML = '';
	        if (!Object.keys(window.scoutLayers).length) {
	            legend.innerHTML = '<div class="empty-state"><p>No scouts found for this date</p></div>';
	            return;
	        }
	        Object.keys(window.scoutLayers).forEach(name => {
	            const color = scoutColors[name];
	            const item = document.createElement('label');
	            item.className = 'legend-item';
	            item.innerHTML = `<input type="checkbox" data-scout="${name}" checked>
	                <span class="color-swatch" style="background:${color}"></span>
	                <span class="legend-label">${name}</span>`;
	            item.querySelector('input').addEventListener('change', e => {
	                const layer = window.scoutLayers[e.target.dataset.scout];
	                if (layer) {
	                    if (e.target.checked) window.scoutedBedOverlay.addLayer(layer);
	                    else window.scoutedBedOverlay.removeLayer(layer);
	                }
	            });
	            legend.appendChild(item);
	        });
	    };

	    const renderTimeline = data => {
	        const timeline = data.scout_movement_timeline || [];
	        const section  = document.getElementById('timeline-section');
	        const container = document.getElementById('scout-timeline');

	        if (!timeline.length) { section.style.display = 'none'; return; }
	        section.style.display = 'block';
	        container.innerHTML = '';

	        const allStarts = timeline.map(t => t.start).sort();
	        const allEnds   = timeline.map(t => t.end).sort();
	        const dayStart  = allStarts[0] || '00:00:00';
	        const dayEnd    = allEnds[allEnds.length-1] || '23:59:59';

	        const toSeconds = s => { const [h,m,sec] = String(s).split(':').map(Number); return h*3600+m*60+(sec||0); };
	        const dayStartS = toSeconds(dayStart);
	        const dayRange  = Math.max(toSeconds(dayEnd) - dayStartS, 1);

	        timeline.forEach(t => {
	            const startS  = Math.max(toSeconds(t.start) - dayStartS, 0);
	            const endS    = Math.max(toSeconds(t.end)   - dayStartS, 0);
	            const leftPct  = (startS / dayRange) * 100;
	            const widthPct = Math.max(((endS - startS) / dayRange) * 100, 2);
	            const formatT  = s => String(s).slice(0,5);

	            const el = document.createElement('div');
	            el.className = 'timeline-item';
	            el.innerHTML = `
	                <div class="timeline-top">
	                    <span class="timeline-name">${t.name}</span>
	                    <span class="timeline-gh">${(t.greenhouse||'').split(' - ')[0]}</span>
	                </div>
	                <div class="timeline-time">${formatT(t.start)} – ${formatT(t.end)} · ${t.beds} beds · ${(t.minutesPerBed||0).toFixed(1)} min/bed</div>
	                <div class="timeline-bar">
	                    <div class="timeline-bar-fill" style="margin-left:${leftPct.toFixed(1)}%;width:${widthPct.toFixed(1)}%"></div>
	                </div>`;
	            container.appendChild(el);
	        });
	    };

	    const updateKPIs = data => {
	        const s = data.scouting_summary || {};
	        document.getElementById('kpi-scouts').textContent   = s.total_unique_scouts ?? '—';
	        document.getElementById('kpi-beds').textContent     = s.total_beds_covered ?? '—';
	        document.getElementById('kpi-zones').textContent    = (data.scouting_entries || []).length;
	        const mpb = s.average_minutes_per_bed;
	        document.getElementById('kpi-min-bed').textContent  = mpb ? mpb.toFixed(1) : '—';
	    };

	    const _renderScoutData = (allData, onProgress = () => {}) => {
	        window.lastScoutingData = allData;
	        if (window.scoutedBedOverlay) window.map.removeLayer(window.scoutedBedOverlay);
	        window.scoutLayers = {};
	        window.allLatLngs  = [];
	        document.getElementById('scout-legend').innerHTML = '';
	        const scoutColors = generateScoutColors(allData);
	        window.scoutedBedOverlay = L.layerGroup().addTo(window.map);
	        onProgress(86, 'Drawing zones…');
	        renderZones(allData);
	        onProgress(92, 'Drawing scout paths…');
	        renderScoutFlowLines(allData.scouting_entries, allData.all_zones_geojson || [], scoutColors);
	        onProgress(95, 'Mapping scouted beds…');
	        renderScoutedBeds(allData.scouting_entries, allData.all_zones_geojson || [], scoutColors);
	        onProgress(98, 'Updating stats…');
	        renderScoutLegend(scoutColors);
	        renderTimeline(allData);
	        updateKPIs(allData);
	        onProgress(100, 'Complete');
	        setTimeout(() => hideOverlay(false), 350);
	    };

	    const fetchAllData = (date, greenhouse, background = false) => {
	        const cacheKey = `${date}_${greenhouse || ''}`;

	        // Cache hit — render immediately with progress through render stages
	        if (dataCache.has(cacheKey)) {
	            if (!background) {
	                showOverlay();
	                _renderScoutData(dataCache.get(cacheKey), setProgress);
	            }
	            return;
	        }

	        const ctrl = background ? new AbortController() : (abortCtrl && abortCtrl.abort(), abortCtrl = new AbortController(), abortCtrl);

	        if (!background) showOverlay();

	        // Simulate server-side progress until first byte arrives
	        let serverPct = 5, serverTimer = null;
	        if (!background) {
	            setProgress(serverPct, 'Sending request…');
	            serverTimer = setInterval(() => {
	                serverPct = Math.min(serverPct + 1.2, 45);
	                setProgress(serverPct, 'Server processing…');
	            }, 150);
	        }

	        const body = { date, crops: ['', 'Rose', 'Roses'] };
	        if (greenhouse) body.greenhouse = greenhouse;

	        fetch('/api/method/upande_scp.serverscripts.get_scouting_analysis.getScoutingAnalysis', {
	            method: 'POST',
	            headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': CSRF },
	            body: JSON.stringify(body),
	            signal: ctrl.signal
	        })
	        .then(r => {
	            if (serverTimer) { clearInterval(serverTimer); serverTimer = null; }
	            if (!r.ok) throw new Error('HTTP ' + r.status);
	            if (!background) setProgress(48, 'Downloading…');
	            return streamResponse(r, background ? null : setProgress);
	        })
	        .then(r => {
	            const allData = r.message || r.data;
	            const entries = (allData?.scouting_entries || []).filter(e => e.scouts_name);
	            allData.scouting_entries = entries;
	            // Rose-only page — strip avocado/non-rose entries from the payload
	            // before caching so all downstream views are already filtered.
	            filterToRoses(allData);
	            dataCache.set(cacheKey, allData);
	            if (!background) {
	                _renderScoutData(allData, setProgress);
	                prefetchPastDays(date, greenhouse);
	            }
	        })
	        .catch(err => {
	            if (serverTimer) clearInterval(serverTimer);
	            if (err.name === 'AbortError') return;
	            if (!background) { console.error('Scout data error:', err); hideOverlay(true); }
	        });
	    };

	    const localDateISO = (d = new Date()) => {
	        const y = d.getFullYear();
	        const m = String(d.getMonth() + 1).padStart(2, '0');
	        const day = String(d.getDate()).padStart(2, '0');
	        return `${y}-${m}-${day}`;
	    };

	    const prefetchPastDays = (fromDate, greenhouse) => {
	        const d = new Date(fromDate + 'T00:00:00');
	        for (let i = 1; i <= 3; i++) {
	            d.setDate(d.getDate() - 1);
	            const day = localDateISO(d);
	            if (!dataCache.has(`${day}_${greenhouse || ''}`)) {
	                fetchAllData(day, greenhouse, true);
	            }
	        }
	    };

	    const debouncedFetch = debounce((date, gh) => fetchAllData(date, gh), 300);

	    const initializeMap = () => {
	        if (mapInitialized) return;
	        window.map = L.map('map', { zoomSnap:0.1, zoomDelta:0.1, maxZoom:22.4, zoomControl:true });
	        mapInitialized = true;

	        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	            maxZoom: 19, attribution: '© OpenStreetMap contributors'
	        }).addTo(window.map);

	        window.map.setView([LAT, LON], ZOOM);

	        const today = localDateISO();
	        document.getElementById('scout-date-picker').value = today;

	        fetchAllData(today, '');
	    };

	    // Event listeners
	    document.getElementById('scout-date-picker').addEventListener('change', e => {
	        debouncedFetch(e.target.value, document.getElementById('gh-select').value);
	    });
	    document.getElementById('gh-select').addEventListener('change', e => {
	        zoneCache.clear();
	        debouncedFetch(document.getElementById('scout-date-picker').value, e.target.value);
	    });

	    // ── Farm → Section → Block cascade ──────────────────────────────────
	    const farmSelect    = document.getElementById('farm-select');
	    const sectionSelect = document.getElementById('section-select');
	    const blockSelect   = document.getElementById('gh-select');
	    const farmsByName = new Map((window.farm_hierarchy || []).map(f => [f.name, f]));

	    const populateSections = (farmName) => {
	        const farm = farmsByName.get(farmName);
	        sectionSelect.innerHTML = '<option value="">All Sections</option>';
	        if (!farm) { sectionSelect.disabled = true; return; }
	        (farm.sections || []).forEach(sec => {
	            const opt = document.createElement('option');
	            opt.value = sec.name; // empty string = "(No section)" bucket
	            opt.textContent = sec.label;
	            sectionSelect.appendChild(opt);
	        });
	        sectionSelect.disabled = farm.sections.length === 0;
	    };

	    const populateBlocks = (farmName, sectionName) => {
	        const previous = blockSelect.value;
	        blockSelect.innerHTML = '<option value="">All Blocks / Greenhouses</option>';
	        const farm = farmsByName.get(farmName);
	        const sections = farm
	            ? (sectionName !== null && sectionName !== undefined && farmName
	                ? farm.sections.filter(s => s.name === sectionName)
	                : farm.sections)
	            : (window.farm_hierarchy || []).flatMap(f => f.sections);
	        sections.forEach(sec => {
	            (sec.blocks || []).forEach(b => {
	                const opt = document.createElement('option');
	                opt.value = b.name;
	                opt.textContent = `${b.label} (${b.type || ''})`.trim();
	                blockSelect.appendChild(opt);
	            });
	        });
	        // Preserve prior selection if still in list
	        if (previous && [...blockSelect.options].some(o => o.value === previous)) {
	            blockSelect.value = previous;
	        }
	    };

	    farmSelect.addEventListener('change', () => {
	        const farmName = farmSelect.value;
	        populateSections(farmName);
	        populateBlocks(farmName, '');
	        const center = FARM_DEFAULTS[farmName];
	        if (center && window.map) {
	            window.map.setView([center.lat, center.lon], center.zoom);
	        }
	        zoneCache.clear();
	        debouncedFetch(document.getElementById('scout-date-picker').value, blockSelect.value);
	    });
	    sectionSelect.addEventListener('change', () => {
	        populateBlocks(farmSelect.value, sectionSelect.value);
	        zoneCache.clear();
	        debouncedFetch(document.getElementById('scout-date-picker').value, blockSelect.value);
	    });

	    // Initial population (All Farms → all blocks across hierarchy).
	    populateBlocks('', '');

	    initializeMap();
	};
</script>
{% endblock %}
