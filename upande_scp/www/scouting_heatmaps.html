{% extends "upande_scp/www/map_base.html" %} {% block head %}
<style>
	:root {
		--bg: #ffffff;
		--text: #1f2937;
		--border: #d1d5db;
		--sidebar-bg: #f3f4f6;
		--sidebar-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
		--accent: #4b5563;
		--accent-hover: #374151;
		--hover: #e5e7eb;
	}

	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
	}

	body {
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
			Cantarell, sans-serif;
		background: #f9fafb;
	}

	#dashboard-page {
		height: 100vh;
		width: 100%;
		display: flex;
		position: relative;
		overflow: hidden;
	}

	#content-container {
		flex: 1;
		position: relative;
		z-index: 1;
		overflow: auto;
		padding: 0;
	}

	#sidebar {
		position: relative;
		width: 280px;
		height: 100%;
		background: var(--sidebar-bg);
		border-left: 1px solid var(--border);
		box-shadow: var(--sidebar-shadow);
		z-index: 1000;
		display: flex;
		flex-direction: column;
		transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
		overflow: hidden;
		flex-shrink: 0;
	}

	.sidebar-content {
		flex: 1;
		overflow-y: auto;
		padding: 1.25rem;
		display: flex;
		flex-direction: column;
		gap: 1.5rem;
	}

	.section {
		display: flex;
		flex-direction: column;
		gap: 0.75rem;
	}

	.section-label {
		font-size: 0.875rem;
		font-weight: 600;
		color: var(--text);
		display: flex;
		align-items: center;
		gap: 0.5rem;
	}

	.gh-filter-tabs {
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
		padding: 0.5rem;
		background: var(--bg);
		border-radius: 8px;
		max-height: 300px;
		overflow-y: auto;
	}

	.gh-btn,
	.farm-btn {
		padding: 0.625rem 0.875rem;
		border: 1.5px solid var(--border);
		background: var(--sidebar-bg);
		color: var(--text);
		font-size: 0.875rem;
		font-weight: 600;
		border-radius: 6px;
		cursor: pointer;
		transition: all 0.2s ease;
		text-align: left;
		position: relative;
	}

	.gh-btn:hover:not(.active),
	.farm-btn:hover:not(.active) {
		border-color: var(--accent);
		transform: translateY(-1px);
	}

	.gh-btn.active,
	.farm-btn.active {
		background: var(--accent);
		border-color: var(--accent);
		color: white;
		box-shadow: 0 4px 12px rgba(75, 85, 99, 0.3);
	}

	/* --- All-Greenhouses Table Layout --- */

	.all-gh-table-wrapper {
		overflow-x: auto;
		overflow-y: auto;
		height: 100%;
	}

	.all-gh-table {
		border-collapse: collapse;
		width: max-content;
		min-width: 100%;
	}

	.all-gh-table thead th {
		position: sticky;
		top: 0;
		z-index: 20;
		background: #fff;
		padding: 10px 14px;
		font-size: 13px;
		font-weight: 600;
		color: var(--text);
		text-align: center;
		border-bottom: 2px solid var(--border);
		white-space: nowrap;
	}

	.all-gh-table thead th.col-gh-label {
		text-align: left;
		position: sticky;
		left: 0;
		z-index: 30;
		background: #fff;
		min-width: 100px;
		padding-left: 12px;
	}

	.all-gh-table tbody td {
		vertical-align: top;
		padding: 6px 4px;
		border-bottom: 1px solid #f0f0f0;
	}

	.all-gh-table tbody td.td-gh-label {
		position: sticky;
		left: 0;
		z-index: 10;
		background: #fff;
		padding: 10px 14px 10px 12px;
		white-space: nowrap;
		border-right: 1px solid #e5e7eb;
	}

	.td-gh-date {
		font-size: 12px;
		color: #6b7280;
		line-height: 1.2;
	}

	.td-gh-name {
		font-size: 14px;
		font-weight: 700;
		color: var(--text);
		line-height: 1.4;
	}

	/* --- Mini Heatmap Card inside table cell --- */

	.mini-card {
		display: inline-block;
		border: 1px solid #e5e7eb;
		border-radius: 6px;
		background: #fff;
		min-width: 140px;
		cursor: pointer;
		transition: none;
		vertical-align: top;
		overflow: hidden;
	}

	.mini-card:hover {
		box-shadow: none;
	}

	.mini-card-head {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		padding: 4px 6px 3px;
		border-bottom: 1px solid #f0f0f0;
		background: #fafafa;
	}

	.mini-card-gh {
		font-size: 9px;
		font-weight: 600;
		color: var(--text);
		max-width: 80px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.mini-card-date {
		font-size: 8px;
		color: #9ca3af;
	}

	.mini-card-obs {
		padding: 2px 6px 1px;
		font-size: 9px;
		font-weight: 700;
		color: var(--text);
	}

	.mini-card-body {
		padding: 2px 4px 4px;
	}

	/* --- Mini grid inside card --- */

	.mini-grid {
		display: grid;
		gap: 1px;
	}

	.mini-grid .mg-cell {
		height: 7px;
		font-size: 0;
	}

	.mini-grid .mg-zone-hdr {
		background: transparent;
		height: 8px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 6px;
		color: #9ca3af;
	}

	.mini-grid .mg-bed-lbl {
		background: transparent;
		height: 7px;
		display: flex;
		align-items: center;
		justify-content: flex-end;
		padding-right: 2px;
		font-size: 6px;
		color: #9ca3af;
	}

	.mini-grid .mg-data {
		height: 7px;
		border-radius: 1px;
		box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.04);
	}

	.mini-grid .mg-data.mg-empty {
		background: transparent;
		border: 0.5px solid #f0f0f0;
	}

	.mini-grid .mg-corner {
		height: 8px;
	}

	/* Empty table cell placeholder */
	.mini-card-empty {
		display: inline-block;
		min-width: 140px;
		min-height: 20px;
	}

	/* --- Intensity classes (same as original) --- */

	.intensity-0 {
		opacity: 1;
		background: #e5e7eb !important;
		cursor: default;
	}

	.intensity-1 {
		opacity: 0.2;
	}
	.intensity-2 {
		opacity: 0.4;
	}
	.intensity-3 {
		opacity: 0.6;
	}
	.intensity-4 {
		opacity: 0.8;
	}
	.intensity-5 {
		opacity: 1;
	}

	/* --- Single Greenhouse Horizontal Columns --- */
	.optimized-grid {
		display: flex;
		flex-direction: row;
		gap: 12px;
		padding: 12px;
		overflow-x: auto;
		overflow-y: hidden;
		align-items: flex-start;
		height: 100%;
	}
	.heatmap-card {
		flex: 0 0 auto;
		border: 1px solid #e5e7eb;
		border-radius: 8px;
		background: #fff;
		padding: 10px;
		box-shadow: none;
		display: flex;
		flex-direction: column;
		height: auto;
		width: fit-content;
	}
	.mini-heatmap-wrapper {
		min-width: 0;
		flex: 1 1 auto;
		overflow: visible;
		width: fit-content;
	}
	.mini-heatmap-grid {
		min-width: 0;
		width: fit-content;
	}

	/* --- Modal (same as original) --- */

	.modal {
		position: fixed;
		inset: 0;
		background: rgba(0, 0, 0, 0.8);
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 9999;
	}

	.modal.hidden {
		display: none;
	}

	.modal-content {
		background: white;
		border-radius: 8px;
		box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
		max-width: 90vw;
		max-height: 90vh;
		width: 1200px;
		overflow: auto;
		padding: 30px;
		position: relative;
	}

	.modal-close {
		position: absolute;
		top: 15px;
		right: 20px;
		font-size: 32px;
		color: #6b7280;
		background: none;
		border: none;
		cursor: pointer;
		line-height: 1;
		padding: 0;
		width: 32px;
		height: 32px;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	.modal-close:hover {
		color: #1f2937;
	}

	/* --- Full-size heatmap grid (for modal) --- */

	.heatmap-container {
		padding: 10px;
		border: 1px solid var(--border);
		border-radius: 6px;
		background: var(--bg);
		overflow: hidden;
	}

	.heatmap-grid {
		display: grid;
		gap: 1px;
	}

	.grid-cell {
		display: flex;
		align-items: center;
		justify-content: center;
		height: 20px;
		font-size: 10px;
		font-weight: 500;
		color: #fff;
		transition: all 0.15s ease-out;
		box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.05);
	}

	.zone-header-cell,
	.bed-label-cell {
		background: var(--sidebar-bg);
		color: var(--text);
		font-weight: 600;
		font-size: 7px;
		padding: 0 2px;
		border-radius: 0;
		box-shadow: none;
	}

	.bed-label-cell {
		justify-content: flex-end;
		height: 20px;
	}

	.zone-header-cell {
		justify-content: center;
		height: 20px;
	}

	.data-cell {
		height: 20px;
		border-radius: 2px;
		cursor: pointer;
		position: relative;
	}

	.data-cell:hover {
		transform: none;
		z-index: auto;
		box-shadow: none;
	}

	.legend {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-top: 10px;
		padding-top: 10px;
		border-top: 1px solid #e5e7eb;
		font-size: 11px;
		flex-wrap: wrap;
	}

	.legend-item {
		display: flex;
		align-items: center;
		gap: 5px;
	}

	.legend-box {
		width: 15px;
		height: 10px;
		border-radius: 2px;
	}

	.stage-legend {
		display: flex;
		gap: 5px;
		flex-wrap: wrap;
		margin-top: 5px;
		padding: 5px;
		background: #f9fafb;
		border-radius: 6px;
	}

	.stage-item {
		display: flex;
		align-items: center;
		gap: 5px;
		font-size: 11px;
		padding: 2px 6px;
		background: white;
		border-radius: 4px;
		border: 1px solid #e5e7eb;
	}

	/* --- Loader --- */

	.loader {
		position: fixed;
		top: 50%;
		left: 50%;
		transform: translate(-50%, -50%);
		z-index: 9999;
	}

	.loader.hidden {
		display: none;
	}

	.loader-spinner {
		border: 4px solid #f3f4f6;
		border-top: 4px solid #4b5563;
		border-radius: 50%;
		width: 50px;
		height: 50px;
		animation: spin 1s linear infinite;
	}

	@keyframes spin {
		0% {
			transform: rotate(0deg);
		}
		100% {
			transform: rotate(360deg);
		}
	}

	.empty-state {
		text-align: center;
		padding: 60px 20px;
		color: #6b7280;
	}

	.empty-state svg {
		width: 64px;
		height: 64px;
		margin: 0 auto 16px;
		opacity: 0.5;
	}

	.load-progress {
		font-size: 11px;
		color: #6b7280;
		margin-top: 4px;
	}
</style>
{% endblock %} {% block page_content %}
<div>
	<div id="dashboard-page">
		<div id="content-container">
			<div class="all-gh-table-wrapper" id="all-gh-table-wrapper">
				<!-- Table rendered here -->
			</div>
		</div>

		<div id="sidebar">
			<div class="sidebar-content">
				<h2 class="text-xl font-bold text-gray-800 mb-2">Filters</h2>

				<div class="section">
					<label class="section-label">Observation Date</label>
					<input type="date" id="scout-date-picker" class="gh-btn" />
				</div>

				<div class="section">
					<label class="section-label">Filter by Farm</label>
					<div class="gh-filter-tabs" id="farm-filter"></div>
				</div>

				<div class="section">
					<label class="section-label">Mode</label>
					<div class="gh-filter-tabs" id="mode-filter">
						<button class="farm-btn active" id="mode-single-btn">
							Single Greenhouse
						</button>
						<button class="farm-btn" id="mode-all-btn">View All</button>
					</div>
				</div>

				<div class="section" id="single-gh-filter-section">
					<label class="section-label">Select Greenhouse</label>
					<div class="gh-filter-tabs" id="greenhouse-filter"></div>
				</div>

				<div class="section">
					<div class="load-progress" id="load-progress"></div>
				</div>

				<div class="section" id="debug-section" style="display: none">
					<label class="section-label">Debug</label>
					<div style="display: flex; gap: 8px">
						<button
							type="button"
							class="farm-btn"
							id="debug-copy-btn"
							style="flex: 1; text-align: center"
						>
							Copy Log
						</button>
						<button
							type="button"
							class="farm-btn"
							id="debug-clear-btn"
							style="flex: 1; text-align: center"
						>
							Clear
						</button>
					</div>
					<pre
						id="debug-log"
						style="
							margin-top: 8px;
							background: #fff;
							border: 1px solid var(--border);
							border-radius: 8px;
							padding: 10px;
							max-height: 260px;
							overflow: auto;
							font-size: 11px;
							color: #111827;
							white-space: pre-wrap;
						"
					></pre>
				</div>
			</div>
		</div>
	</div>

	<div id="heatmap-modal" class="modal hidden">
		<div class="modal-content">
			<button class="modal-close" id="modal-close">&times;</button>
			<div id="modal-body"></div>
		</div>
	</div>

	<div id="loader" class="loader hidden">
		<div class="loader-spinner"></div>
	</div>

	<script>
		// ── State ──
		let farmsData = [];
		let greenhouseMap = {};
		let allGreenhouseResults = {};
		let currentDate = new Date().toISOString().split("T")[0];
		let currentFarmFilter = "__all__";
		let currentGreenhouse = "";
		let viewMode = "single";
		let observationData = [];
		let observationTypes = {};
		let maxBedCount = 0;
		let maxZoneCount = 0;
		const cacheSingle = new Map();

		const CATEGORIES = [
			{ key: "pests_scouting_entry", type: "pests" },
			{ key: "diseases_scouting_entry", type: "diseases" },
			{ key: "predators_scouting_entry", type: "predators" },
			{ key: "weeds_scouting_entry", type: "weeds" },
			{ key: "incidents_scouting_entry", type: "incidents" },
			{ key: "physiological_disorders_entry", type: "physiological_disorders" },
		];

		function showLoader() {
			document.getElementById("loader").classList.remove("hidden");
		}

		function hideLoader() {
			document.getElementById("loader").classList.add("hidden");
		}

		function setProgress(text) {
			document.getElementById("load-progress").textContent = text;
		}

		const DEBUG = new URLSearchParams(window.location.search).get("debug") === "1";
		const debugSection = document.getElementById("debug-section");
		const debugLogEl = document.getElementById("debug-log");

		function debugAppend(line) {
			if (!DEBUG) return;
			const ts = new Date().toISOString();
			const msg = `[${ts}] ${line}`;
			if (debugLogEl) {
				debugLogEl.textContent =
					(debugLogEl.textContent ? debugLogEl.textContent + "\n" : "") + msg;
				debugLogEl.scrollTop = debugLogEl.scrollHeight;
			}
			console.log(msg);
		}

		function debugObject(label, obj) {
			if (!DEBUG) return;
			try {
				debugAppend(label + ": " + JSON.stringify(obj, null, 2));
			} catch (e) {
				debugAppend(label + ": [unserializable]");
			}
		}

		async function debugFetch(label, url, options) {
			debugAppend(`FETCH ${label} → ${url}`);
			if (options && options.body) debugAppend(`REQUEST ${label} body → ${options.body}`);
			let res;
			try {
				res = await fetch(url, options);
			} catch (e) {
				debugAppend(`FETCH ${label} network error → ${String(e)}`);
				throw e;
			}

			debugAppend(`FETCH ${label} status → ${res.status} ${res.statusText}`);
			let json = null;
			try {
				json = await res.clone().json();
			} catch (e) {
				let txt = "";
				try {
					txt = await res.clone().text();
				} catch (e2) {
					txt = "";
				}
				debugAppend(
					`FETCH ${label} non-json response → ${txt ? txt.slice(0, 500) : "[empty]"}`
				);
			}
			if (json) debugObject(`FETCH ${label} json`, json);
			return res;
		}

		if (DEBUG && debugSection) {
			debugSection.style.display = "";
			const copyBtn = document.getElementById("debug-copy-btn");
			const clearBtn = document.getElementById("debug-clear-btn");
			if (copyBtn) {
				copyBtn.addEventListener("click", async () => {
					const text = (debugLogEl && debugLogEl.textContent) || "";
					try {
						await navigator.clipboard.writeText(text);
						debugAppend("Copied debug log to clipboard");
					} catch (e) {
						debugAppend("Copy failed: " + String(e));
					}
				});
			}
			if (clearBtn) {
				clearBtn.addEventListener("click", () => {
					if (debugLogEl) debugLogEl.textContent = "";
					debugAppend("Cleared debug log");
				});
			}
			debugAppend("Debug enabled (?debug=1)");
		}

		// ── Fetch farms ──
		function initialize() {
			showLoader();
			document.getElementById("scout-date-picker").value = currentDate;

			(DEBUG
				? debugFetch(
						"getFarmsAndGreenhouses",
						"/api/method/upande_scp.serverscripts.get_heatmap_data.getFarmsAndGreenhouses",
						{
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"X-Frappe-CSRF-Token": "{{ csrf_token }}",
							},
						}
				  )
				: fetch(
						"/api/method/upande_scp.serverscripts.get_heatmap_data.getFarmsAndGreenhouses",
						{
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"X-Frappe-CSRF-Token": "{{ csrf_token }}",
							},
						}
				  )
			)
				.then((r) => r.json())
				.then((response) => {
					debugObject("Farms response.message", response && response.message);
					farmsData = response.message.farms || [];

					farmsData.forEach((farm) => {
						(farm.greenhouses || []).forEach((gh) => {
							greenhouseMap[gh.name] = {
								farmName: farm.name,
								warehouse_name: gh.warehouse_name,
							};
						});
					});

					setupFarmFilter();
					setupModeFilter();
					setupGreenhouseFilter();
					const fg =
						farmsData[0] && farmsData[0].greenhouses && farmsData[0].greenhouses[0];
					if (fg) {
						currentGreenhouse = fg.name;
						if (viewMode === "single") {
							fetchSingleGreenhouse();
						} else {
							loadAllScoutedGreenhouses();
						}
					} else {
						showEmptyState();
					}
				})
				.catch((err) => {
					console.error("Error fetching farms:", err);
					hideLoader();
					showEmptyState();
				});
		}

		function setupModeFilter() {
			const singleBtn = document.getElementById("mode-single-btn");
			const allBtn = document.getElementById("mode-all-btn");
			const singleSec = document.getElementById("single-gh-filter-section");
			singleBtn.addEventListener("click", () => {
				singleBtn.classList.add("active");
				allBtn.classList.remove("active");
				viewMode = "single";
				singleSec.style.display = "";
				fetchSingleGreenhouse();
			});
			allBtn.addEventListener("click", () => {
				allBtn.classList.add("active");
				singleBtn.classList.remove("active");
				viewMode = "all";
				singleSec.style.display = "none";
				loadAllScoutedGreenhouses();
			});
		}

		function setupGreenhouseFilter() {
			const filterContainer = document.getElementById("greenhouse-filter");
			filterContainer.innerHTML = "";
			const all = [];
			farmsData.forEach((f) => {
				(f.greenhouses || []).forEach((gh) => all.push(gh.name));
			});
			all.forEach((name) => {
				const btn = document.createElement("button");
				btn.className = "gh-btn" + (name === currentGreenhouse ? " active" : "");
				btn.textContent = name;
				btn.addEventListener("click", () => {
					document
						.querySelectorAll("#greenhouse-filter .gh-btn")
						.forEach((b) => b.classList.remove("active"));
					btn.classList.add("active");
					currentGreenhouse = name;
					if (viewMode === "single") fetchSingleGreenhouse();
				});
				filterContainer.appendChild(btn);
			});
		}

		// ── Fetch only scouted greenhouses for the date ──
		function loadAllScoutedGreenhouses() {
			showLoader();
			allGreenhouseResults = {};
			setProgress("Finding scouted greenhouses...");

			(DEBUG
				? debugFetch(
						"getAllScoutedGreenhouses",

						{
							method: "POST",

							},

				  )

						{
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"X-Frappe-CSRF-Token": "{{ csrf_token }}",

							body: JSON.stringify({ date: currentDate }),

				  )
			)

						setProgress("");

					setProgress("Loading 0 / " + scoutedList.length + " greenhouses...");
					let completed = 0;
					const total = scoutedList.length;

					scoutedList.forEach((ghName) => {
						(DEBUG
							? debugFetch(
									"getHeatmapData " + ghName,
									"/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData",
									{
										method: "POST",
										headers: {
											"Content-Type": "application/json",
											"X-Frappe-CSRF-Token": "{{ csrf_token }}",
										},
										body: JSON.stringify({
											date: currentDate,
											greenhouse: ghName,
										}),
									}
							  )
							: fetch(
									"/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData",
									{
										method: "POST",
										headers: {
											"Content-Type": "application/json",
											"X-Frappe-CSRF-Token": "{{ csrf_token }}",
										},
										body: JSON.stringify({
											date: currentDate,
											greenhouse: ghName,
										}),
									}
							  )

							.then((r) => (r.ok ? r.json() : Promise.reject(r)))
							.then((response) => {
								const data = response.message;
								if (
									data &&
									data.scouting_entries &&
									data.scouting_entries.length > 0
								) {
									const info = greenhouseMap[ghName] || {};
									data._farmName = info.farmName || "";
									data._warehouseName = info.warehouse_name || ghName;
									data._ghName = ghName;
									allGreenhouseResults[ghName] = data;
									debugAppend(
										`Loaded ${ghName} entries → ${data.scouting_entries.length}`
									);
								} else {
									debugAppend(`Loaded ${ghName} entries → 0 (skipped)`);
								}
							})
							.catch((err) => {
								console.error("Error fetching " + ghName + ":", err);
								debugAppend(
									"Error fetching " +

										" → " +

												: err
										)
								);

							.finally(() => {
								completed++;
								setProgress(
									"Loading " + completed + " / " + total + " greenhouses..."
								);
								if (completed >= total) {
									hideLoader();
									setProgress(total + " greenhouses loaded");

										"All greenhouse fetches completed. Result keys → " +
											Object.keys(allGreenhouseResults).length
									);

							});

					console.error("Error fetching scouted list:", err);
					hideLoader();
					showEmptyState();
					debugAppend("Error fetching scouted list → " + String(err));

		// ── Render the consolidated table ──
		function renderAllGreenhousesTable() {
			const wrapper = document.getElementById("all-gh-table-wrapper");

			// Filter by farm
			let greenhouses = [];
			Object.keys(allGreenhouseResults).forEach((ghName) => {
				const d = allGreenhouseResults[ghName];
				if (currentFarmFilter === "__all__" || d._farmName === currentFarmFilter) {
					greenhouses.push(d);
				}
			});

			greenhouses.sort((a, b) => (a._ghName || "").localeCompare(b._ghName || ""));

			if (greenhouses.length === 0) {
				debugAppend("Render table: no greenhouses after filtering");
				showEmptyState();
				return;
			}

			// Collect all unique observation names across all greenhouses
			const obsMap = {};
			greenhouses.forEach((ghData) => {
				(ghData.scouting_entries || []).forEach((entry) => {
					CATEGORIES.forEach((cat) => {
						const items = entry[cat.key] || [];
						items.forEach((item) => {
							if (!obsMap[item.name]) {
								let color = "#999999";
								const typeData =
									ghData.observation_types && ghData.observation_types[cat.type];
								if (typeData && typeData[item.name]) {
									color = typeData[item.name].color || color;
								}
								obsMap[item.name] = {
									name: item.name,
									category: cat.type,
									catKey: cat.key,
									color: color,
								};
							}
						});
					});
				});
			});

			const observations = Object.values(obsMap).sort((a, b) =>
				a.name.localeCompare(b.name)
			);

			if (observations.length === 0) {
				debugAppend("Render table: no observations detected across scouting_entries");
				showEmptyState();
				return;
			}

			// Build table DOM
			const table = document.createElement("table");
			table.className = "all-gh-table";

			// Thead
			const thead = document.createElement("thead");
			const headerRow = document.createElement("tr");

			const thCorner = document.createElement("th");
			thCorner.className = "col-gh-label";
			thCorner.textContent = "";
			headerRow.appendChild(thCorner);

			observations.forEach((obs) => {
				const th = document.createElement("th");
				th.textContent = obs.name;
				headerRow.appendChild(th);
			});

			thead.appendChild(headerRow);
			table.appendChild(thead);

			// Tbody
			const tbody = document.createElement("tbody");

			greenhouses.forEach((ghData) => {
				const ghName = ghData._ghName || "";
				const ghLabel = (ghData._warehouseName || ghName).replace(/ - .+$/, "");
				const bedCount = ghData.bed_count || 0;
				const zoneCount = ghData.zone_count || 0;

				// Collect beds that actually have ANY scouting data in this greenhouse
				const activeBedSet = {};
				const activeZoneSet = {};
				(ghData.scouting_entries || []).forEach((entry) => {
					const parsed = parseZone(entry.zone);
					if (parsed) {
						activeBedSet[parsed.bed] = true;
						activeZoneSet[parsed.zone] = true;
					}
				});
				const activeBeds = Object.keys(activeBedSet)
					.map(Number)
					.sort((a, b) => b - a);
				const activeZones = Object.keys(activeZoneSet)
					.map(Number)
					.sort((a, b) => b - a);

				const tr = document.createElement("tr");

				// Row label
				const tdLabel = document.createElement("td");
				tdLabel.className = "td-gh-label";
				tdLabel.innerHTML =
					'<div class="td-gh-date">' +
					escapeHtml(currentDate) +
					"</div>" +
					'<div class="td-gh-name">' +
					escapeHtml(ghLabel) +
					"</div>";
				tr.appendChild(tdLabel);

				// Each observation column
				observations.forEach((obs) => {
					const td = document.createElement("td");
					const cardEl = buildMiniCard(
						ghData,
						ghLabel,
						obs,
						bedCount,
						zoneCount,
						activeBeds,
						activeZones
					);
					if (cardEl) {
						td.appendChild(cardEl);
					} else {
						const empty = document.createElement("div");
						empty.className = "mini-card-empty";
						td.appendChild(empty);
					}
					tr.appendChild(td);
				});

				tbody.appendChild(tr);
			});

			table.appendChild(tbody);
			wrapper.innerHTML = "";
			wrapper.appendChild(table);
		}

		function fetchSingleGreenhouse() {
			showLoader();
			setProgress("Loading " + currentGreenhouse + "...");
			const key = currentDate + "|" + currentGreenhouse;
			const cached = cacheSingle.get(key);
			const doRender = (data) => {
				observationData = data.scouting_entries || [];
				observationTypes = data.observation_types || {};
				maxBedCount = data.bed_count || 0;
				maxZoneCount = data.zone_count || 0;
				renderSingleHeatmaps(currentGreenhouse);
			};
			if (cached) {
				doRender(cached);
				hideLoader();
				setProgress("");
				return;
			}
			(DEBUG
				? debugFetch(
						"getHeatmapData " + currentGreenhouse,
						"/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData",
						{
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"X-Frappe-CSRF-Token": "{{ csrf_token }}",
							},
							body: JSON.stringify({
								date: currentDate,
								greenhouse: currentGreenhouse,
							}),
						}
				  )
				: fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData", {
						method: "POST",
						headers: {
							"Content-Type": "application/json",
							"X-Frappe-CSRF-Token": "{{ csrf_token }}",
						},
						body: JSON.stringify({
							date: currentDate,
							greenhouse: currentGreenhouse,
						}),
				  })
			)
				.then((r) => (r.ok ? r.json() : Promise.reject(r)))
				.then((response) => {
					const data = response.message || response.data || {};
					cacheSingle.set(key, data);
					doRender(data);
				})
				.catch(() => {
					showEmptyState();
				})
				.finally(() => {
					hideLoader();
					setProgress("");
				});
		}

		function renderSingleHeatmaps(gh) {
			const wrapper = document.getElementById("all-gh-table-wrapper");
			wrapper.innerHTML = "";
			const container = document.createElement("div");
			container.className = "optimized-grid";
			const TYPES_ORDER = [
				"pests",
				"diseases",
				"predators",
				"weeds",
				"incidents",
				"physiological_disorders",
				"crop_husbandry_practices",
			];
			const types = TYPES_ORDER.filter((t) => observationTypes && observationTypes[t]);
			let has = false;
			types.forEach((t) => {
				const obs = observationTypes[t] || {};
				Object.keys(obs)
					.sort((a, b) => a.localeCompare(b))
					.forEach((name) => {
						const card = buildSingleCard(gh, name, t);
						if (card) {
							container.appendChild(card);
							has = true;
						}
					});
			});
			if (!has) {
				showEmptyState();
				return;
			}
			wrapper.appendChild(container);
		}

		function buildSingleCard(gh, observationName, observationType) {
			const metadata =
				observationTypes[observationType] &&
				observationTypes[observationType][observationName];
			if (!metadata) return null;
			const r = calculateMatrixSingle(gh, observationName, observationType);
			if (r.total === 0) return null;
			const card = document.createElement("div");
			card.className = "heatmap-card";
			const header = document.createElement("div");
			header.style.marginBottom = "6px";
			header.innerHTML =
				'<p style="font-weight:600;color:' +
				(metadata.color || "#999") +
				';font-size:12px;margin-bottom:2px;">' +
				observationName +
				'</p><p style="font-size:10px;color:#6b7280;">Total: ' +
				r.total +
				"</p>";
			card.appendChild(header);
			const wrapper = document.createElement("div");
			wrapper.className = "mini-heatmap-wrapper";
			const mini = renderGridSingle(r.matrix, r.maxCount, metadata.color || "#999");
			wrapper.appendChild(mini);
			card.appendChild(wrapper);
			card.addEventListener("click", () =>
				openModal(
					gh,
					observationName,
					observationType,
					metadata.color || "#999",
					r.matrix,
					r.maxCount,
					r.total,
					r.stageBreakdown,
					maxBedCount,
					maxZoneCount,
					observationTypes
				)
			);
			return card;
		}

		function renderGridSingle(matrix, maxCount, color) {
			const grid = document.createElement("div");
			grid.className = "mini-heatmap-grid";
			const outer = document.createElement("div");
			outer.className = "heatmap-grid";
			const vh = window.innerHeight || 400;
			const availH = Math.max(120, Math.floor((vh * 6) / 8) - 48);
			const rows = maxBedCount + 1;
			const compactFactor = 0.75;
			const cellHeight = Math.max(4, Math.floor((availH / rows) * compactFactor));
			const cellWidth = Math.max(6, Math.floor(cellHeight * 2.5));
			const labelColWidth = 24;
			outer.style.gridTemplateColumns =
				labelColWidth + "px repeat(" + maxZoneCount + ", " + cellWidth + "px)";
			const corner = document.createElement("div");
			corner.className = "grid-cell";
			corner.style.height = cellHeight + "px";
			outer.appendChild(corner);
			for (let z = maxZoneCount; z >= 1; z--) {
				const h = document.createElement("div");
				h.className = "grid-cell zone-header-cell";
				h.textContent = z % 2 === 0 ? z : "";
				h.style.height = cellHeight + "px";
				outer.appendChild(h);
			}
			for (let bed = maxBedCount; bed >= 1; bed--) {
				const bl = document.createElement("div");
				bl.className = "grid-cell bed-label-cell";
				bl.textContent = bed % 2 === 0 ? bed : "";
				bl.style.height = cellHeight + "px";
				outer.appendChild(bl);
				for (let zone = maxZoneCount; zone >= 1; zone--) {
					const cnt = (matrix[bed] && matrix[bed][zone]) || 0;
					const d = document.createElement("div");
					d.className = "grid-cell data-cell " + getIntensityClass(cnt, maxCount);
					d.style.height = cellHeight + "px";
					if (cnt > 0 && maxCount > 0) d.style.backgroundColor = color;
					d.title = "Bed " + bed + " – Zone " + zone + ": " + (cnt || "None");
					outer.appendChild(d);
				}
			}
			grid.appendChild(outer);
			return grid;
		}

		function calculateMatrixSingle(gh, observationName, observationType) {
			const matrix = {};
			let maxCount = 0;
			let total = 0;
			const stageBreakdown = {};
			const catMap = {
				pests: "pests_scouting_entry",
				diseases: "diseases_scouting_entry",
				predators: "predators_scouting_entry",
				weeds: "weeds_scouting_entry",
				incidents: "incidents_scouting_entry",
				physiological_disorders: "physiological_disorders_entry",
				crop_husbandry_practices: "crop_husbandry_practices_entry",
			};
			const key = catMap[observationType] || observationType;
			(observationData || []).forEach((entry) => {
				const items = entry[key] || [];
				const parsed = parseZone(entry.zone);
				if (!parsed || parsed.gh !== gh) return;
				items.forEach((item) => {
					if (item.name !== observationName) return;
					const bed = parsed.bed;
					const zone = parsed.zone;
					const cnt = item.count || 1;
					if (!matrix[bed]) matrix[bed] = {};
					matrix[bed][zone] = (matrix[bed][zone] || 0) + cnt;
					if (cnt > 0) {
						maxCount = Math.max(maxCount, cnt);
						total += cnt;
					}
					const st = item.stage || "Present";
					stageBreakdown[st] = (stageBreakdown[st] || 0) + cnt;
				});
			});
			return { matrix, maxCount, total, stageBreakdown };
		}
		// ── Build a mini heatmap card for one greenhouse + one observation ──
		function buildMiniCard(
			ghData,
			ghLabel,
			obs,
			bedCount,
			zoneCount,
			activeBeds,
			activeZones
		) {
			const entries = ghData.scouting_entries || [];
			const matrix = {};
			let maxCount = 0;
			let total = 0;
			const stageBreakdown = {};

			entries.forEach((entry) => {
				const items = entry[obs.catKey] || [];
				items.forEach((item) => {
					if (item.name !== obs.name) return;

					const parsed = parseZone(entry.zone);
					if (!parsed) return;

					const bed = parsed.bed;
					const zone = parsed.zone;
					const cnt = item.count || 1;

					if (!matrix[bed]) matrix[bed] = {};
					if (!matrix[bed][zone]) matrix[bed][zone] = 0;
					matrix[bed][zone] += cnt;

					total += cnt;
					maxCount = Math.max(maxCount, matrix[bed][zone]);

					const stage = item.stage || "Present";
					if (!stageBreakdown[stage]) stageBreakdown[stage] = 0;
					stageBreakdown[stage] += cnt;
				});
			});

			if (total === 0) return null;

			// Build card element
			const card = document.createElement("div");
			card.className = "mini-card";

			card.addEventListener("click", () => {
				openModal(
					ghLabel,
					obs.name,
					obs.category,
					obs.color,
					matrix,
					maxCount,
					total,
					stageBreakdown,
					bedCount,
					zoneCount,
					ghData.observation_types
				);
			});

			// Header
			const head = document.createElement("div");
			head.className = "mini-card-head";
			head.innerHTML =
				'<span class="mini-card-gh">' +
				escapeHtml(ghLabel) +
				"</span>" +
				'<span class="mini-card-date">' +
				escapeHtml(currentDate) +
				"</span>";
			card.appendChild(head);

			// Observation name
			const obsDiv = document.createElement("div");
			obsDiv.className = "mini-card-obs";
			obsDiv.textContent = obs.name;
			card.appendChild(obsDiv);

			// Mini grid body — only show active beds and zones
			const body = document.createElement("div");
			body.className = "mini-card-body";

			const grid = document.createElement("div");
			grid.className = "mini-grid";
			grid.style.gridTemplateColumns = "22px repeat(" + activeZones.length + ", 1fr)";

			// Corner cell
			const corner = document.createElement("div");
			corner.className = "mg-corner";
			grid.appendChild(corner);

			// Zone headers — only active zones (already sorted high to low)
			activeZones.forEach((z) => {
				const zh = document.createElement("div");
				zh.className = "mg-zone-hdr";
				zh.textContent = z;
				grid.appendChild(zh);
			});

			// Bed rows — only active beds (already sorted high to low)
			activeBeds.forEach((bed) => {
				const bedLbl = document.createElement("div");
				bedLbl.className = "mg-bed-lbl";
				bedLbl.textContent = bed;
				grid.appendChild(bedLbl);

				activeZones.forEach((zone) => {
					const cnt = (matrix[bed] && matrix[bed][zone]) || 0;
					const cell = document.createElement("div");
					cell.className = "mg-data";

					if (cnt > 0) {
						cell.style.backgroundColor = obs.color;
						cell.className += " " + getIntensityClass(cnt, maxCount);
						cell.title = "Bed " + bed + " \u2013 Zone " + zone + ": " + cnt;
					} else {
						cell.className += " mg-empty";
						cell.title = "Bed " + bed + " \u2013 Zone " + zone + ": None";
					}

					grid.appendChild(cell);
				});
			});

			body.appendChild(grid);
			card.appendChild(body);

			return card;
		}

		// ── Parse zone string (same as original) ──
		function parseZone(zoneStr) {
			const m = zoneStr.match(/^(.+?)\s+-\s+Bed\s+(\d+)\s+-\s+Zone\s+(\d+)$/);
			if (!m) return null;
			return {
				gh: m[1].trim(),
				bed: +m[2],
				zone: +m[3],
			};
		}

		// ── Intensity class (same as original) ──
		function getIntensityClass(count, max) {
			if (count === 0) return "intensity-0";
			const r = count / max;
			if (r <= 0.2) return "intensity-1";
			if (r <= 0.4) return "intensity-2";
			if (r <= 0.6) return "intensity-3";
			if (r <= 0.8) return "intensity-4";
			return "intensity-5";
		}

		// ── Full heatmap grid for modal (same as original) ──
		function renderFullHeatmapGrid(matrix, maxCount, color, bedCount, zoneCount) {
			const grid = document.createElement("div");
			grid.className = "heatmap-grid";
			grid.style.gridTemplateColumns = "50px repeat(" + zoneCount + ", 1fr)";

			// Corner
			const corner = document.createElement("div");
			corner.className = "grid-cell";
			grid.appendChild(corner);

			// Zone headers
			for (let z = zoneCount; z >= 1; z--) {
				const lbl = document.createElement("div");
				lbl.className = "grid-cell zone-header-cell";
				lbl.textContent = z;
				grid.appendChild(lbl);
			}

			// Bed rows
			for (let bed = bedCount; bed >= 1; bed--) {
				const bedLbl = document.createElement("div");
				bedLbl.className = "grid-cell bed-label-cell";
				bedLbl.textContent = bed;
				grid.appendChild(bedLbl);

				for (let zone = zoneCount; zone >= 1; zone--) {
					const cnt = (matrix[bed] && matrix[bed][zone]) || 0;
					const cellDiv = document.createElement("div");
					cellDiv.className = "grid-cell data-cell " + getIntensityClass(cnt, maxCount);

					if (cnt > 0 && maxCount > 0) {
						cellDiv.style.backgroundColor = color;
					}

					cellDiv.title = "Bed " + bed + " \u2013 Zone " + zone + ": " + (cnt || "None");

					if (cnt === 0) {
						cellDiv.style.backgroundColor = "";
						cellDiv.title = "Bed " + bed + " \u2013 Zone " + zone + ": None";
					}

					grid.appendChild(cellDiv);
				}
			}

			const container = document.createElement("div");
			container.className = "heatmap-container";
			container.appendChild(grid);
			return container;
		}

		// ── Modal (same pattern as original) ──

		document.getElementById("modal-close").addEventListener("click", () => {
			modal.classList.add("hidden");

		function openModal(

			observationName,
			observationType,

			maxCount,
			total,
			stageBreakdown,
			bedCount,

			// Header
			const header = document.createElement("div");
			header.style.marginBottom = "20px";
			header.innerHTML =
				'<h2 style="font-size:24px;font-weight:700;color:' +
				color +
				';margin-bottom:8px;">' +
				escapeHtml(observationName) +
				"</h2>" +
				'<p style="font-size:14px;color:#6b7280;">' +
				escapeHtml(ghLabel) +
				" | Date: " +
				escapeHtml(currentDate) +
				" | Total Count: " +
				total +
				"</p>";
			modalBody.appendChild(header);

			// Stage breakdown
			if (metadata && metadata.stages && metadata.stages.length > 0) {
				const stageLegendDiv = document.createElement("div");
				stageLegendDiv.className = "stage-legend";

				const title = document.createElement("div");
				title.style.fontWeight = "600";
				title.style.fontSize = "13px";
				title.style.marginBottom = "8px";
				title.style.width = "100%";
				title.textContent = "Stages Breakdown:";
				stageLegendDiv.appendChild(title);

				metadata.stages.forEach((stage) => {
					const stageItem = document.createElement("div");
					stageItem.className = "stage-item";
					const stageCount = stageBreakdown[stage.stage] || 0;
					stageItem.innerHTML =
						(stage.symbol
							? '<span style="font-size:16px;">' + stage.symbol + "</span>"
							: "") +
						"<span>" +
						escapeHtml(stage.stage) +
						"</span>" +
						'<span style="font-size:11px;color:#9ca3af;">(' +
						stageCount +
						")</span>";
					stageLegendDiv.appendChild(stageItem);
				});
				modalBody.appendChild(stageLegendDiv);
			}

			// Full grid
			const fullGrid = renderFullHeatmapGrid(matrix, maxCount, color, bedCount, zoneCount);
			fullGrid.style.marginTop = "20px";
			modalBody.appendChild(fullGrid);

			// Legend
			const legend = document.createElement("div");
			legend.className = "legend";
			legend.style.marginTop = "20px";
			legend.innerHTML =
				'<div class="legend-item"><div class="legend-box intensity-0" style="background:' +
				color +
				';"></div><span>None (0)</span></div>' +
				'<div class="legend-item"><div class="legend-box intensity-2" style="background:' +
				color +
				';"></div><span>Low</span></div>' +
				'<div class="legend-item"><div class="legend-box intensity-4" style="background:' +
				color +
				';"></div><span>Medium</span></div>' +
				'<div class="legend-item"><div class="legend-box intensity-5" style="background:' +
				color +
				';"></div><span>High</span></div>' +
				'<div style="margin-left:auto;font-weight:600;">Max: ' +
				maxCount +
				"</div>";
			modalBody.appendChild(legend);

			modal.classList.remove("hidden");
		}

		// ── Farm filter ──
		function setupFarmFilter() {
			const filterContainer = document.getElementById("farm-filter");
			filterContainer.innerHTML = "";

			// All Farms button
			const allBtn = document.createElement("button");
			allBtn.className = "farm-btn" + (currentFarmFilter === "__all__" ? " active" : "");
			allBtn.textContent = "All Farms";
			allBtn.addEventListener("click", () => {
				document
					.querySelectorAll(".farm-btn")
					.forEach((btn) => btn.classList.remove("active"));
				allBtn.classList.add("active");
				currentFarmFilter = "__all__";
				renderAllGreenhousesTable();
			});
			filterContainer.appendChild(allBtn);

			farmsData.forEach((farm) => {
				const button = document.createElement("button");
				button.className = "farm-btn" + (farm.name === currentFarmFilter ? " active" : "");
				button.textContent = farm.name;

				button.addEventListener("click", () => {
					document
						.querySelectorAll(".farm-btn")
						.forEach((btn) => btn.classList.remove("active"));
					button.classList.add("active");
					currentFarmFilter = farm.name;
					renderAllGreenhousesTable();
				});

				filterContainer.appendChild(button);
			});
		}

		// ── Date change ──
		document.getElementById("scout-date-picker").addEventListener("change", (e) => {
			currentDate = e.target.value;
			if (viewMode === "single") {
				cacheSingle.clear();
				fetchSingleGreenhouse();
			} else {
				loadAllScoutedGreenhouses();
			}
		});

		// ── Empty state ──
		function showEmptyState() {
			const wrapper = document.getElementById("all-gh-table-wrapper");
			wrapper.innerHTML = `
                <div class="empty-state">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                    </svg>
                    <p style="font-weight: 600; margin-bottom: 8px;">No Data Available</p>
                    <p>No scouting entries found for this date.</p>
                </div>
            `;
		}

		// ── Escape HTML ──
		function escapeHtml(str) {
			if (!str) return "";
			const div = document.createElement("div");
			div.textContent = str;
			return div.innerHTML;
		}

		// ── Init ──
		document.addEventListener("DOMContentLoaded", initialize);
	</script>
</div>
{% endblock %}
