{% extends "upande_scp/www/map_base.html" %}

{% block head %}
<style>
	/* ────────────────────────────────────────────────
	   SCOUTING HEATMAPS — theme aligned with
	   observations_map: Inter font, white panels on
	   light-gray canvas, deep-gray (#4b5563) accent.
	   ──────────────────────────────────────────────── */
	:root {
		--hm-bg:        #f5f7fa;
		--hm-bg-soft:   #f3f4f6;
		--hm-card:      #ffffff;
		--hm-ink:       #374151;
		--hm-text:      #374151;
		--hm-muted:     #6b7280;
		--hm-quiet:     #9ca3af;
		--hm-line:      #e5e7eb;
		--hm-line-soft: #f3f4f6;
		--hm-accent:    #4b5563;
		--hm-accent-2:  #374151;
		--hm-pistachio: #f3f4f6;
		--hm-pistachio-2: #e5e7eb;
		--hm-marker:    #4b5563;
		--hm-tooltip:   #4b5563;

		--hm-radius:    8px;
		--hm-radius-lg: 12px;
		--hm-radius-pill: 999px;

		--hm-shadow-1: 0 1px 2px rgba(0,0,0,.05);
		--hm-shadow-2: 0 4px 12px rgba(0,0,0,.08);
		--hm-shadow-3: 0 18px 48px rgba(0,0,0,.12);

		--hm-font:        "Inter", "Helvetica Neue", Arial, sans-serif;
		--hm-font-display:"Inter", "Helvetica Neue", Arial, sans-serif;
	}

	#dashboard-page {
		height: 100vh;
		width: 100%;
		display: flex;
		position: relative;
		overflow: hidden;
		font-family: var(--hm-font);
		color: var(--hm-text);
		background: var(--hm-bg);
	}

	#content-container {
		flex: 1;
		position: relative;
		z-index: 1;
		display: flex;
		flex-direction: column;
		overflow: hidden;
		padding: 0;
	}

	/* ── Sticky top toolbar (mirrors scouting_trends header) ── */
	.hm-toolbar {
		flex-shrink: 0;
		background: var(--hm-card);
		border-bottom: 1px solid var(--hm-line);
		position: sticky;
		top: 0;
		z-index: 30;
	}
	.hm-toolbar-row {
		display: flex;
		align-items: flex-end;
		justify-content: space-between;
		gap: 16px;
		padding: 12px 20px;
		flex-wrap: wrap;
	}
	.hm-toolbar-left { min-width: 0; flex: 1 1 260px; }
	.hm-title {
		margin: 0;
		font-family: var(--hm-font);
		font-size: 1.05rem;
		font-weight: 600;
		color: var(--hm-ink);
		letter-spacing: -.01em;
		line-height: 1.2;
	}
	.hm-subtitle {
		display: block;
		margin-bottom: 1px;
		font-size: .64rem;
		text-transform: uppercase;
		letter-spacing: .04em;
		color: var(--hm-quiet);
		font-weight: 500;
	}
	.hm-stat-strip {
		display: flex;
		flex-wrap: wrap;
		gap: 4px 16px;
		margin-top: 6px;
		font-size: .7rem;
		color: var(--hm-muted);
	}
	.hm-stat-strip span {
		display: inline-flex;
		align-items: baseline;
		gap: 4px;
	}
	.hm-stat-strip b {
		font-weight: 600;
		color: var(--hm-text);
		font-variant-numeric: tabular-nums;
		font-size: .72rem;
	}

	.hm-toolbar-right {
		display: flex;
		align-items: flex-end;
		gap: 10px;
		flex-wrap: wrap;
	}

	.hm-filter-field {
		display: flex;
		flex-direction: column;
		gap: 3px;
	}
	.hm-filter-field label {
		font-size: .62rem;
		font-weight: 700;
		color: var(--hm-quiet);
		text-transform: uppercase;
		letter-spacing: .04em;
	}
	.hm-input {
		height: 32px;
		padding: 0 10px;
		border: 1px solid #d1d5db;
		border-radius: var(--hm-radius);
		font-size: .78rem;
		color: var(--hm-text);
		background: var(--hm-card);
		outline: none;
		font-family: inherit;
		min-width: 140px;
		font-variant-numeric: tabular-nums;
	}
	.hm-input:focus {
		border-color: var(--hm-accent);
		box-shadow: 0 0 0 2px rgba(75,85,99,.18);
	}

	/* ── Multi-select dropdown (Farms / Greenhouses / Pests) ── */
	.hm-dd { position: relative; align-self: flex-end; }
	.hm-dd-btn {
		height: 32px;
		padding: 0 12px;
		border: 1px solid var(--hm-line);
		border-radius: var(--hm-radius);
		background: var(--hm-card);
		color: var(--hm-text);
		font-family: inherit;
		font-size: .76rem;
		font-weight: 600;
		cursor: pointer;
		display: inline-flex;
		align-items: center;
		gap: 8px;
		transition: border-color .12s, box-shadow .12s, background .12s;
	}
	.hm-dd-btn:hover { border-color: #cbd5e1; }
	.hm-dd-btn[aria-expanded="true"] {
		border-color: var(--hm-accent);
		box-shadow: 0 0 0 2px rgba(75,85,99,.18);
	}
	.hm-dd-btn > svg:not(.hm-dd-caret) { width: 14px; height: 14px; color: var(--hm-quiet); }
	.hm-dd-btn-label { letter-spacing: .15px; }
	.hm-dd-btn-count {
		min-width: 28px;
		height: 18px;
		padding: 0 7px;
		border-radius: var(--hm-radius-pill);
		background: var(--hm-pistachio);
		color: var(--hm-muted);
		font-size: .65rem;
		font-weight: 700;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		transition: background .12s, color .12s;
	}
	.hm-dd-btn-count[data-active="true"] {
		background: var(--hm-accent);
		color: #fff;
	}
	.hm-dd-caret {
		width: 12px;
		height: 12px;
		transition: transform .15s;
	}
	.hm-dd-btn[aria-expanded="true"] .hm-dd-caret { transform: rotate(180deg); }

	.hm-dd-pop {
		position: absolute;
		top: calc(100% + 6px);
		right: 0;
		z-index: 50;
		width: 320px;
		max-height: 70vh;
		background: var(--hm-card);
		border: 1px solid var(--hm-line);
		border-radius: var(--hm-radius);
		box-shadow: var(--hm-shadow-3);
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}
	.hm-dd-pop[hidden] { display: none; }

	.hm-dd-head {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 10px 12px;
		border-bottom: 1px solid var(--hm-line-soft);
	}
	.hm-dd-title {
		flex: 1;
		font-size: .72rem;
		font-weight: 700;
		color: var(--hm-accent-2);
		text-transform: uppercase;
		letter-spacing: .6px;
	}
	.hm-dd-actions { display: flex; gap: 4px; }
	.hm-link-btn {
		border: none;
		background: transparent;
		font-size: .68rem;
		font-weight: 600;
		color: var(--hm-muted);
		cursor: pointer;
		padding: 3px 8px;
		border-radius: 4px;
		font-family: inherit;
		transition: background .12s, color .12s;
	}
	.hm-link-btn:hover { background: rgba(75,85,99,.08); color: var(--hm-text); }

	.hm-dd-search {
		position: relative;
		padding: 8px 10px;
		border-bottom: 1px solid var(--hm-line-soft);
	}
	.hm-dd-search input {
		width: 100%;
		height: 30px;
		padding: 0 10px 0 30px;
		border: 1px solid var(--hm-line);
		border-radius: var(--hm-radius);
		font-size: .76rem;
		font-family: inherit;
		color: var(--hm-text);
		background: var(--hm-card);
		outline: none;
	}
	.hm-dd-search input:focus {
		border-color: var(--hm-accent);
		box-shadow: 0 0 0 2px rgba(75,85,99,.18);
	}
	.hm-dd-search svg {
		position: absolute;
		left: 20px;
		top: 50%;
		transform: translateY(-50%);
		width: 14px;
		height: 14px;
		color: var(--hm-quiet);
		pointer-events: none;
	}

	.hm-dd-list {
		flex: 1;
		min-height: 80px;
		max-height: 360px;
		overflow-y: auto;
		padding: 4px 0 8px;
	}
	.hm-dd-list::-webkit-scrollbar { width: 8px; }
	.hm-dd-list::-webkit-scrollbar-thumb { background: var(--hm-line); border-radius: 4px; }
	.hm-dd-list::-webkit-scrollbar-track { background: transparent; }

	.hm-dd-section {
		padding: 8px 12px 4px;
		font-size: .6rem;
		font-weight: 700;
		color: var(--hm-quiet);
		text-transform: uppercase;
		letter-spacing: .08em;
	}

	.hm-dd-row {
		display: flex;
		align-items: center;
		gap: 8px;
		padding: 5px 12px;
		cursor: pointer;
		user-select: none;
		transition: background .1s;
		font-size: .8rem;
		color: var(--hm-text);
	}
	.hm-dd-row:hover { background: rgba(75,85,99,.06); }
	.hm-dd-row[data-hidden="true"] { display: none; }
	.hm-dd-row[data-checked="true"] {
		color: var(--hm-accent-2);
		font-weight: 600;
	}

	.hm-dd-check {
		width: 14px;
		height: 14px;
		border: 1.5px solid var(--hm-line);
		border-radius: 3px;
		background: var(--hm-card);
		flex-shrink: 0;
		display: inline-flex;
		align-items: center;
		justify-content: center;
		color: #fff;
		transition: background .1s, border-color .1s;
	}
	.hm-dd-check svg { width: 10px; height: 10px; display: none; }
	.hm-dd-row[data-checked="true"] .hm-dd-check {
		background: var(--hm-accent);
		border-color: var(--hm-accent);
	}
	.hm-dd-row[data-checked="true"] .hm-dd-check svg { display: block; }

	.hm-dd-color {
		width: 10px;
		height: 10px;
		border-radius: 3px;
		flex-shrink: 0;
		border: 1px solid rgba(0,0,0,.08);
	}
	.hm-dd-name {
		flex: 1;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}
	.hm-dd-empty {
		padding: 16px;
		text-align: center;
		color: var(--hm-quiet);
		font-size: .76rem;
	}

	/* ── Main content area ── */
	.hm-main {
		flex: 1;
		min-height: 0;
		display: flex;
		flex-direction: column;
		padding: 14px 18px 18px;
	}


	/* ── All-Greenhouses Table ───────────────────── */
	.all-gh-table-wrapper {
		flex: 1;
		min-height: 0;
		overflow: auto;
		background: var(--hm-card);
	}

	.all-gh-table {
		border-collapse: separate;
		border-spacing: 0;
		width: max-content;
		min-width: 100%;
	}

	.all-gh-table thead th {
		position: sticky;
		top: 0;
		z-index: 20;
		background: var(--hm-card);
		padding: 10px 14px;
		font-size: 11px;
		font-weight: 600;
		color: var(--hm-quiet);
		text-align: left;
		text-transform: uppercase;
		letter-spacing: .04em;
		border-bottom: 1px solid var(--hm-line);
		white-space: nowrap;
	}

	.all-gh-table thead th.col-gh-label {
		text-align: left;
		position: sticky;
		left: 0;
		z-index: 30;
		min-width: 110px;
		padding-left: 14px;
	}

	.all-gh-table tbody td {
		vertical-align: top;
		padding: 8px 6px;
		border-bottom: 1px solid var(--hm-line-soft);
	}

	.all-gh-table tbody tr:hover td { background: var(--hm-bg-soft); }

	.all-gh-table tbody td.td-gh-label {
		position: sticky;
		left: 0;
		z-index: 10;
		background: var(--hm-card);
		padding: 12px 16px 12px 14px;
		white-space: nowrap;
		transition: background .15s ease;
	}

	.td-gh-date {
		font-size: 11px;
		color: var(--hm-quiet);
		line-height: 1.2;
		font-variant-numeric: tabular-nums;
	}

	.td-gh-name {
		font-family: var(--hm-font-display);
		font-size: 14px;
		font-weight: 600;
		color: var(--hm-ink);
		line-height: 1.2;
		letter-spacing: -.01em;
	}

	/* ── Mini Heatmap Card inside table cell ─────── */
	.mini-card {
		display: inline-block;
		background: var(--hm-card);
		min-width: 144px;
		cursor: pointer;
		vertical-align: top;
		transition: background .15s ease;
	}
	.mini-card:hover { background: var(--hm-bg-soft); }

	.mini-card-head {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		padding: 4px 8px 3px;
	}

	.mini-card-gh {
		font-size: 9px;
		font-weight: 600;
		color: var(--hm-text);
		max-width: 84px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.mini-card-date {
		font-size: 8px;
		color: var(--hm-quiet);
		font-variant-numeric: tabular-nums;
	}

	.mini-card-obs {
		padding: 2px 8px 2px;
		font-size: 10px;
		font-weight: 600;
		color: var(--hm-text);
	}

	.mini-card-body {
		padding: 2px 6px 6px;
	}

	/* Fallback shown when zone polygons are missing or degenerate. */
	.upright-empty {
		display: flex;
		align-items: center;
		justify-content: center;
		height: 90px;
		color: var(--hm-quiet);
		font-size: 9px;
		font-style: italic;
		border: 1px dashed var(--hm-line);
		border-radius: var(--hm-radius);
	}

	/* ── SVG floor plan (same algorithm as the observations_map modal).
	   Layers: faint baseline rail per bed, coloured polylines per
	   zone-segment (gray when no observations), bed numbers per block. */
	.upright-svg {
		display: block;
		width: 100%;
		height: auto;
	}
	.upright-svg-lg {
		max-height: 560px;
	}
	.upright-svg .gh-bed-baseline {
		stroke: #cbd5e1;
		stroke-width: 0.6;
		stroke-opacity: 0.55;
		fill: none;
		pointer-events: none;
	}
	.upright-svg .gh-zone {
		cursor: pointer;
		stroke-linejoin: miter;
		stroke-linecap: butt;
		fill: none;
	}
	.upright-svg .gh-zone:hover {
		filter: brightness(0.85);
	}
	.upright-svg .gh-bed-label {
		font-size: 5px;
		font-weight: 600;
		fill: var(--hm-quiet);
		dominant-baseline: middle;
		pointer-events: none;
		font-family: var(--hm-font);
	}
	.upright-svg-lg .gh-bed-label {
		font-size: 8px;
	}

	/* Stage legend chip used inside the modal */
	.stage-glyph-chip {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		width: 22px;
		height: 22px;
		border-radius: var(--hm-radius);
		background: var(--hm-ink);
		color: #fff;
		font-weight: 700;
		font-size: 11px;
		font-family: var(--hm-font);
		flex-shrink: 0;
	}

	.mini-card-multi-day { position: relative; }

	.mini-card-empty {
		display: inline-block;
		min-width: 144px;
		min-height: 24px;
	}

	.day-indicator {
		display: flex;
		gap: 4px;
		align-items: center;
		margin-top: 4px;
		padding: 0 6px;
		font-size: 7px;
		color: var(--hm-quiet);
		font-weight: 500;
	}

	.day-dot {
		width: 6px;
		height: 6px;
		border-radius: 50%;
		display: inline-block;
	}

	/* ── Modal ───────────────────────────────────── */
	.modal {
		position: fixed;
		inset: 0;
		background: rgba(20,32,26,.62);
		backdrop-filter: blur(3px);
		-webkit-backdrop-filter: blur(3px);
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 9999;
	}

	.modal.hidden { display: none; }

	.modal-content {
		background: var(--hm-card);
		border-radius: var(--hm-radius-lg);
		max-width: 92vw;
		max-height: 90vh;
		width: 1200px;
		overflow: auto;
		padding: 28px 32px;
		position: relative;
		box-shadow: 0 16px 40px rgba(0,0,0,.14);
	}

	.modal-close {
		position: absolute;
		top: 14px;
		right: 18px;
		font-size: 22px;
		color: var(--hm-quiet);
		background: transparent;
		border: none;
		cursor: pointer;
		line-height: 1;
		padding: 0;
		width: 32px;
		height: 32px;
		border-radius: var(--hm-radius-pill);
		display: flex;
		align-items: center;
		justify-content: center;
		transition: background .15s ease, color .15s ease;
	}
	.modal-close:hover { background: var(--hm-pistachio); color: var(--hm-ink); }

	#modal-body h2 {
		font-family: var(--hm-font-display);
		letter-spacing: -.02em !important;
	}

	/* Modal: container wrapping each per-day plot — flat, no chrome. */
	.heatmap-container {
		padding: 6px 0 0;
	}

	.legend {
		display: flex;
		align-items: center;
		gap: 14px;
		margin-top: 18px;
		padding-top: 12px;
		border-top: 1px solid var(--hm-line-soft);
		font-size: 11px;
		color: var(--hm-muted);
		flex-wrap: wrap;
	}

	.legend-item {
		display: flex;
		align-items: center;
		gap: 6px;
		font-weight: 500;
	}

	.legend-box {
		width: 16px;
		height: 10px;
		border-radius: 2px;
	}

	/* Stage chips inline above the per-day plots — no surrounding box. */
	.stage-legend {
		display: flex;
		gap: 10px 14px;
		flex-wrap: wrap;
		margin-top: 12px;
		padding: 0;
	}

	.stage-item {
		display: inline-flex;
		align-items: center;
		gap: 6px;
		font-size: 11px;
		padding: 0;
		background: transparent;
		border: none;
		font-weight: 500;
		color: var(--hm-text);
	}

	/* Multi-day comparison in modal — three columns separated by hairlines. */
	.multi-day-grids {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
		gap: 0;
		margin-top: 16px;
	}

	.day-section {
		padding: 4px 16px;
		border-left: 1px solid var(--hm-line-soft);
	}
	.day-section:first-child {
		border-left: none;
		padding-left: 0;
	}
	.day-section:last-child { padding-right: 0; }

	.day-section h4 {
		margin: 0 0 8px 0;
		font-family: var(--hm-font);
		font-size: 11px;
		text-transform: uppercase;
		letter-spacing: .8px;
		font-weight: 600;
		color: var(--hm-quiet);
	}

	/* ── Loader ──────────────────────────────────── */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(244,242,236,0.94);
		backdrop-filter: blur(2px);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.55rem;
	}
	.map-load-title {
		font-family: var(--hm-font-display);
		font-size: 1rem;
		font-weight: 600;
		color: var(--hm-ink);
		margin-bottom: 0.15rem;
		letter-spacing: -.015em;
	}
	.map-load-track {
		width: 240px; height: 6px;
		background: var(--hm-line); border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: linear-gradient(90deg, var(--hm-accent), var(--hm-pistachio-2));
		border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status {
		font-size: 0.72rem;
		color: var(--hm-accent);
		font-weight: 700;
		min-width: 240px;
		text-align: center;
		font-variant-numeric: tabular-nums;
		letter-spacing: .04em;
	}

	.empty-state {
		text-align: center;
		padding: 64px 24px;
		color: var(--hm-muted);
		font-family: var(--hm-font);
	}

	.empty-state svg {
		width: 64px;
		height: 64px;
		margin: 0 auto 16px;
		opacity: 0.4;
		color: var(--hm-accent);
	}

	.empty-state p:first-of-type {
		font-family: var(--hm-font-display);
		font-size: 1.15rem;
		font-weight: 600;
		color: var(--hm-ink);
		letter-spacing: -.015em;
		margin-bottom: 8px;
	}

	@media (max-width: 768px) {
		.hm-toolbar-row { padding: 10px 14px; gap: 12px; }
		.hm-title { font-size: 1.1rem; }
		.hm-main { padding: 12px 14px 14px; }
		.hm-dd-pop { width: min(320px, calc(100vw - 28px)); }
		.modal-content { padding: 22px; }
	}
</style>
{% endblock %}

{% block page_content %}
<div>
	<div id="dashboard-page">
		<div id="content-container" style="position:relative">
			<div id="map-loader" style="display:none">
				<span class="map-load-title">Loading heatmap data</span>
				<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
				<span class="map-load-status" id="map-load-status">0%</span>
			</div>
			<!-- ─── Sticky toolbar ─── -->
			<header class="hm-toolbar">
				<div class="hm-toolbar-row">
					<div class="hm-toolbar-left">
						<span class="hm-subtitle">Scouting · Zone Heatmaps</span>
						<h1 class="hm-title">Pest &amp; Disease Density</h1>
						<div class="hm-stat-strip" aria-label="Filtered totals">
							<span><b id="hm-stat-gh">—</b>Greenhouses</span>
							<span><b id="hm-stat-obs">—</b>Observations</span>
							<span><b id="hm-stat-beds">—</b>Zones</span>
							<span><b id="hm-stat-farms">—</b>Farms</span>
						</div>
					</div>
					<div class="hm-toolbar-right">
						<div class="hm-filter-field">
							<label for="scout-date-picker">Date</label>
							<input type="date" id="scout-date-picker" class="hm-input" />
						</div>

						<!-- Farms multi-select -->
						<div class="hm-dd" data-popover-id="hm-pop-farms">
							<button type="button" class="hm-dd-btn" id="hm-farms-btn" aria-haspopup="dialog" aria-expanded="false">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 22V8l10-5 10 5v14"/><path d="M9 22v-7h6v7"/></svg>
								<span class="hm-dd-btn-label">Farms</span>
								<span class="hm-dd-btn-count" id="hm-farms-count">All</span>
								<svg class="hm-dd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="hm-dd-pop" id="hm-pop-farms" hidden>
								<div class="hm-dd-head">
									<div class="hm-dd-title">Farms</div>
									<div class="hm-dd-actions">
										<button type="button" class="hm-link-btn" data-action="hm-farms-clear">Clear</button>
									</div>
								</div>
								<div class="hm-dd-list" id="hm-farms-list"></div>
							</div>
						</div>

						<!-- Greenhouses multi-select -->
						<div class="hm-dd" data-popover-id="hm-pop-greenhouses">
							<button type="button" class="hm-dd-btn" id="hm-gh-btn" aria-haspopup="dialog" aria-expanded="false">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M9 21v-6h6v6"/></svg>
								<span class="hm-dd-btn-label">Greenhouses</span>
								<span class="hm-dd-btn-count" id="hm-gh-count">All</span>
								<svg class="hm-dd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="hm-dd-pop" id="hm-pop-greenhouses" hidden>
								<div class="hm-dd-head">
									<div class="hm-dd-title">Greenhouses</div>
									<div class="hm-dd-actions">
										<button type="button" class="hm-link-btn" data-action="hm-gh-clear">Clear</button>
									</div>
								</div>
								<div class="hm-dd-search">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
									<input type="text" id="hm-gh-search" placeholder="Search greenhouses…" />
								</div>
								<div class="hm-dd-list" id="hm-gh-list"></div>
							</div>
						</div>

						<!-- Pests multi-select -->
						<div class="hm-dd" data-popover-id="hm-pop-pests">
							<button type="button" class="hm-dd-btn" id="hm-pest-btn" aria-haspopup="dialog" aria-expanded="false">
								<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v4M12 14v4M8 10h8"/></svg>
								<span class="hm-dd-btn-label">Observations</span>
								<span class="hm-dd-btn-count" id="hm-pest-count">All</span>
								<svg class="hm-dd-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
							</button>
							<div class="hm-dd-pop" id="hm-pop-pests" hidden>
								<div class="hm-dd-head">
									<div class="hm-dd-title">Pests &amp; observations</div>
									<div class="hm-dd-actions">
										<button type="button" class="hm-link-btn" data-action="hm-pest-clear">Clear</button>
									</div>
								</div>
								<div class="hm-dd-search">
									<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
									<input type="text" id="hm-pest-search" placeholder="Search…" />
								</div>
								<div class="hm-dd-list" id="hm-pest-list"></div>
							</div>
						</div>
					</div>
				</div>
			</header>

			<!-- ─── Heatmap grid ─── -->
			<main class="hm-main">
				<div class="all-gh-table-wrapper" id="all-gh-table-wrapper">
					<!-- Table rendered here -->
				</div>
			</main>
		</div>

	<div id="heatmap-modal" class="modal hidden">
		<div class="modal-content">
			<button class="modal-close" id="modal-close">&times;</button>
			<div id="modal-body"></div>
		</div>
	</div>

	<script>
		// ── State ──
		let farmsData = [];
		let greenhouseMap = {};
		let allGreenhouseResults = {};
		const localDateISO = (d = new Date()) => {
			const y = d.getFullYear();
			const m = String(d.getMonth() + 1).padStart(2, "0");
			const day = String(d.getDate()).padStart(2, "0");
			return `${y}-${m}-${day}`;
		};
		let currentDate = localDateISO();
		// Most recent scouting date ≤ currentDate — drives the "primary" view
		// of the table/cards. May differ from currentDate if no scouting
		// happened on the picked day.
		let primaryDate = currentDate;
		// Multi-select filter state. Empty Set ⇒ "All" (no filter applied).
		let selectedFarms = new Set();
		let selectedGreenhouses = new Set();
		let selectedPests = new Set();
		let allPestsList = []; // [{name, category, catKey, color}]

		// Multi-day data storage (3 days)
		let multiDayData = {}; // { 'YYYY-MM-DD': { greenhouseName: data } } — sparse: only (date, gh) pairs we requested
		let availableDates = []; // union of all per-greenhouse dates, sorted desc
		let perGreenhouseDates = {}; // { ghName: [d1, d2, d3] } — each gh's own last 3 scouting dates

		// ── Abort + cache ──
		const dateCache = new Map();
		let activeAbortControllers = [];

		const abortAllRequests = () => {
			activeAbortControllers.forEach(ctrl => { try { ctrl.abort(); } catch (_) {} });
			activeAbortControllers = [];
		};

		const CATEGORIES = [
			{ key: "pests_scouting_entry", type: "pests" },
			{ key: "diseases_scouting_entry", type: "diseases" },
			{ key: "predators_scouting_entry", type: "predators" },
			{ key: "weeds_scouting_entry", type: "weeds" },
			{ key: "incidents_scouting_entry", type: "incidents" },
			{ key: "physiological_disorders_entry", type: "physiological_disorders" },
		];

		function setProgress(pct) {
			const fill = document.getElementById("map-load-fill");
			const status = document.getElementById("map-load-status");
			if (fill) fill.style.width = Math.min(100, pct) + "%";
			if (status) status.textContent = Math.round(Math.min(100, pct)) + "%";
		}

		function showLoader() {
			setProgress(0);
			document.getElementById("map-loader").style.display = "flex";
		}

		function hideLoader() {
			document.getElementById("map-loader").style.display = "none";
		}

		// ── Per-greenhouse last 3 scouting dates (≤ currentDate) ──
		// Each greenhouse's columns line up with days that greenhouse was
		// actually scouted — a house scouted Mon, Wed, last Fri shows those
		// three, not the global Wed/Tue/Mon.
		function fetchPerGreenhouseDates() {
			return fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getRecentScoutingDatesPerGreenhouse", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": "{{ csrf_token }}",
				},
				body: JSON.stringify({ date: currentDate, limit: 3 }),
			})
				.then(r => r.ok ? r.json() : Promise.reject(r))
				.then(r => (r.message && r.message.greenhouses) || {})
				.catch(err => {
					console.error("Error fetching per-greenhouse scouting dates:", err);
					return {};
				});
		}

		// ── Fetch farms ──
		function initialize() {
			showLoader();
			document.getElementById("scout-date-picker").value = currentDate;

			fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getFarmsAndGreenhouses", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": "{{ csrf_token }}",
				},
			})
				.then((r) => r.json())
				.then((response) => {
					farmsData = response.message.farms || [];

					farmsData.forEach((farm) => {
						(farm.greenhouses || []).forEach((gh) => {
							greenhouseMap[gh.name] = {
								farmName: farm.name,
								warehouse_name: gh.warehouse_name,
							};
						});
					});

					populateFarmsDropdown();
					populateGreenhousesDropdown();
					loadMultiDayData();
				})
				.catch((err) => {
					console.error("Error fetching farms:", err);
					hideLoader();
					showEmptyState();
				});
		}

		// ── Multi-select dropdown helpers ──
		const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

		function ddRow(opts) {
			// opts: { value, label, color?, set, onChange }
			const row = document.createElement("div");
			row.className = "hm-dd-row";
			row.dataset.value = opts.value;
			row.dataset.label = (opts.label || "").toLowerCase();
			row.dataset.checked = opts.set.has(opts.value) ? "true" : "false";
			let inner = '<span class="hm-dd-check">' + CHECK_SVG + '</span>';
			if (opts.color) inner += '<span class="hm-dd-color" style="background:' + opts.color + '"></span>';
			inner += '<span class="hm-dd-name" title="' + escapeHtml(opts.label) + '">' + escapeHtml(opts.label) + '</span>';
			row.innerHTML = inner;
			row.addEventListener("click", () => {
				if (opts.set.has(opts.value)) opts.set.delete(opts.value);
				else opts.set.add(opts.value);
				row.dataset.checked = opts.set.has(opts.value) ? "true" : "false";
				opts.onChange();
			});
			return row;
		}

		function applyDdSearch(listEl, query) {
			const q = (query || "").trim().toLowerCase();
			listEl.querySelectorAll(".hm-dd-row").forEach(row => {
				row.dataset.hidden = q && !row.dataset.label.includes(q) ? "true" : "false";
			});
			listEl.querySelectorAll(".hm-dd-section").forEach(sec => {
				let next = sec.nextElementSibling;
				let anyVisible = false;
				while (next && !next.classList.contains("hm-dd-section")) {
					if (next.classList.contains("hm-dd-row") && next.dataset.hidden !== "true") {
						anyVisible = true;
						break;
					}
					next = next.nextElementSibling;
				}
				sec.style.display = anyVisible ? "" : "none";
			});
		}

		function updateDdCount(countEl, n, total) {
			countEl.textContent = n === 0 ? "All" : String(n);
			countEl.dataset.active = n > 0 ? "true" : "false";
		}

		// ── Populate Farms dropdown ──
		function populateFarmsDropdown() {
			const list = document.getElementById("hm-farms-list");
			list.innerHTML = "";
			if (!farmsData.length) {
				list.innerHTML = '<div class="hm-dd-empty">No farms available.</div>';
			} else {
				farmsData.forEach(farm => {
					list.appendChild(ddRow({
						value: farm.name,
						label: farm.name,
						set: selectedFarms,
						onChange: () => {
							updateDdCount(document.getElementById("hm-farms-count"), selectedFarms.size, farmsData.length);
							renderAllGreenhousesTable();
						},
					}));
				});
			}
			updateDdCount(document.getElementById("hm-farms-count"), selectedFarms.size, farmsData.length);
		}

		// ── Populate Greenhouses dropdown (grouped by farm) ──
		function populateGreenhousesDropdown() {
			const list = document.getElementById("hm-gh-list");
			list.innerHTML = "";
			let total = 0;
			if (!farmsData.length) {
				list.innerHTML = '<div class="hm-dd-empty">No greenhouses available.</div>';
			} else {
				farmsData.forEach(farm => {
					const ghs = (farm.greenhouses || []).slice().sort((a, b) => {
						const al = (a.warehouse_name || a.name).toLowerCase();
						const bl = (b.warehouse_name || b.name).toLowerCase();
						return al.localeCompare(bl);
					});
					if (!ghs.length) return;
					const sec = document.createElement("div");
					sec.className = "hm-dd-section";
					sec.textContent = farm.name;
					list.appendChild(sec);
					ghs.forEach(gh => {
						total++;
						const label = (gh.warehouse_name || gh.name).replace(/ - .+$/, "");
						list.appendChild(ddRow({
							value: gh.name,
							label: label,
							set: selectedGreenhouses,
							onChange: () => {
								updateDdCount(document.getElementById("hm-gh-count"), selectedGreenhouses.size, total);
								renderAllGreenhousesTable();
							},
						}));
					});
				});
			}
			updateDdCount(document.getElementById("hm-gh-count"), selectedGreenhouses.size, total);
		}

		// ── Populate Pests dropdown (grouped by category) ──
		function populatePestsDropdown(pestList) {
			allPestsList = pestList || [];
			const list = document.getElementById("hm-pest-list");
			list.innerHTML = "";

			// Drop selections that no longer exist in the loaded data
			const knownNames = new Set(allPestsList.map(p => p.name));
			[...selectedPests].forEach(name => {
				if (!knownNames.has(name)) selectedPests.delete(name);
			});

			if (!allPestsList.length) {
				list.innerHTML = '<div class="hm-dd-empty">No observations on these dates.</div>';
				updateDdCount(document.getElementById("hm-pest-count"), 0, 0);
				return;
			}

			const byCategory = {};
			CATEGORIES.forEach(c => { byCategory[c.type] = []; });
			allPestsList.forEach(p => {
				if (!byCategory[p.category]) byCategory[p.category] = [];
				byCategory[p.category].push(p);
			});

			const onChange = () => {
				updateDdCount(document.getElementById("hm-pest-count"), selectedPests.size, allPestsList.length);
				renderAllGreenhousesTable();
			};

			CATEGORIES.forEach(cat => {
				const items = (byCategory[cat.type] || []).slice().sort((a, b) => a.name.localeCompare(b.name));
				if (!items.length) return;
				const sec = document.createElement("div");
				sec.className = "hm-dd-section";
				sec.textContent = cat.type.replace(/_/g, " ");
				list.appendChild(sec);
				items.forEach(p => {
					list.appendChild(ddRow({
						value: p.name,
						label: p.name,
						color: p.color,
						set: selectedPests,
						onChange: onChange,
					}));
				});
			});

			updateDdCount(document.getElementById("hm-pest-count"), selectedPests.size, allPestsList.length);
		}

		// ── Popover behaviour (mirrors scouting_trends header) ──
		function closeAllPopovers() {
			document.querySelectorAll(".hm-dd-pop").forEach(p => p.setAttribute("hidden", ""));
			document.querySelectorAll(".hm-dd-btn").forEach(b => b.setAttribute("aria-expanded", "false"));
		}
		function togglePopover(ddEl) {
			const btn = ddEl.querySelector(".hm-dd-btn");
			const pop = document.getElementById(ddEl.dataset.popoverId);
			if (!btn || !pop) return;
			const open = btn.getAttribute("aria-expanded") === "true";
			closeAllPopovers();
			if (!open) {
				pop.removeAttribute("hidden");
				btn.setAttribute("aria-expanded", "true");
			}
		}
		function bindDropdowns() {
			document.querySelectorAll(".hm-dd").forEach(dd => {
				const btn = dd.querySelector(".hm-dd-btn");
				if (btn) btn.addEventListener("click", ev => { ev.stopPropagation(); togglePopover(dd); });
				const pop = document.getElementById(dd.dataset.popoverId);
				if (pop) pop.addEventListener("click", ev => ev.stopPropagation());
			});
			document.addEventListener("click", () => closeAllPopovers());
			document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeAllPopovers(); });

			// Search inputs (greenhouse + pest)
			const ghSearch = document.getElementById("hm-gh-search");
			if (ghSearch) ghSearch.addEventListener("input", e => applyDdSearch(document.getElementById("hm-gh-list"), e.target.value));
			const pestSearch = document.getElementById("hm-pest-search");
			if (pestSearch) pestSearch.addEventListener("input", e => applyDdSearch(document.getElementById("hm-pest-list"), e.target.value));

			// Clear-all buttons
			document.querySelector('[data-action="hm-farms-clear"]').addEventListener("click", () => {
				selectedFarms.clear();
				populateFarmsDropdown();
				renderAllGreenhousesTable();
			});
			document.querySelector('[data-action="hm-gh-clear"]').addEventListener("click", () => {
				selectedGreenhouses.clear();
				populateGreenhousesDropdown();
				renderAllGreenhousesTable();
			});
			document.querySelector('[data-action="hm-pest-clear"]').addEventListener("click", () => {
				selectedPests.clear();
				populatePestsDropdown(allPestsList);
				renderAllGreenhousesTable();
			});
		}

		// ── Load data for each greenhouse's own last 3 scouting dates ──
		function loadMultiDayData() {
			abortAllRequests();
			showLoader();
			multiDayData = {};
			perGreenhouseDates = {};
			availableDates = [];
			setProgress(0);

			fetchPerGreenhouseDates().then(perGh => {
				perGreenhouseDates = perGh;
				const ghNames = Object.keys(perGh);
				if (!ghNames.length) {
					hideLoader();
					showEmptyState();
					return;
				}

				// Build (gh, date) work list and the sorted union of all dates
				const dateSet = new Set();
				const pairs = [];
				ghNames.forEach(gh => {
					(perGh[gh] || []).forEach(date => {
						dateSet.add(date);
						pairs.push({ gh: gh, date: date });
					});
				});
				availableDates = Array.from(dateSet).sort().reverse();
				primaryDate = availableDates[0] || currentDate;

				if (!pairs.length) {
					hideLoader();
					showEmptyState();
					return;
				}

				let completed = 0;
				const total = pairs.length;
				const loadPromises = pairs.map(({ gh, date }) =>
					loadGreenhouseDay(gh, date).then(data => {
						if (data) {
							if (!multiDayData[date]) multiDayData[date] = {};
							multiDayData[date][gh] = data;
						}
						completed++;
						setProgress((completed / total) * 100);
					})
				);

				Promise.all(loadPromises)
					.then(() => {
						const allPests = collectAllPests();
						populatePestsDropdown(allPests);

						// Per-greenhouse primary = first loaded date in its own list
						allGreenhouseResults = {};
						ghNames.forEach(gh => {
							const dates = perGh[gh] || [];
							for (const d of dates) {
								if (multiDayData[d] && multiDayData[d][gh]) {
									allGreenhouseResults[gh] = multiDayData[d][gh];
									break;
								}
							}
						});
						dateCache.set(primaryDate, allGreenhouseResults);

						setProgress(100);
						setTimeout(hideLoader, 350);
						renderAllGreenhousesTable();
					})
					.catch(err => {
						if (err.name === "AbortError") return;
						console.error("Error loading multi-day data:", err);
						hideLoader();
						showEmptyState();
					});
			});
		}

		// ── Load heatmap data for one (greenhouse, date) pair ──
		function loadGreenhouseDay(ghName, date) {
			const ctrl = new AbortController();
			activeAbortControllers.push(ctrl);
			return fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": "{{ csrf_token }}",
				},
				body: JSON.stringify({ date: date, greenhouse: ghName }),
				signal: ctrl.signal,
			})
				.then(r => r.ok ? r.json() : Promise.reject(r))
				.then(response => {
					const data = response.message;
					if (data && data.scouting_entries && data.scouting_entries.length > 0) {
						const info = greenhouseMap[ghName] || {};
						data._farmName = info.farmName || "";
						data._warehouseName = info.warehouse_name || ghName;
						data._ghName = ghName;
						return data;
					}
					return null;
				})
				.catch(err => {
					if (err.name === "AbortError") return null;
					console.error("Error fetching " + ghName + " " + date + ":", err);
					return null;
				});
		}

		// ── Collect all unique pests across all days ──
		function collectAllPests() {
			const pestMap = {};
			
			Object.values(multiDayData).forEach(dayData => {
				Object.values(dayData).forEach(ghData => {
					(ghData.scouting_entries || []).forEach(entry => {
						CATEGORIES.forEach(cat => {
							const items = entry[cat.key] || [];
							items.forEach(item => {
								if (!pestMap[item.name]) {
									let color = "#999999";
									const typeData = ghData.observation_types && ghData.observation_types[cat.type];
									if (typeData && typeData[item.name]) {
										color = typeData[item.name].color || color;
									}
									pestMap[item.name] = {
										name: item.name,
										category: cat.type,
										catKey: cat.key,
										color: color,
									};
								}
							});
						});
					});
				});
			});

			return Object.values(pestMap).sort((a, b) => a.name.localeCompare(b.name));
		}

		// ── Update summary with filtered data ──
		// Counts are zone-based: obsTotal is sum of observations across zones,
		// zonesTotal is the number of distinct (bed, zone) cells that had any
		// scouting activity. We never surface "entries" as a primitive.
		function updateHeatmapSummary(greenhouses) {
			const farms = new Set();
			let obsTotal = 0;
			let zonesTotal = 0;

			greenhouses.forEach(g => {
				if (g._farmName) farms.add(g._farmName);
				const zoneSet = new Set();
				(g.scouting_entries || []).forEach(entry => {
					if (entry.zone) zoneSet.add(entry.zone);
					CATEGORIES.forEach(cat => {
						const items = entry[cat.key] || [];
						items.forEach(it => { obsTotal += +(it.count || it.bed_count || 1) || 1; });
					});
				});
				zonesTotal += zoneSet.size;
			});

			const set = (id, val) => {
				const el = document.getElementById(id);
				if (el) el.textContent = String(val);
			};
			set("hm-stat-gh", greenhouses.length);
			set("hm-stat-obs", obsTotal);
			set("hm-stat-beds", zonesTotal);
			set("hm-stat-farms", farms.size);
		}

		// ── Render the consolidated table ──
		function renderAllGreenhousesTable() {
			const wrapper = document.getElementById("all-gh-table-wrapper");

			// Filter greenhouses (empty Set ⇒ "All")
			let greenhouses = [];
			Object.keys(allGreenhouseResults).forEach(ghName => {
				const d = allGreenhouseResults[ghName];
				if (selectedFarms.size && !selectedFarms.has(d._farmName)) return;
				if (selectedGreenhouses.size && !selectedGreenhouses.has(d._ghName)) return;
				greenhouses.push(d);
			});

			greenhouses.sort((a, b) => (a._ghName || "").localeCompare(b._ghName || ""));

			updateHeatmapSummary(greenhouses);

			if (greenhouses.length === 0) {
				showEmptyState();
				return;
			}

			// Collect observations filtered by pest filter
			const obsMap = {};
			greenhouses.forEach(ghData => {
				(ghData.scouting_entries || []).forEach(entry => {
					CATEGORIES.forEach(cat => {
						const items = entry[cat.key] || [];
						items.forEach(item => {
							if (selectedPests.size && !selectedPests.has(item.name)) return;
							if (!obsMap[item.name]) {
								let color = "#999999";
								const typeData = ghData.observation_types && ghData.observation_types[cat.type];
								if (typeData && typeData[item.name]) {
									color = typeData[item.name].color || color;
								}
								obsMap[item.name] = {
									name: item.name,
									category: cat.type,
									catKey: cat.key,
									color: color,
								};
							}
						});
					});
				});
			});

			const observations = Object.values(obsMap).sort((a, b) => a.name.localeCompare(b.name));

			if (observations.length === 0) {
				showEmptyState();
				return;
			}

			// Build table
			const table = document.createElement("table");
			table.className = "all-gh-table";

			// Thead
			const thead = document.createElement("thead");
			const headerRow = document.createElement("tr");

			const thCorner = document.createElement("th");
			thCorner.className = "col-gh-label";
			thCorner.textContent = "Greenhouse";
			headerRow.appendChild(thCorner);

			observations.forEach(obs => {
				const th = document.createElement("th");
				th.textContent = obs.name;
				headerRow.appendChild(th);
			});

			thead.appendChild(headerRow);
			table.appendChild(thead);

			// Tbody
			const tbody = document.createElement("tbody");

			greenhouses.forEach(ghData => {
				const ghName = ghData._ghName || "";
				const ghLabel = (ghData._warehouseName || ghName).replace(/ - .+$/, "");

				const tr = document.createElement("tr");

				// Row label — date is this greenhouse's own most-recent scouting day
				const ghDates = perGreenhouseDates[ghName] || [];
				const ghPrimary = ghDates[0] || primaryDate;
				const tdLabel = document.createElement("td");
				tdLabel.className = "td-gh-label";
				tdLabel.innerHTML =
					'<div class="td-gh-date">' + escapeHtml(ghPrimary) + '</div>' +
					'<div class="td-gh-name">' + escapeHtml(ghLabel) + '</div>';
				tr.appendChild(tdLabel);

				// Each observation column with multi-day data
				observations.forEach(obs => {
					const td = document.createElement("td");
					const cardEl = buildMultiDayMiniCard(ghData, ghLabel, obs, ghName);
					if (cardEl) {
						td.appendChild(cardEl);
					} else {
						const empty = document.createElement("div");
						empty.className = "mini-card-empty";
						td.appendChild(empty);
					}
					tr.appendChild(td);
				});

				tbody.appendChild(tr);
			});

			table.appendChild(tbody);
			wrapper.innerHTML = "";
			wrapper.appendChild(table);
		}

		// ── Build multi-day mini card ──
		// Per day we keep a zone-name keyed map → {count, stages:[{stage,count}]}
		// fed straight into buildUprightPlot, which renders the greenhouse
		// floor plan from raw_geojson (same algorithm as the observations_map
		// modal — gray polyline for empty zones, coloured for observed).
		function buildMultiDayMiniCard(ghData, ghLabel, obs, ghName) {
			const bedCount = ghData.bed_count || 0;
			const zoneCount = ghData.zone_count || 0;
			const dayMatrices = {};
			let totalAllDays = 0;
			let maxCountAllDays = 0;
			const stageBreakdown = {};

			// This greenhouse's own last 3 scouting dates (most-recent first)
			const ghDates = perGreenhouseDates[ghName] || [];
			const ghPrimary = ghDates[0];

			ghDates.forEach(date => {
				const dayMap = {};
				const dayData = multiDayData[date] && multiDayData[date][ghName];

				if (dayData) {
					(dayData.scouting_entries || []).forEach(entry => {
						const items = entry[obs.catKey] || [];
						items.forEach(item => {
							if (item.name !== obs.name) return;
							if (!entry.zone) return;

							const cnt = item.count || 1;
							const stage = item.stage || "Present";

							if (!dayMap[entry.zone]) dayMap[entry.zone] = { count: 0, stages: [] };
							dayMap[entry.zone].count += cnt;
							dayMap[entry.zone].stages.push({ stage: stage, count: cnt });

							totalAllDays += cnt;
							maxCountAllDays = Math.max(maxCountAllDays, dayMap[entry.zone].count);

							if (!stageBreakdown[stage]) stageBreakdown[stage] = 0;
							stageBreakdown[stage] += cnt;
						});
					});
				}

				dayMatrices[date] = dayMap;
			});

			if (totalAllDays === 0) return null;

			// Build card
			const card = document.createElement("div");
			card.className = "mini-card mini-card-multi-day";

			card.addEventListener("click", () => {
				openMultiDayModal(
					ghLabel,
					obs.name,
					obs.category,
					obs.color,
					dayMatrices,
					maxCountAllDays,
					totalAllDays,
					stageBreakdown,
					bedCount,
					zoneCount,
					ghData.observation_types,
					ghName,
					ghData.zone_geojson || [],
					stagesMap,
					ghDates,
					ghPrimary
				);
			});

			// Header
			const head = document.createElement("div");
			head.className = "mini-card-head";
			head.innerHTML =
				'<span class="mini-card-gh">' + escapeHtml(ghLabel) + '</span>' +
				'<span class="mini-card-date">' + escapeHtml(ghPrimary || "") + '</span>';
			card.appendChild(head);

			// Observation name
			const obsDiv = document.createElement("div");
			obsDiv.className = "mini-card-obs";
			obsDiv.textContent = obs.name;
			card.appendChild(obsDiv);

			// Floor-plan body — true greenhouse footprint from zone polygons.
			const body = document.createElement("div");
			body.className = "mini-card-body";

			const stagesMeta = (ghData.observation_types &&
				ghData.observation_types[obs.category] &&
				ghData.observation_types[obs.category][obs.name] &&
				ghData.observation_types[obs.category][obs.name].stages) || [];
			const stagesMap = {};
			stagesMeta.forEach(s => { stagesMap[s.stage] = s; });

			const prevSet = {};
			ghDates.filter(d => d !== ghPrimary).forEach(date => {
				Object.keys(dayMatrices[date] || {}).forEach(zoneName => {
					if (!(dayMatrices[ghPrimary] && dayMatrices[ghPrimary][zoneName])) {
						prevSet[zoneName] = true;
					}
				});
			});

			const plot = buildUprightPlot({
				geojson: ghData.zone_geojson || [],
				today: dayMatrices[ghPrimary] || {},
				prev: prevSet,
				maxCount: maxCountAllDays,
				color: obs.color,
				stagesMap: stagesMap,
				large: false,
			});

			const dayIndicator = document.createElement("div");
			dayIndicator.className = "day-indicator";
			ghDates.forEach((date, index) => {
				const hasData = Object.keys(dayMatrices[date] || {}).length > 0;
				const dot = document.createElement("span");
				dot.className = "day-dot";
				dot.style.backgroundColor = hasData ? obs.color : "#e5e7eb";
				dot.title = date + (hasData ? " (data available)" : " (no data)");
				dayIndicator.appendChild(dot);

				if (index < ghDates.length - 1) {
					dayIndicator.appendChild(document.createTextNode(" "));
				}
			});
			body.appendChild(dayIndicator);

			body.appendChild(plot);
			card.appendChild(body);

			return card;
		}

		// ── Upright plot builder (SVG floor-plan) ──
		// Mirrors the observations_map modal: parse each zone's raw_geojson
		// → LineString features (one centerline per bed-segment), project
		// into a rotated frame so beds align, cluster the rings into blocks,
		// draw three layers — faint baseline rail per bed, coloured polyline
		// per zone-segment, bed numbers at each block's left edge. Heatmap
		// drives a single observation, so colour is fixed and intensity
		// scales the polyline's stroke-opacity.
		function _hmParseZoneFeatures(zone) {
			if (zone._features) return zone._features;
			let parsed;
			try { parsed = JSON.parse(zone.raw_geojson); } catch (_) { return null; }
			if (!parsed || !parsed.features || !parsed.features.length) return null;
			zone._features = parsed.features;
			return parsed.features;
		}

		function buildUprightPlot(opts) {
			const geojson = opts.geojson || [];
			const today = opts.today || {};
			const prev = opts.prev || {};
			const maxCount = opts.maxCount || 1;
			const color = opts.color || "#666666";
			const large = !!opts.large;

			// 1. Pull rings + line_ids per zone, gather all points for projection
			const zones = [];
			const allPoints = [];
			for (const z of geojson) {
				const features = _hmParseZoneFeatures(z);
				if (!features) continue;
				const rings = [];
				const lineIds = [];
				for (const f of features) {
					const c = f.geometry && f.geometry.coordinates;
					if (!Array.isArray(c) || !c.length) continue;
					const ring = [];
					for (const p of c) {
						if (typeof p[0] !== 'number' || typeof p[1] !== 'number') continue;
						ring.push([p[0], p[1]]);
						allPoints.push(ring[ring.length - 1]);
					}
					if (ring.length) {
						rings.push(ring);
						lineIds.push((f.properties && f.properties.line_id) ?? null);
					}
				}
				if (rings.length) zones.push({ name: z.name, rings, lineIds });
			}

			if (!allPoints.length) {
				const empty = document.createElement("div");
				empty.className = "upright-empty";
				empty.textContent = "Zone polygons unavailable";
				return empty;
			}

			// 2. Equirectangular projection (latScale ≈ cos(meanLat))
			let sumLat = 0;
			for (const [, lat] of allPoints) sumLat += lat;
			const meanLat = sumLat / allPoints.length;
			const latScale = Math.cos(meanLat * Math.PI / 180);

			// 3. Bed direction: axial mean of line vectors → fall back to PCA.
			let sumCos = 0, sumSin = 0, foundDir = false;
			for (const z of zones) {
				for (const ring of z.rings) {
					if (ring.length < 2) continue;
					const first = ring[0], last = ring[ring.length - 1];
					const dx = (last[0] - first[0]) * latScale;
					const dy = last[1] - first[1];
					const len2 = dx*dx + dy*dy;
					if (len2 < 1e-20) continue;
					const a = Math.atan2(dy, dx);
					const len = Math.sqrt(len2);
					sumCos += Math.cos(2*a) * len;
					sumSin += Math.sin(2*a) * len;
					foundDir = true;
				}
			}
			let bedDir;
			if (foundDir) {
				bedDir = 0.5 * Math.atan2(sumSin, sumCos);
			} else {
				// PCA fallback
				let mx = 0, my = 0;
				for (const [lng, lat] of allPoints) { mx += lng * latScale; my += lat; }
				mx /= allPoints.length; my /= allPoints.length;
				let cxx = 0, cxy = 0, cyy = 0;
				for (const [lng, lat] of allPoints) {
					const dx = lng * latScale - mx, dy = lat - my;
					cxx += dx*dx; cxy += dx*dy; cyy += dy*dy;
				}
				bedDir = 0.5 * Math.atan2(2 * cxy, cxx - cyy);
			}
			const rot = -bedDir;
			const rcos = Math.cos(rot), rsin = Math.sin(rot);

			let cxRaw = 0, cyRaw = 0;
			for (const [lng, lat] of allPoints) { cxRaw += lng * latScale; cyRaw += lat; }
			cxRaw /= allPoints.length; cyRaw /= allPoints.length;
			const project = ([lng, lat]) => {
				const x = lng * latScale - cxRaw;
				const y = lat - cyRaw;
				return [x * rcos - y * rsin, x * rsin + y * rcos];
			};

			let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
			const projected = zones.map(z => {
				const rings = z.rings.map(ring => {
					const out = ring.map(project);
					for (const [x, y] of out) {
						if (x < minX) minX = x; if (x > maxX) maxX = x;
						if (y < minY) minY = y; if (y > maxY) maxY = y;
					}
					return out;
				});
				return { name: z.name, rings, lineIds: z.lineIds };
			});

			const w = maxX - minX, h = maxY - minY;
			if (w === 0 || h === 0) {
				const empty = document.createElement("div");
				empty.className = "upright-empty";
				empty.textContent = "Zone polygons degenerate";
				return empty;
			}

			// 4. Cluster the *raw rings* into horizontal blocks. Doing it on
			// rings (not aggregated beds) keeps blocks honest when bed
			// numbering restarts in each block — a block-1 bed and its
			// block-2 namesake stay in their own clusters instead of getting
			// merged into one entry that spans the whole greenhouse.
			const allRings = [];
			for (const z of projected) {
				for (let i = 0; i < z.rings.length; i++) {
					const lid = z.lineIds[i];
					const ring = z.rings[i];
					if (lid == null || lid === '' || !ring.length) continue;
					let sx = 0, sy = 0, mn = Infinity, mx = -Infinity;
					for (const [x, y] of ring) {
						sx += x; sy += y;
						if (x < mn) mn = x;
						if (x > mx) mx = x;
					}
					allRings.push({
						lid, ring, zoneName: z.name,
						cx: sx / ring.length, cy: sy / ring.length,
						minX: mn, maxX: mx
					});
				}
			}
			const sortedRings = allRings.slice().sort((a, b) => a.cx - b.cx);
			const GAP_THRESHOLD = w * 0.05;
			const blocks = [];
			for (const r of sortedRings) {
				const last = blocks[blocks.length - 1];
				if (!last || r.cx > last.maxX + GAP_THRESHOLD) {
					blocks.push({ rings: [r], minX: r.minX, maxX: r.maxX });
				} else {
					last.rings.push(r);
					if (r.maxX > last.maxX) last.maxX = r.maxX;
					if (r.minX < last.minX) last.minX = r.minX;
				}
			}
			for (const blk of blocks) {
				const bedMap = {};
				for (const r of blk.rings) {
					if (!bedMap[r.lid]) bedMap[r.lid] = { lid: r.lid, pts: [] };
					for (const p of r.ring) bedMap[r.lid].pts.push(p);
				}
				blk.beds = Object.values(bedMap).map(b => {
					let mn = Infinity, mx = -Infinity, sx = 0, sy = 0;
					for (const [x, y] of b.pts) {
						if (x < mn) mn = x;
						if (x > mx) mx = x;
						sx += x; sy += y;
					}
					return {
						lid: b.lid,
						minX: mn, maxX: mx,
						cx: sx / b.pts.length,
						cy: sy / b.pts.length
					};
				});
			}
			const bedMeta = blocks.flatMap(blk => blk.beds);

			// 5. Layout dimensions
			const PAD = large ? 12 : 4;
			const LABEL_MARGIN = large ? 26 : 14;
			const padLeft = LABEL_MARGIN;
			const padRight = PAD;
			const TARGET_W = large ? 880 : 280;
			const TARGET_H = large ? 540 : 200;
			const scale = Math.min((TARGET_W - padLeft - padRight) / w, (TARGET_H - 2*PAD) / h);
			const svgW = w * scale + padLeft + padRight;
			const svgH = h * scale + 2*PAD;
			const toSvg = ([x, y]) => [
				padLeft + (x - minX) * scale,
				PAD + (maxY - y) * scale
			];

			// 6. Bed thickness from cluster count on the perpendicular axis
			const countClusters = (vals, tol) => {
				if (!vals.length) return 1;
				const s = vals.slice().sort((a, b) => a - b);
				let n = 1;
				for (let i = 1; i < s.length; i++) if (s[i] - s[i-1] > tol) n++;
				return n;
			};
			const yClusters = countClusters(bedMeta.map(b => b.cy), h * 0.02);
			const xClusters = countClusters(bedMeta.map(b => b.cx), w * 0.02);
			const stackExtent = ((yClusters >= xClusters) ? h : w) * scale;
			const stackedBeds = Math.max(1, Math.max(yClusters, xClusters));
			const bedSpacing = stackExtent / stackedBeds;
			const bedThickness = large
				? Math.max(2, Math.min(6, bedSpacing * 0.4))
				: Math.max(1, Math.min(3, bedSpacing * 0.35));

			// 7. Build SVG
			const SVG_NS = "http://www.w3.org/2000/svg";
			const svg = document.createElementNS(SVG_NS, "svg");
			svg.setAttribute("viewBox", `0 0 ${svgW.toFixed(2)} ${svgH.toFixed(2)}`);
			svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
			svg.setAttribute("class", "upright-svg" + (large ? " upright-svg-lg" : ""));

			// Layer 1 — baselines (faint rail per bed, capped to its block)
			for (const blk of blocks) {
				for (const bed of blk.beds) {
					const [x0, y0] = toSvg([blk.maxX, bed.cy]);
					const [x1, y1] = toSvg([blk.minX, bed.cy]);
					const ln = document.createElementNS(SVG_NS, "line");
					ln.setAttribute("class", "gh-bed-baseline");
					ln.setAttribute("x1", x0.toFixed(2));
					ln.setAttribute("y1", y0.toFixed(2));
					ln.setAttribute("x2", x1.toFixed(2));
					ln.setAttribute("y2", y1.toFixed(2));
					svg.appendChild(ln);
				}
			}

			// Layer 2 — coloured zone polylines (one per ring per zone).
			// Mirrors observations_map: every zone is drawn so the greenhouse
			// silhouette is always visible. Today → full colour, prior-day →
			// dashed colour, empty → faint gray rail.
			const EMPTY_STROKE = "#cbd5e1";
			for (const z of projected) {
				const obs = today[z.name];
				const cnt = obs ? obs.count : 0;
				const isPrev = !obs && prev[z.name];

				let strokeColor, opacity, dashArray;
				if (cnt > 0) {
					const ratio = Math.min(1, cnt / Math.max(maxCount, 1));
					strokeColor = color;
					opacity = 0.7 + ratio * 0.3;
					dashArray = null;
				} else if (isPrev) {
					strokeColor = color;
					opacity = 0.32;
					dashArray = (bedThickness * 1.2).toFixed(1) + "," + (bedThickness * 0.9).toFixed(1);
				} else {
					strokeColor = EMPTY_STROKE;
					opacity = 0.55;
					dashArray = null;
				}

				let titleSuffix = "";
				if (cnt > 0) {
					titleSuffix = " · " + cnt + (
						obs.stages && obs.stages.length
							? " · " + obs.stages.map(s => s.stage + "(" + s.count + ")").join(", ")
							: ""
					);
				} else if (isPrev) {
					titleSuffix = " · prior-day data";
				}

				for (const ring of z.rings) {
					if (ring.length < 2) continue;
					const pts = ring.map(p => toSvg(p).join(',')).join(' ');
					const pl = document.createElementNS(SVG_NS, "polyline");
					pl.setAttribute("class", "gh-zone");
					pl.setAttribute("points", pts);
					pl.setAttribute("stroke", strokeColor);
					pl.setAttribute("stroke-width", bedThickness.toFixed(2));
					pl.setAttribute("stroke-opacity", opacity.toFixed(2));
					if (dashArray) pl.setAttribute("stroke-dasharray", dashArray);
					const title = document.createElementNS(SVG_NS, "title");
					title.textContent = z.name + titleSuffix;
					pl.appendChild(title);
					svg.appendChild(pl);
				}
			}

			// Layer 3 — bed labels at each block's left edge
			for (const blk of blocks) {
				for (const bed of blk.beds) {
					const [ix, iy] = toSvg([blk.minX, bed.cy]);
					const t = document.createElementNS(SVG_NS, "text");
					t.setAttribute("class", "gh-bed-label");
					t.setAttribute("x", (ix - 3).toFixed(2));
					t.setAttribute("y", iy.toFixed(2));
					t.setAttribute("text-anchor", "end");
					t.textContent = bed.lid;
					svg.appendChild(t);
				}
			}

			return svg;
		}

		// ── Open multi-day modal ──
		function openMultiDayModal(ghLabel, observationName, observationType, color, dayMatrices, maxCount, total, stageBreakdown, bedCount, zoneCount, obsTypes, ghName, geojson, stagesMap, dates, primaryForGh) {
			const modalBody = document.getElementById("modal-body");
			modalBody.innerHTML = "";

			const metadata = obsTypes && obsTypes[observationType] && obsTypes[observationType][observationName];
			const stagesMapResolved = stagesMap || (function () {
				const m = {};
				if (metadata && metadata.stages) metadata.stages.forEach(s => { m[s.stage] = s; });
				return m;
			})();

			// Header
			const header = document.createElement("div");
			header.style.marginBottom = "20px";
			header.innerHTML =
				'<h2 style="font-size:24px;font-weight:700;color:' + color + ';margin-bottom:8px;">' +
				escapeHtml(observationName) + '</h2>' +
				'<p style="font-size:14px;color:var(--hm-muted);">' +
				escapeHtml(ghLabel) + ' &nbsp;·&nbsp; 3-day view &nbsp;·&nbsp; Total: ' + total + '</p>';
			modalBody.appendChild(header);

			// Stage breakdown — symbol chip + count
			if (metadata && metadata.stages && metadata.stages.length > 0) {
				const stageLegendDiv = document.createElement("div");
				stageLegendDiv.className = "stage-legend";

				const title = document.createElement("div");
				title.style.fontWeight = "700";
				title.style.fontSize = "11px";
				title.style.textTransform = "uppercase";
				title.style.letterSpacing = ".9px";
				title.style.color = "var(--hm-quiet)";
				title.style.marginBottom = "10px";
				title.style.width = "100%";
				title.textContent = "Stages on this card";
				stageLegendDiv.appendChild(title);

				metadata.stages.forEach(stage => {
					const stageItem = document.createElement("div");
					stageItem.className = "stage-item";
					const stageCount = stageBreakdown[stage.stage] || 0;
					const glyph = stage.symbol || (stage.stage ? stage.stage[0].toUpperCase() : "•");
					stageItem.innerHTML =
						'<span class="stage-glyph-chip" style="background:' + color + ';">' +
						escapeHtml(glyph) + '</span>' +
						'<span>' + escapeHtml(stage.stage) + '</span>' +
						'<span style="font-size:11px;color:var(--hm-quiet);">(' + stageCount + ')</span>';
					stageLegendDiv.appendChild(stageItem);
				});
				modalBody.appendChild(stageLegendDiv);
			}

			// Per-day upright plots
			const multiDayContainer = document.createElement("div");
			multiDayContainer.className = "multi-day-grids";

			const allZoneNames = new Set();
			Object.values(dayMatrices).forEach(m => Object.keys(m || {}).forEach(z => allZoneNames.add(z)));

			const modalDates = (dates && dates.length) ? dates : availableDates;
			const modalPrimary = primaryForGh || (modalDates[0] || primaryDate);
			modalDates.forEach(date => {
				const daySection = document.createElement("div");
				daySection.className = "day-section";

				const dayHeader = document.createElement("h4");
				dayHeader.textContent = date + (date === modalPrimary ? " (latest)" : "");
				daySection.appendChild(dayHeader);

				const dayMap = dayMatrices[date] || {};
				const prevSet = {};
				allZoneNames.forEach(z => { if (!dayMap[z]) prevSet[z] = true; });

				const plot = buildUprightPlot({
					geojson: geojson || [],
					today: dayMap,
					prev: prevSet,
					maxCount: maxCount || 1,
					color: color,
					stagesMap: stagesMapResolved,
					large: true,
				});

				const container = document.createElement("div");
				container.className = "heatmap-container";
				container.appendChild(plot);
				daySection.appendChild(container);

				multiDayContainer.appendChild(daySection);
			});

			modalBody.appendChild(multiDayContainer);

			// Intensity legend
			const legend = document.createElement("div");
			legend.className = "legend";
			legend.style.marginTop = "20px";
			legend.innerHTML =
				'<div class="legend-item"><div class="legend-box" style="background:' + color + ';opacity:.3;"></div><span>Low</span></div>' +
				'<div class="legend-item"><div class="legend-box" style="background:' + color + ';opacity:.6;"></div><span>Medium</span></div>' +
				'<div class="legend-item"><div class="legend-box" style="background:' + color + ';opacity:.95;"></div><span>High</span></div>' +
				'<div class="legend-item"><div class="legend-box" style="background:' + color + ';opacity:.1;border-style:dashed;"></div><span>Prior days</span></div>' +
				'<div style="margin-left:auto;font-weight:700;">Max: ' + maxCount + '</div>';
			modalBody.appendChild(legend);

			document.getElementById("heatmap-modal").classList.remove("hidden");
		}


		// ── Modal management ──
		const modal = document.getElementById("heatmap-modal");
		const modalBody = document.getElementById("modal-body");

		document.getElementById("modal-close").addEventListener("click", () => {
			modal.classList.add("hidden");
		});
		modal.addEventListener("click", (e) => {
			if (e.target === modal) modal.classList.add("hidden");
		});

		// ── Date change ──
		document.getElementById("scout-date-picker").addEventListener("change", (e) => {
			currentDate = e.target.value;
			abortAllRequests();
			loadMultiDayData();
		});

		// ── Empty state ──
		function showEmptyState() {
			const wrapper = document.getElementById("all-gh-table-wrapper");
			wrapper.innerHTML = `
				<div class="empty-state">
					<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
					</svg>
					<p style="font-weight: 600; margin-bottom: 8px;">No Data Available</p>
					<p>No scouted zones found for this date.</p>
				</div>
			`;
		}

		// ── Escape HTML ──
		function escapeHtml(str) {
			if (!str) return "";
			const div = document.createElement("div");
			div.textContent = str;
			return div.innerHTML;
		}

		// ── Init ──
		document.addEventListener("DOMContentLoaded", () => {
			bindDropdowns();
			initialize();
		});
	</script>
</div>
{% endblock %}
