{% extends "upande_scp/www/map_base.html" %} 

{% block head %}
<style>
	#dashboard-page {
		height: 100vh;
		width: 100%;
		display: flex;
		position: relative;
		overflow: hidden;
	}

	#content-container {
		flex: 1;
		position: relative;
		z-index: 1;
		overflow: auto;
		padding: 60px 12px 12px;
	}

	/* Farm filter pills inside top floating bar */
	.gh-filter-tabs {
		display: flex;
		flex-wrap: nowrap;
		gap: 4px;
		max-width: 360px;
		max-height: 32px;
		overflow-x: auto;
		overflow-y: hidden;
		scrollbar-width: thin;
	}
	.gh-filter-tabs::-webkit-scrollbar { height: 4px; }
	.gh-filter-tabs::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

	.gh-btn,
	.farm-btn,
	.pest-btn {
		padding: 4px 10px;
		border: 1px solid #e5e7eb;
		background: #ffffff;
		color: #374151;
		font-size: 0.72rem;
		font-weight: 500;
		border-radius: 6px;
		cursor: pointer;
		text-align: left;
		white-space: nowrap;
	}
	.gh-btn.active,
	.farm-btn.active,
	.pest-btn.active {
		background: #4b5563;
		border-color: #4b5563;
		color: #ffffff;
	}

	input.gh-btn {
		padding: 0 8px;
		height: 30px;
		font-weight: 400;
		min-width: 130px;
	}

	/* New filter styles */
	.filter-row {
		display: flex;
		gap: 12px;
		align-items: center;
		flex-wrap: wrap;
		margin-bottom: 16px;
		padding: 8px 0;
	}

	.filter-label {
		font-size: 0.72rem;
		font-weight: 600;
		color: #6b7280;
		text-transform: uppercase;
		letter-spacing: 0.05em;
	}

	.filter-group {
		display: flex;
		align-items: center;
		gap: 8px;
	}

	.gh-select {
		padding: 6px 12px;
		border: 1px solid #e5e7eb;
		border-radius: 6px;
		background: #ffffff;
		color: #374151;
		font-size: 0.75rem;
		min-width: 200px;
		cursor: pointer;
	}

	.pest-filter-tabs {
		display: flex;
		flex-wrap: wrap;
		gap: 4px;
		max-height: 60px;
		overflow-y: auto;
		scrollbar-width: thin;
	}
	.pest-filter-tabs::-webkit-scrollbar { width: 4px; }
	.pest-filter-tabs::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

	.multi-day-indicator {
		font-size: 0.7rem;
		color: #6b7280;
		margin-left: 8px;
		font-weight: 400;
	}

	/* --- All-Greenhouses Table Layout --- */
	.all-gh-table-wrapper {
		overflow-x: auto;
		overflow-y: auto;
		height: 100%;
	}

	.all-gh-table {
		border-collapse: collapse;
		width: max-content;
		min-width: 100%;
	}

	.all-gh-table thead th {
		position: sticky;
		top: 0;
		z-index: 20;
		background: var(--panel-bg);
		padding: 10px 14px;
		font-size: 13px;
		font-weight: 600;
		color: var(--text);
		text-align: center;
		border-bottom: 2px solid var(--border);
		white-space: nowrap;
	}

	.all-gh-table thead th.col-gh-label {
		text-align: left;
		position: sticky;
		left: 0;
		z-index: 30;
		background: var(--panel-bg);
		min-width: 100px;
		padding-left: 12px;
	}

	.all-gh-table tbody td {
		vertical-align: top;
		padding: 6px 4px;
		border-bottom: 1px solid #f0f0f0;
	}

	.all-gh-table tbody td.td-gh-label {
		position: sticky;
		left: 0;
		z-index: 10;
		background: var(--panel-bg);
		padding: 10px 14px 10px 12px;
		white-space: nowrap;
		border-right: 1px solid #e5e7eb;
	}

	.td-gh-date {
		font-size: 12px;
		color: var(--text-muted);
		line-height: 1.2;
	}

	.td-gh-name {
		font-size: 14px;
		font-weight: 700;
		color: var(--text);
		line-height: 1.4;
	}

	/* --- Mini Heatmap Card inside table cell --- */
	.mini-card {
		display: inline-block;
		border: 1px solid var(--border);
		border-radius: var(--radius-input);
		background: var(--panel-bg);
		min-width: 140px;
		cursor: pointer;
		vertical-align: top;
		overflow: hidden;
	}
	.mini-card-head {
		display: flex;
		justify-content: space-between;
		align-items: baseline;
		padding: 4px 6px 3px;
		border-bottom: 1px solid var(--border);
		background: var(--bg);
	}

	.mini-card-gh {
		font-size: 9px;
		font-weight: 600;
		color: var(--text);
		max-width: 80px;
		overflow: hidden;
		text-overflow: ellipsis;
		white-space: nowrap;
	}

	.mini-card-date {
		font-size: 8px;
		color: var(--text-muted);
	}

	.mini-card-obs {
		padding: 2px 6px 1px;
		font-size: 9px;
		font-weight: 700;
		color: var(--text);
	}

	.mini-card-body {
		padding: 2px 4px 4px;
	}

	/* --- Mini grid inside card --- */
	.mini-grid {
		display: grid;
		gap: 1px;
	}

	.mini-grid .mg-cell {
		height: 7px;
		font-size: 0;
	}

	.mini-grid .mg-zone-hdr {
		background: transparent;
		height: 8px;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 6px;
		color: var(--gray-400, #9ca3af);
	}

	.mini-grid .mg-bed-lbl {
		background: transparent;
		height: 7px;
		display: flex;
		align-items: center;
		justify-content: flex-end;
		padding-right: 2px;
		font-size: 6px;
		color: var(--gray-400, #9ca3af);
	}

	.mini-grid .mg-data {
		height: 7px;
		border-radius: 1px;
		border: 1px solid rgba(0, 0, 0, 0.12);
	}

	.mini-grid .mg-data.mg-empty {
		background: transparent;
		border: 0.5px solid var(--border);
	}

	.mini-grid .mg-corner {
		height: 8px;
	}

	/* Multi-day indicator in mini card */
	.mini-card-multi-day {
		position: relative;
	}

	.mini-card-multi-day::after {
		content: "3D";
		position: absolute;
		top: 2px;
		right: 2px;
		font-size: 6px;
		background: #3b82f6;
		color: white;
		padding: 1px 3px;
		border-radius: 2px;
		font-weight: 700;
	}

	/* Empty table cell placeholder */
	.mini-card-empty {
		display: inline-block;
		min-width: 140px;
		min-height: 20px;
	}

	/* --- Intensity classes --- */
	.intensity-0 {
		opacity: 1;
		background: var(--border) !important;
		cursor: default;
	}

	.intensity-1 { opacity: 0.2; }
	.intensity-2 { opacity: 0.4; }
	.intensity-3 { opacity: 0.6; }
	.intensity-4 { opacity: 0.8; }
	.intensity-5 { opacity: 1; }

	/* Multi-day overlay styles */
	.multi-day-overlay {
		display: grid;
		grid-template-columns: 1fr;
		gap: 0;
	}

	.day-indicator {
		display: flex;
		gap: 4px;
		align-items: center;
		margin-top: 4px;
		padding: 2px 4px;
		background: #f9fafb;
		border-radius: 3px;
		font-size: 7px;
		color: #6b7280;
	}

	.day-dot {
		width: 6px;
		height: 6px;
		border-radius: 50%;
		display: inline-block;
	}

	/* --- Modal --- */
	.modal {
		position: fixed;
		inset: 0;
		background: rgba(0, 0, 0, 0.8);
		display: flex;
		align-items: center;
		justify-content: center;
		z-index: 9999;
	}

	.modal.hidden { display: none; }

	.modal-content {
		background: var(--panel-bg);
		border-radius: var(--radius-card);
		border: 1px solid var(--border);
		max-width: 90vw;
		max-height: 90vh;
		width: 1200px;
		overflow: auto;
		padding: 30px;
		position: relative;
	}

	.modal-close {
		position: absolute;
		top: 15px;
		right: 20px;
		font-size: 32px;
		color: var(--text-muted);
		background: none;
		border: none;
		cursor: pointer;
		line-height: 1;
		padding: 0;
		width: 32px;
		height: 32px;
		display: flex;
		align-items: center;
		justify-content: center;
	}

	/* --- Full-size heatmap grid --- */
	.heatmap-container {
		padding: 10px;
		border: 1px solid var(--border);
		border-radius: var(--radius-card);
		background: var(--panel-bg);
		overflow: hidden;
	}

	.heatmap-grid {
		display: grid;
		gap: 1px;
	}

	.grid-cell {
		display: flex;
		align-items: center;
		justify-content: center;
		height: 20px;
		font-size: 10px;
		font-weight: 500;
		color: #fff;
		border: 1px solid rgba(0, 0, 0, 0.12);
	}

	.zone-header-cell,
	.bed-label-cell {
		background: var(--sidebar-bg);
		color: var(--text);
		font-weight: 600;
		font-size: 10px;
		padding: 2px 5px;
		border-radius: var(--radius-input);
	}

	.bed-label-cell {
		justify-content: flex-end;
		height: 20px;
	}

	.zone-header-cell {
		justify-content: center;
		height: 20px;
	}

	.data-cell {
		height: 20px;
		border-radius: 2px;
		cursor: pointer;
		position: relative;
	}

	.legend {
		display: flex;
		align-items: center;
		gap: 8px;
		margin-top: 10px;
		padding-top: 10px;
		border-top: 1px solid var(--border);
		font-size: 11px;
		flex-wrap: wrap;
	}

	.legend-item {
		display: flex;
		align-items: center;
		gap: 5px;
	}

	.legend-box {
		width: 15px;
		height: 10px;
		border-radius: 2px;
		border: 1px solid var(--border);
	}

	.stage-legend {
		display: flex;
		gap: 5px;
		flex-wrap: wrap;
		margin-top: 5px;
		padding: 5px;
		background: var(--panel-bg);
		border-radius: var(--radius-card);
		border: 1px solid var(--border);
	}

	.stage-item {
		display: flex;
		align-items: center;
		gap: 5px;
		font-size: 11px;
		padding: 2px 6px;
		background: var(--panel-bg);
		border-radius: var(--radius-input);
		border: 1px solid var(--border);
	}

	/* Multi-day comparison in modal */
	.multi-day-grids {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
		gap: 16px;
		margin-top: 16px;
	}

	.day-section {
		border: 1px solid #e5e7eb;
		border-radius: 8px;
		padding: 12px;
		background: #f9fafb;
	}

	.day-section h4 {
		margin: 0 0 8px 0;
		font-size: 14px;
		color: #374151;
	}

	/* --- Loader --- */
	#map-loader {
		position: absolute; inset: 0;
		background: rgba(255,255,255,0.93);
		display: flex; flex-direction: column;
		align-items: center; justify-content: center;
		z-index: 2000; gap: 0.5rem;
	}
	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #2563eb; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }

	.empty-state {
		text-align: center;
		padding: 60px 20px;
		color: var(--text-muted);
	}

	.empty-state svg {
		width: 64px;
		height: 64px;
		margin: 0 auto 16px;
		opacity: 0.5;
	}
</style>
{% endblock %} 

{% block page_content %}
<div>
	<div id="dashboard-page">
		<div id="content-container" style="position:relative">
			<div id="map-loader" style="display:none">
				<span class="map-load-title">Loading heatmap data</span>
				<div class="map-load-track"><div class="map-load-fill" id="map-load-fill"></div></div>
				<span class="map-load-status" id="map-load-status">0%</span>
			</div>
			
			<!-- New filters section -->
			<div class="filter-row">
				<div class="filter-group">
					<span class="filter-label">Greenhouse:</span>
					<select id="greenhouse-select" class="gh-select">
						<option value="__all__">All Greenhouses</option>
					</select>
				</div>
				<div class="filter-group">
					<span class="filter-label">Pests:</span>
					<div class="pest-filter-tabs" id="pest-filter"></div>
				</div>
			</div>

			<div class="all-gh-table-wrapper" id="all-gh-table-wrapper">
				<!-- Table rendered here -->
			</div>
		</div>

		<!-- Floating filter bar (top) -->
		<div class="scout-filters">
			<div class="scout-filter-item">
				<label for="scout-date-picker">Date</label>
				<input type="date" id="scout-date-picker" />
			</div>
			<div class="scout-filter-item" style="flex:1; min-width:0">
				<label>Farm</label>
				<div class="gh-filter-tabs" id="farm-filter"></div>
			</div>
		</div>

		<!-- Floating summary (bottom-right) -->
		<div class="scout-summary">
			<div class="panel-title">Today's Summary</div>
			<div class="scout-summary-grid">
				<div class="scout-stat">
					<div class="scout-stat-label">Greenhouses</div>
					<div class="scout-stat-value" id="hm-stat-gh">—</div>
				</div>
				<div class="scout-stat">
					<div class="scout-stat-label">Observations</div>
					<div class="scout-stat-value" id="hm-stat-obs">—</div>
				</div>
				<div class="scout-stat">
					<div class="scout-stat-label">Beds</div>
					<div class="scout-stat-value" id="hm-stat-beds">—</div>
				</div>
				<div class="scout-stat">
					<div class="scout-stat-label">Farms</div>
					<div class="scout-stat-value" id="hm-stat-farms">—</div>
				</div>
			</div>
		</div>
	</div>

	<div id="heatmap-modal" class="modal hidden">
		<div class="modal-content">
			<button class="modal-close" id="modal-close">&times;</button>
			<div id="modal-body"></div>
		</div>
	</div>

	<script>
		// ── State ──
		let farmsData = [];
		let greenhouseMap = {};
		let allGreenhouseResults = {};
		const localDateISO = (d = new Date()) => {
			const y = d.getFullYear();
			const m = String(d.getMonth() + 1).padStart(2, "0");
			const day = String(d.getDate()).padStart(2, "0");
			return `${y}-${m}-${day}`;
		};
		let currentDate = localDateISO();
		let currentFarmFilter = "__all__";
		let currentGHFilter = "__all__";
		let currentPestFilter = "__all__";
		
		// Multi-day data storage (3 days)
		let multiDayData = {}; // { 'YYYY-MM-DD': { greenhouseName: data } }
		let availableDates = [];

		// ── Abort + cache ──
		const dateCache = new Map();
		let activeAbortControllers = [];

		const abortAllRequests = () => {
			activeAbortControllers.forEach(ctrl => { try { ctrl.abort(); } catch (_) {} });
			activeAbortControllers = [];
		};

		const CATEGORIES = [
			{ key: "pests_scouting_entry", type: "pests" },
			{ key: "diseases_scouting_entry", type: "diseases" },
			{ key: "predators_scouting_entry", type: "predators" },
			{ key: "weeds_scouting_entry", type: "weeds" },
			{ key: "incidents_scouting_entry", type: "incidents" },
			{ key: "physiological_disorders_entry", type: "physiological_disorders" },
		];

		function setProgress(pct) {
			const fill = document.getElementById("map-load-fill");
			const status = document.getElementById("map-load-status");
			if (fill) fill.style.width = Math.min(100, pct) + "%";
			if (status) status.textContent = Math.round(Math.min(100, pct)) + "%";
		}

		function showLoader() {
			setProgress(0);
			document.getElementById("map-loader").style.display = "flex";
		}

		function hideLoader() {
			document.getElementById("map-loader").style.display = "none";
		}

		// ── Calculate date range (current date and 2 days before) ──
		function getDateRange() {
			const dates = [];
			const today = new Date(currentDate + "T00:00:00");
			for (let i = 0; i < 3; i++) {
				const d = new Date(today);
				d.setDate(d.getDate() - i);
				dates.push(localDateISO(d));
			}
			return dates;
		}

		// ── Fetch farms ──
		function initialize() {
			showLoader();
			document.getElementById("scout-date-picker").value = currentDate;
			availableDates = getDateRange();

			fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getFarmsAndGreenhouses", {
				method: "POST",
				headers: {
					"Content-Type": "application/json",
					"X-Frappe-CSRF-Token": "{{ csrf_token }}",
				},
			})
				.then((r) => r.json())
				.then((response) => {
					farmsData = response.message.farms || [];

					farmsData.forEach((farm) => {
						(farm.greenhouses || []).forEach((gh) => {
							greenhouseMap[gh.name] = {
								farmName: farm.name,
								warehouse_name: gh.warehouse_name,
							};
						});
					});

					setupFarmFilter();
					setupGreenhouseFilter();
					loadMultiDayData();
				})
				.catch((err) => {
					console.error("Error fetching farms:", err);
					hideLoader();
					showEmptyState();
				});
		}

		// ── Setup greenhouse dropdown filter ──
		function setupGreenhouseFilter() {
			const select = document.getElementById("greenhouse-select");
			
			// Clear existing options except "All"
			while (select.options.length > 1) {
				select.remove(1);
			}

			// Add greenhouse options sorted by name
			const greenhouses = Object.keys(greenhouseMap).sort();
			greenhouses.forEach(ghName => {
				const option = document.createElement("option");
				option.value = ghName;
				option.textContent = (greenhouseMap[ghName].warehouse_name || ghName).replace(/ - .+$/, "");
				select.appendChild(option);
			});

			select.addEventListener("change", (e) => {
				currentGHFilter = e.target.value;
				renderAllGreenhousesTable();
			});
		}

		// ── Setup pest filter tabs ──
		function setupPestFilter(pestList) {
			const filterContainer = document.getElementById("pest-filter");
			filterContainer.innerHTML = "";

			// All Pests button
			const allBtn = document.createElement("button");
			allBtn.className = "pest-btn" + (currentPestFilter === "__all__" ? " active" : "");
			allBtn.textContent = "All Pests";
			allBtn.addEventListener("click", () => {
				document.querySelectorAll(".pest-btn").forEach(btn => btn.classList.remove("active"));
				allBtn.classList.add("active");
				currentPestFilter = "__all__";
				renderAllGreenhousesTable();
			});
			filterContainer.appendChild(allBtn);

			// Individual pest buttons
			pestList.forEach(pest => {
				const button = document.createElement("button");
				button.className = "pest-btn" + (pest.name === currentPestFilter ? " active" : "");
				button.textContent = pest.name;
				button.style.color = pest.color;
				button.style.borderColor = pest.color;

				button.addEventListener("click", () => {
					document.querySelectorAll(".pest-btn").forEach(btn => btn.classList.remove("active"));
					button.classList.add("active");
					currentPestFilter = pest.name;
					renderAllGreenhousesTable();
				});

				filterContainer.appendChild(button);
			});
		}

		// ── Load data for multiple days ──
		function loadMultiDayData() {
			const dates = getDateRange();
			availableDates = dates;
			let loadedDates = 0;
			
			abortAllRequests();
			showLoader();
			multiDayData = {};
			setProgress(0);

			const loadPromises = dates.map((date, index) => {
				return loadSingleDayData(date).then(data => {
					multiDayData[date] = data;
					loadedDates++;
					setProgress((loadedDates / dates.length) * 100);
				});
			});

			Promise.all(loadPromises)
				.then(() => {
					// Collect all unique pests across all days
					const allPests = collectAllPests();
					setupPestFilter(allPests);
					
					// Set current day's data as primary
					allGreenhouseResults = multiDayData[currentDate] || {};
					dateCache.set(currentDate, allGreenhouseResults);
					
					setProgress(100);
					setTimeout(hideLoader, 350);
					renderAllGreenhousesTable();
				})
				.catch(err => {
					if (err.name === "AbortError") return;
					console.error("Error loading multi-day data:", err);
					hideLoader();
					showEmptyState();
				});
		}

		// ── Load data for a single day ──
		function loadSingleDayData(date) {
			return new Promise((resolve, reject) => {
				const dayResults = {};
				
				const dayCtrl = new AbortController();
				activeAbortControllers.push(dayCtrl);

				fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getAllScoutedGreenhouses", {
					method: "POST",
					headers: {
						"Content-Type": "application/json",
						"X-Frappe-CSRF-Token": "{{ csrf_token }}",
					},
					body: JSON.stringify({ date: date }),
					signal: dayCtrl.signal,
				})
				.then(r => r.json())
				.then(response => {
					const scoutedList = (response.message && response.message.greenhouses) || [];
					
					if (scoutedList.length === 0) {
						resolve(dayResults);
						return;
					}

					let completed = 0;
					const total = scoutedList.length;

					scoutedList.forEach(ghName => {
						const ghCtrl = new AbortController();
						activeAbortControllers.push(ghCtrl);

						fetch("/api/method/upande_scp.serverscripts.get_heatmap_data.getHeatmapData", {
							method: "POST",
							headers: {
								"Content-Type": "application/json",
								"X-Frappe-CSRF-Token": "{{ csrf_token }}",
							},
							body: JSON.stringify({ date: date, greenhouse: ghName }),
							signal: ghCtrl.signal,
						})
						.then(r => r.ok ? r.json() : Promise.reject(r))
						.then(response => {
							const data = response.message;
							if (data && data.scouting_entries && data.scouting_entries.length > 0) {
								const info = greenhouseMap[ghName] || {};
								data._farmName = info.farmName || "";
								data._warehouseName = info.warehouse_name || ghName;
								data._ghName = ghName;
								dayResults[ghName] = data;
							}
						})
						.catch(err => {
							if (err.name === "AbortError") return;
							console.error("Error fetching " + ghName + ":", err);
						})
						.finally(() => {
							completed++;
							if (completed >= total) {
								resolve(dayResults);
							}
						});
					});
				})
				.catch(err => {
					if (err.name === "AbortError") {
						resolve(dayResults);
					} else {
						reject(err);
					}
				});
			});
		}

		// ── Collect all unique pests across all days ──
		function collectAllPests() {
			const pestMap = {};
			
			Object.values(multiDayData).forEach(dayData => {
				Object.values(dayData).forEach(ghData => {
					(ghData.scouting_entries || []).forEach(entry => {
						CATEGORIES.forEach(cat => {
							const items = entry[cat.key] || [];
							items.forEach(item => {
								if (!pestMap[item.name]) {
									let color = "#999999";
									const typeData = ghData.observation_types && ghData.observation_types[cat.type];
									if (typeData && typeData[item.name]) {
										color = typeData[item.name].color || color;
									}
									pestMap[item.name] = {
										name: item.name,
										category: cat.type,
										catKey: cat.key,
										color: color,
									};
								}
							});
						});
					});
				});
			});

			return Object.values(pestMap).sort((a, b) => a.name.localeCompare(b.name));
		}

		// ── Update summary with filtered data ──
		function updateHeatmapSummary(greenhouses) {
			const farms = new Set();
			let obsTotal = 0;
			let bedsTotal = 0;
			
			greenhouses.forEach(g => {
				if (g._farmName) farms.add(g._farmName);
				(g.scouting_entries || []).forEach(entry => {
					CATEGORIES.forEach(cat => {
						const items = entry[cat.key] || [];
						items.forEach(it => { obsTotal += +(it.count || it.bed_count || 1) || 1; });
					});
				});
				bedsTotal += (g.beds_with_obs || g.bed_count || 0);
			});
			
			const set = (id, val) => {
				const el = document.getElementById(id);
				if (el) el.textContent = String(val);
			};
			set("hm-stat-gh", greenhouses.length);
			set("hm-stat-obs", obsTotal);
			set("hm-stat-beds", bedsTotal);
			set("hm-stat-farms", farms.size);
		}

		// ── Build multi-day mini card ──
		function buildMultiDayMiniCard(ghData, ghLabel, obs, bedCount, zoneCount, activeBeds, activeZones, ghName) {
			// Build matrix for each day
			const dayMatrices = {};
			let totalAllDays = 0;
			let maxCountAllDays = 0;
			const stageBreakdown = {};

			availableDates.forEach(date => {
				const dayMatrix = {};
				const dayData = multiDayData[date] && multiDayData[date][ghName];
				
				if (dayData) {
					(dayData.scouting_entries || []).forEach(entry => {
						const items = entry[obs.catKey] || [];
						items.forEach(item => {
							if (item.name !== obs.name) return;
							const parsed = parseZone(entry.zone);
							if (!parsed) return;

							const bed = parsed.bed;
							const zone = parsed.zone;
							const cnt = item.count || 1;

							if (!dayMatrix[bed]) dayMatrix[bed] = {};
							if (!dayMatrix[bed][zone]) dayMatrix[bed][zone] = 0;
							dayMatrix[bed][zone] += cnt;

							totalAllDays += cnt;
							maxCountAllDays = Math.max(maxCountAllDays, dayMatrix[bed][zone] || 0);

							const stage = item.stage || "Present";
							if (!stageBreakdown[stage]) stageBreakdown[stage] = 0;
							stageBreakdown[stage] += cnt;
						});
					});
				}
				
				dayMatrices[date] = dayMatrix;
			});

			if (totalAllDays === 0) return null;

			// Build card
			const card = document.createElement("div");
			card.className = "mini-card mini-card-multi-day";

			card.addEventListener("click", () => {
				openMultiDayModal(
					ghLabel,
					obs.name,
					obs.category,
					obs.color,
					dayMatrices,
					maxCountAllDays,
					totalAllDays,
					stageBreakdown,
					bedCount,
					zoneCount,
					ghData.observation_types,
					ghName
				);
			});

			// Header
			const head = document.createElement("div");
			head.className = "mini-card-head";
			head.innerHTML = 
				'<span class="mini-card-gh">' + escapeHtml(ghLabel) + '</span>' +
				'<span class="mini-card-date">' + escapeHtml(currentDate) + '</span>';
			card.appendChild(head);

			// Observation name
			const obsDiv = document.createElement("div");
			obsDiv.className = "mini-card-obs";
			obsDiv.textContent = obs.name;
			card.appendChild(obsDiv);

			// Mini grid body - show current day's data as primary
			const body = document.createElement("div");
			body.className = "mini-card-body";

			const grid = document.createElement("div");
			grid.className = "mini-grid";
			grid.style.gridTemplateColumns = "22px repeat(" + activeZones.length + ", 1fr)";

			// Corner
			const corner = document.createElement("div");
			corner.className = "mg-corner";
			grid.appendChild(corner);

			// Zone headers
			activeZones.forEach(z => {
				const zh = document.createElement("div");
				zh.className = "mg-zone-hdr";
				zh.textContent = z;
				grid.appendChild(zh);
			});

			// Bed rows
			activeBeds.forEach(bed => {
				const bedLbl = document.createElement("div");
				bedLbl.className = "mg-bed-lbl";
				bedLbl.textContent = bed;
				grid.appendChild(bedLbl);

				activeZones.forEach(zone => {
					const cnt = (dayMatrices[currentDate] && dayMatrices[currentDate][bed] && dayMatrices[currentDate][bed][zone]) || 0;
					const cell = document.createElement("div");
					cell.className = "mg-data";

					if (cnt > 0) {
						cell.style.backgroundColor = obs.color;
						cell.className += " " + getIntensityClass(cnt, maxCountAllDays);
						cell.title = "Bed " + bed + " – Zone " + zone + ": " + cnt + " (today)";
					} else {
						// Check if there's data from previous days
						let hasPreviousData = false;
						availableDates.filter(d => d !== currentDate).forEach(date => {
							const prevCnt = (dayMatrices[date] && dayMatrices[date][bed] && dayMatrices[date][bed][zone]) || 0;
							if (prevCnt > 0) hasPreviousData = true;
						});
						
						if (hasPreviousData) {
							cell.style.backgroundColor = obs.color;
							cell.style.opacity = "0.3";
							cell.title = "Bed " + bed + " – Zone " + zone + ": Previous days data";
						} else {
							cell.className += " mg-empty";
							cell.title = "Bed " + bed + " – Zone " + zone + ": None";
						}
					}

					grid.appendChild(cell);
				});
			});

			// Add day indicators
			const dayIndicator = document.createElement("div");
			dayIndicator.className = "day-indicator";
			availableDates.forEach((date, index) => {
				const hasData = Object.keys(dayMatrices[date] || {}).length > 0;
				const dot = document.createElement("span");
				dot.className = "day-dot";
				dot.style.backgroundColor = hasData ? obs.color : "#e5e7eb";
				dot.title = date + (hasData ? " (data available)" : " (no data)");
				dayIndicator.appendChild(dot);
				
				if (index < availableDates.length - 1) {
					dayIndicator.appendChild(document.createTextNode(" "));
				}
			});
			body.appendChild(dayIndicator);

			body.appendChild(grid);
			card.appendChild(body);

			return card;
		}

		// ── Parse zone string ──
		function parseZone(zoneStr) {
			const m = zoneStr.match(/^(.+?)\s+-\s+Bed\s+(\d+)\s+-\s+Zone\s+(\d+)$/);
			if (!m) return null;
			return {
				gh: m[1].trim(),
				bed: +m[2],
				zone: +m[3],
			};
		}

		// ── Intensity class ──
		function getIntensityClass(count, max) {
			if (count === 0) return "intensity-0";
			const r = count / max;
			if (r <= 0.2) return "intensity-1";
			if (r <= 0.4) return "intensity-2";
			if (r <= 0.6) return "intensity-3";
			if (r <= 0.8) return "intensity-4";
			return "intensity-5";
		}

		// ── Full heatmap grid for modal ──

			const grid = document.createElement("div");
			grid.className = "heatmap-grid";
			grid.style.gridTemplateColumns = "50px repeat(" + zoneCount + ", 1fr)";

			// Corner
			const corner = document.createElement("div");
			corner.className = "grid-cell";
			grid.appendChild(corner);

			// Zone headers
			for (let z = zoneCount; z >= 1; z--) {
				const lbl = document.createElement("div");
				lbl.className = "grid-cell zone-header-cell";
				lbl.textContent = z;
				grid.appendChild(lbl);
			}

			// Bed rows
			for (let bed = bedCount; bed >= 1; bed--) {
				const bedLbl = document.createElement("div");
				bedLbl.className = "grid-cell bed-label-cell";
				bedLbl.textContent = bed;
				grid.appendChild(bedLbl);

				for (let zone = zoneCount; zone >= 1; zone--) {
					const cnt = (matrix[bed] && matrix[bed][zone]) || 0;
					const cellDiv = document.createElement("div");
					cellDiv.className = "grid-cell data-cell " + getIntensityClass(cnt, maxCount);

					if (cnt > 0 && maxCount > 0) {
						cellDiv.style.backgroundColor = color;
					}

					cellDiv.title = "Bed " + bed + " – Zone " + zone + ": " + (cnt || "None");

					if (cnt === 0) {
						cellDiv.style.backgroundColor = "";
						cellDiv.title = "Bed " + bed + " – Zone " + zone + ": None";
					}

					grid.appendChild(cellDiv);
				}
			}

			const container = document.createElement("div");
			container.className = "heatmap-container";
			container.appendChild(grid);
			return container;
		}

					document.querySelectorAll(".farm-btn").forEach(btn => btn.classList.remove("active"));
					button.classList.add("active");
					currentFarmFilter = farm.name;
					renderAllGreenhousesTable();
				});

				filterContainer.appendChild(button);
			});
		}

		// ── Date change ──
		document.getElementById("scout-date-picker").addEventListener("change", (e) => {
			currentDate = e.target.value;
			abortAllRequests();
			availableDates = getDateRange();
			loadMultiDayData();
		});

		// ── Empty state ──
		function showEmptyState() {
			const wrapper = document.getElementById("all-gh-table-wrapper");
			wrapper.innerHTML = `
				<div class="empty-state">
					<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
						<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
							d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
					</svg>
					<p style="font-weight: 600; margin-bottom: 8px;">No Data Available</p>
					<p>No scouting entries found for this date.</p>
				</div>
			`;
		}

		// ── Escape HTML ──
		function escapeHtml(str) {
			if (!str) return "";
			const div = document.createElement("div");
			div.textContent = str;
			return div.innerHTML;
		}

		// ── Init ──
		document.addEventListener("DOMContentLoaded", initialize);
	</script>
</div>
{% endblock %}
