<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Upande SCP · Scouting</title>
		<link rel="icon" type="image/png" href="/assets/upande_scp/images/upande_logo.png" />
		<link rel="apple-touch-icon" href="/assets/upande_scp/images/upande_logo.png" />
		<!-- Poppins is self-hosted via @font-face in the bundled scp_css. -->
		<link rel="stylesheet" href="{{ scp_css }}" />

		<style>
			.navbar.navbar-light { display: none !important; }
			.web-footer { display: none !important; }
			html, body { height: 100%; margin: 0; padding: 0; background: #f4f3ef; }
			body { overflow: hidden; }
			#scp-root { height: 100vh; width: 100%; overflow: auto;
				font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
			.page-content, .container, main.container { max-width: none !important; padding: 0 !important; margin: 0 !important; }

			/* The cover that holds the screen while the bundle loads.
			   Inline, and ahead of the stylesheet link resolving, because its
			   whole job is to be on screen in the first frame — a splash that
			   arrives with the CSS arrives after the thing it was meant to hide. */
			.scp-splash {
				position: fixed; inset: 0; z-index: 2147483000;
				display: flex; align-items: center; justify-content: center;
				/* White, like Frappe's own splash — the cover belongs to the
				   crossing between the two apps, not to either one's paper. */
				background: #ffffff;
				transition: opacity 280ms ease;
			}
			/* No radius and no box: the badge on nothing. It is the loader —
			   the Upande Webstore animation (cart, rose, the arrow rising out),
			   looping inside the SVG itself while the cover is up; reduced
			   motion shows the resting badge only. */
			.scp-splash img { width: 106px; height: auto; display: block; }
			.scp-splash.scp-leaving { opacity: 0; pointer-events: none; }
		</style>
	</head>
	<body>
		<div id="scp-root"></div>
		<div class="scp-splash" id="scp-splash">
			<img src="/assets/upande_scp/images/scp_logo_loader.svg" alt="Upande SCP" />
		</div>

		<script type="application/json" id="scp-bootstrap">{{ bootstrap_json | safe }}</script>
		<script type="application/json" id="scp-prefetch">{{ prefetch_json | safe }}</script>
		<script>
			(function () {
				var bootEl = document.getElementById("scp-bootstrap");
				var preEl = document.getElementById("scp-prefetch");
				var boot = {};
				var pre = {};
				try { boot = JSON.parse(bootEl.textContent || "{}"); } catch (_) {}
				try { pre = JSON.parse(preEl.textContent || "{}"); } catch (_) {}
				window.SCP = {
					csrf_token: boot.csrf_token || window.csrf_token || "",
					bootstrap: boot,
					prefetch: pre
				};
			})();
		</script>
		<script type="module" src="{{ scp_js }}"></script>
	</body>
</html>
