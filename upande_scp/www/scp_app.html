<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Scouting · SCP</title>
		<link rel="preconnect" href="https://rsms.me/" />
		<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
		<link rel="stylesheet" href="{{ scp_css }}" />

		<style>
			.navbar.navbar-light { display: none !important; }
			.web-footer { display: none !important; }
			html, body { height: 100%; margin: 0; padding: 0; background: #f5f7fa; }
			body { overflow: hidden; }
			#scp-root { height: 100vh; width: 100%; overflow: auto; }
			.page-content, .container, main.container { max-width: none !important; padding: 0 !important; margin: 0 !important; }
		</style>
	</head>
	<body>
		<div id="scp-root"></div>

		<script type="application/json" id="scp-bootstrap">
			{
				"user": "{{ frappe.session.user }}",
				"site_name": "{{ frappe.local.site }}",
				"csrf_token": "{{ csrf_token }}"
			}
		</script>
		<script>
			(function () {
				var el = document.getElementById("scp-bootstrap");
				var data = {};
				try { data = JSON.parse(el.textContent || "{}"); } catch (_) {}
				window.SCP = {
					csrf_token: data.csrf_token || window.csrf_token || "",
					bootstrap: data
				};
			})();
		</script>
		<script type="module" src="{{ scp_js }}"></script>
	</body>
</html>
