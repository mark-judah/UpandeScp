{% extends "upande_scp/www/map_base.html" %} {% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
	#map-page {
		height: 100%;
		width: 100%;
		display: flex;
		position: relative;
	}

	#map-container {
		flex: 1;
		position: relative;
		z-index: 1;
	}

	#map {
		height: 100%;
		width: 100%;
	}

	#sidebar {
		position: absolute;
		right: 0;
		top: 0;
		width: 380px;
		height: 100%;
		background: var(--fg-color, #ffffff);
		border-left: 1px solid var(--border-color, #e5e7eb);
		box-shadow: var(--shadow-md);
		z-index: 1000;
		display: flex;
		flex-direction: column;
		overflow: hidden;
	}

	#sidebar.collapsed {
		transform: translateX(100%);
	}

	.sidebar-toggle {
		position: absolute;
		left: -48px;
		top: 50%;
		transform: translateY(-50%);
		width: 48px;
		height: 96px;
		background: var(--fg-color, #ffffff);
		border: 1px solid var(--border-color, #e5e7eb);
		border-right: none;
		border-radius: var(--radius-card) 0 0 var(--radius-card);
		display: flex;
		align-items: center;
		justify-content: center;
		cursor: pointer;
	}

	.sidebar-toggle:hover {
		background: var(--hover);
	}

	.sidebar-toggle svg {
		width: 24px;
		height: 24px;
		color: var(--text);
		opacity: 0.7;
	}

	#sidebar.collapsed .sidebar-toggle svg {
		transform: rotate(180deg);
	}

	.sidebar-content {
		flex: 1;
		overflow-y: auto;
		padding: 1.25rem;
		display: flex;
		flex-direction: column;
		gap: 1.5rem;
	}

	.sidebar-content::-webkit-scrollbar {
		width: 6px;
	}

	.sidebar-content::-webkit-scrollbar-track {
		background: transparent;
	}

	.sidebar-content::-webkit-scrollbar-thumb {
		background: var(--border);
		border-radius: 3px;
	}

	.section {
		display: flex;
		flex-direction: column;
		gap: 0.75rem;
	}

	.section-label {
		font-size: 0.875rem;
		font-weight: 600;
		color: var(--text);
		display: flex;
		align-items: center;
		gap: 0.5rem;
	}

	.section-label svg {
		width: 16px;
		height: 16px;
		opacity: 0.7;
	}

	.week-picker {
		padding: 0.75rem 1rem;
		border: 1px solid var(--border);
		border-radius: var(--radius-input);
		background: var(--panel-bg);
		color: var(--text);
		font-size: 0.9375rem;
		cursor: pointer;
	}

	.week-picker:hover {
		filter: brightness(0.98);
	}

	.week-picker:focus {
		outline: none;
		border-color: var(--accent);
		box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
	}

	.filter-group {
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
	}

	.filter-tabs {
		display: flex;
		flex-wrap: wrap;
		gap: 0.5rem;
		padding: 0.5rem;
		background: var(--panel-bg);
		border-radius: var(--radius-card);
		border: 1px solid var(--border);
		box-shadow: var(--shadow-sm);
	}

	.filter-btn {
		flex: 1;
		min-width: calc(50% - 0.25rem);
		padding: 0.625rem 0.875rem;
		border: 1.5px solid var(--border);
		background: var(--panel-bg);
		color: var(--text);
		font-size: 0.8125rem;
		font-weight: 600;
		border-radius: var(--radius-input);
		cursor: pointer;
		text-align: center;
	}

	.filter-btn:hover:not(.active) {
		filter: brightness(0.98);
	}

	.filter-btn.active {
		background: var(--accent);
		border-color: var(--accent);
		color: white;
		box-shadow: var(--shadow-sm);
	}

	.legend-items {
		display: flex;
		flex-direction: column;
		gap: 0.5rem;
	}

	.legend-item {
		display: flex;
		align-items: center;
		gap: 0.875rem;
		padding: 0.75rem;
		border-radius: var(--radius-input);
		border: 1px solid var(--border);
		background: var(--panel-bg);
		cursor: pointer;
	}

	.legend-item:hover {
		background: var(--hover);
	}

	.legend-item input[type="checkbox"] {
		width: 18px;
		height: 18px;
		margin: 0;
		cursor: pointer;
		accent-color: var(--text);
	}

	.color-swatch {
		width: 20px;
		height: 20px;
		border-radius: 50%;
		flex-shrink: 0;
		border: 1px solid var(--border);
	}

	.legend-label {
		flex: 1;
		font-size: 0.875rem;
		font-weight: 500;
		color: var(--text);
	}

	.pest-count {
		font-size: 0.75rem;
		font-weight: 600;
		padding: 0.25rem 0.5rem;
		border-radius: var(--radius-input);
		background: var(--hover);
		color: var(--accent);
		border: 1px solid var(--border);
	}

	.empty-state {
		text-align: center;
		padding: 2rem 1rem;
		color: var(--text-muted);
	}

	.empty-state svg {
		width: 48px;
		height: 48px;
		margin: 0 auto 1rem;
		opacity: 0.5;
	}

	.empty-state p {
		font-size: 0.875rem;
		margin-top: 0.5rem;
	}

	#map-loader {
		position: absolute;
		inset: 0;
		background: rgba(255, 255, 255, 0.92);
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		z-index: 2000;
		gap: 0.75rem;
	}

	[data-theme="dark"] #map-loader {
		background: rgba(22, 26, 31, 0.92);
	}

	.selection-controls {
		display: flex;
		gap: 0.375rem;
	}

	.select-btn {
		padding: 0.375rem 0.75rem;
		border: 1px solid var(--border);
		background: var(--panel-bg);
		color: var(--text);
		font-size: 0.75rem;
		font-weight: 500;
		border-radius: var(--radius-input);
		cursor: pointer;
	}
	.select-btn:hover {
		filter: brightness(0.98);
	}

	.map-load-title { font-size: 0.875rem; font-weight: 600; color: #1e293b; margin-bottom: 0.15rem; }
	.map-load-track {
		width: 220px; height: 5px;
		background: #e2e8f0; border-radius: 3px; overflow: hidden;
	}
	.map-load-fill {
		height: 100%; width: 0%;
		background: #2563eb; border-radius: 3px;
		transition: width 0.25s ease;
	}
	.map-load-status { font-size: 0.72rem; color: #64748b; min-width: 220px; text-align: center; }

	.trap-marker {
		background: transparent !important;
		border: none !important;
	}
	.trap-circle {
		width: 34px;
		height: 34px;
		border-radius: 50%;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 12px;
		font-weight: 700;
		box-shadow: 0 1px 4px rgba(0,0,0,0.35);
	}

	@media (max-width: 768px) {
		#sidebar {
			width: 100%;
			max-width: 380px;
		}
	}
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
	window.onload = function () {
	    const LAT = {{ lat | tojson }};
	    const LON = {{ lon | tojson }};
	    const ZOOM = {{ default_zoom | tojson }};
	    const CSRF = "{{csrf_token}}";

	    // Performance: abort controller + debounce + data cache
	    let abortCtrl = null;
	    const dataCache = new Map();
	    function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

	    window.map = null;
	    let mapInitialized = false;
	    window.trapMarkers = L.layerGroup();

	    window.trapData = {};
	    window.filters = {
	        location: 'all',
	        greenhouses: new Set(),
	        pests: new Set()
	    };

	    const sidebar = document.getElementById('sidebar');
	    const toggleBtn = document.getElementById('toggle-sidebar');
	    toggleBtn.addEventListener('click', () => sidebar.classList.toggle('collapsed'));

	    const setProgress = (pct) => {
	        const fill = document.getElementById('map-load-fill');
	        const status = document.getElementById('map-load-status');
	        if (fill) fill.style.width = Math.min(100, pct) + '%';
	        if (status) status.textContent = Math.round(Math.min(100, pct)) + '%';
	    };

	    const streamResponse = (response, onProgress) => {
	        const contentLength = response.headers.get('content-length');
	        const reader = response.body.getReader();
	        const chunks = [];
	        let received = 0;
	        const ESTIMATE = 300 * 1024;
	        const read = () => reader.read().then(({ done, value }) => {
	            if (done) {
	                const buf = new Uint8Array(received);
	                let pos = 0;
	                for (const c of chunks) { buf.set(c, pos); pos += c.length; }
	                if (onProgress) onProgress(83);
	                return JSON.parse(new TextDecoder().decode(buf));
	            }
	            chunks.push(value);
	            received += value.length;
	            if (onProgress) {
	                const pct = contentLength
	                    ? 48 + (received / +contentLength) * 33
	                    : 48 + Math.min(received / ESTIMATE, 1) * 33;
	                onProgress(pct);
	            }
	            return read();
	        });
	        return read();
	    };

	    const showLoader = () => {
	        setProgress(0);
	        document.getElementById('map-loader').style.display = 'flex';
	    };
	    const hideLoader = () => document.getElementById('map-loader').style.display = 'none';

	    // Total-catches color scale
	    const getCountColor = (total) => {
	        if (!total || total <= 0) return '#ffffff';
	        if (total <= 5) return '#fef3c7';
	        if (total <= 15) return '#fde047';
	        if (total <= 30) return '#facc15';
	        if (total <= 50) return '#fb923c';
	        if (total <= 75) return '#f97316';
	        if (total <= 100) return '#dc2626';
	        return '#7c2d12';
	    };

	    // Aggregate entries → one record per trap with totals + averaged position
	    const aggregateTraps = (entries) => {
	        const map = new Map();
	        entries.forEach(e => {
	            const lat = parseFloat(e.latitude);
	            const lng = parseFloat(e.longitude);
	            if (!map.has(e.trap)) {
	                map.set(e.trap, {
	                    trap: e.trap,
	                    totalCount: 0,
	                    entryCount: 0,
	                    days: new Set(),
	                    pest: e.pest,
	                    location: e.location,
	                    greenhouse: e.greenhouse,
	                    zone: e.zone,
	                    latSum: 0,
	                    lngSum: 0,
	                    latN: 0,
	                    lngN: 0
	                });
	            }
	            const t = map.get(e.trap);
	            t.totalCount += (e.count || 0);
	            t.entryCount += 1;
	            t.days.add(e.date_of_capture);
	            if (!isNaN(lat) && !isNaN(lng)) {
	                t.latSum += lat; t.lngSum += lng;
	                t.latN += 1; t.lngN += 1;
	            }
	        });
	        const result = new Map();
	        map.forEach((t, k) => {
	            if (!t.latN || !t.lngN) return; // drop traps with no valid coords
	            result.set(k, {
	                ...t,
	                latitude: t.latSum / t.latN,
	                longitude: t.lngSum / t.lngN,
	                color: getCountColor(t.totalCount)
	            });
	        });
	        return result;
	    };

	    // Pest colors for legend swatch only
	    const pestColors = {
	        'FCM': '#ef4444',
	        'Thrips': '#f59e0b',
	        'Whitefly': '#eab308',
	        'Spider Mite': '#84cc16',
	        'Aphids': '#22c55e',
	        'default': '#6b7280'
	    };
	    const getPestColor = (pest) => pestColors[pest] || pestColors['default'];

	    // Initialize map
	    const initializeMap = () => {
	        if (mapInitialized) return;

	        window.map = L.map('map', {
	            zoomSnap: 0.1,
	            zoomDelta: 0.1,
	            maxZoom: 22.4,
	            zoomControl: true
	        });
	        mapInitialized = true;

	        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
	            maxZoom: 19,
	            attribution: '© OpenStreetMap contributors'
	        }).addTo(window.map);

	        window.map.setView([LAT, LON], ZOOM);

	        // Set current week
	        const weekPicker = document.getElementById('week-picker');
	        const today = new Date();
	        const year = today.getFullYear();
	        const weekNum = getWeekNumber(today);
	        weekPicker.value = `${year}-W${weekNum.toString().padStart(2, '0')}`;

	        fetchTrapData(weekPicker.value);

	        const debouncedFetchTrap = debounce(week => fetchTrapData(week), 300);
	        weekPicker.addEventListener('change', e => debouncedFetchTrap(e.target.value));
	    };

	    const getWeekNumber = (date) => {
	        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
	        const dayNum = d.getUTCDay() || 7;
	        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
	        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
	        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
	    };

	    const prefetchWeeks = (currentWeek) => {
	        // Pre-cache the prior 2 weeks silently so picker scrubbing is snappy
	        const [yStr, wStr] = currentWeek.split('-W');
	        let y = parseInt(yStr, 10);
	        let w = parseInt(wStr, 10);
	        for (let i = 0; i < 2; i++) {
	            w -= 1;
	            if (w < 1) { y -= 1; w = 52; }
	            const key = `${y}-W${w.toString().padStart(2, '0')}`;
	            if (dataCache.has(key)) continue;
	            fetch('/api/method/upande_scp.serverscripts.get_trap_data.getTrapData', {
	                method: 'POST',
	                headers: { 'Content-Type': 'application/json', 'X-Frappe-CSRF-Token': CSRF },
	                body: JSON.stringify({ week: key })
	            })
	            .then(r => r.ok ? r.json() : null)
	            .then(r => { if (r?.message) dataCache.set(key, r.message); })
	            .catch(() => {});
	        }
	    };

	    const fetchTrapData = (week) => {
	        if (dataCache.has(week)) {
	            window.trapData = dataCache.get(week);
	            window.filters.greenhouses = new Set(window.trapData.greenhouses || []);
	            window.filters.pests = new Set(window.trapData.pests || []);
	            renderGreenhouseList();
	            renderPestList();
	            renderTrapMarkers();
	            return;
	        }

	        if (abortCtrl) abortCtrl.abort();
	        abortCtrl = new AbortController();
	        showLoader();

	        let serverPct = 5, serverTimer = null;
	        setProgress(serverPct);
	        serverTimer = setInterval(() => {
	            serverPct = Math.min(serverPct + 1.2, 45);
	            setProgress(serverPct);
	        }, 150);

	        fetch('/api/method/upande_scp.serverscripts.get_trap_data.getTrapData', {
	            method: 'POST',
	            headers: {
	                'Content-Type': 'application/json',
	                'X-Frappe-CSRF-Token': CSRF
	            },
	            body: JSON.stringify({ week }),
	            signal: abortCtrl.signal
	        })
	        .then(r => {
	            clearInterval(serverTimer);
	            if (!r.ok) throw new Error('HTTP ' + r.status);
	            setProgress(48);
	            return streamResponse(r, setProgress);
	        })
	        .then(r => {
	            window.trapData = r.message;
	            dataCache.set(week, window.trapData);
	            window.filters.greenhouses = new Set(window.trapData.greenhouses || []);
	            window.filters.pests = new Set(window.trapData.pests || []);
	            setProgress(90);
	            renderGreenhouseList();
	            renderPestList();
	            renderTrapMarkers();
	            setProgress(100);
	            setTimeout(hideLoader, 350);
	            prefetchWeeks(week);
	        })
	        .catch(err => {
	            if (serverTimer) clearInterval(serverTimer);
	            if (err.name === 'AbortError') return;
	            console.error('Failed to load trap data:', err);
	            hideLoader();
	            const pestList = document.getElementById('pest-list');
	            if (pestList) {
	                pestList.innerHTML = `
	                    <div class="empty-state">
	                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
	                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
	                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
	                        </svg>
	                        <p><strong>Failed to load trap data</strong></p>
	                        <p>Please try again or select a different week</p>
	                    </div>
	                `;
	            }
	        });
	    };

	    const renderTrapMarkers = () => {
	        window.trapMarkers.clearLayers();

	        const entries = window.trapData.trap_entries || [];
	        const traps = aggregateTraps(entries);

	        traps.forEach((t, trapName) => {
	            if (window.filters.location !== 'all' && t.location !== window.filters.location) return;

	            const gh = t.greenhouse?.split(' - ')[0];
	            if (!window.filters.greenhouses.has(gh)) return;
	            if (!window.filters.pests.has(t.pest)) return;

	            const color = t.color;
	            const borderColor = t.totalCount === 0 ? '#d1d5db' : '#ffffff';
	            const textColor = t.totalCount <= 15 ? '#1f2937' : '#ffffff';

	            const icon = L.divIcon({
	                className: 'trap-marker',
	                html: `<div class="trap-circle" style="background:${color};border:3px solid ${borderColor};color:${textColor};">${t.totalCount}</div>`,
	                iconSize: [34, 34],
	                iconAnchor: [17, 17]
	            });

	            const marker = L.marker([t.latitude, t.longitude], { icon });

	            marker.bindPopup(`
	                <div style="font-size: 0.875rem; line-height: 1.6; min-width: 220px;">
	                    <strong style="display:block;font-size:1rem;margin-bottom:0.5rem;">
	                        ${trapName}
	                    </strong>
	                    <div style="display:grid;gap:0.25rem;">
	                        <div><strong>Pest:</strong> ${t.pest || '—'}</div>
	                        <div><strong>Total Catches:</strong> ${t.totalCount}</div>
	                        <div><strong>Entries:</strong> ${t.entryCount}</div>
	                        <div><strong>Days Recorded:</strong> ${t.days.size}</div>
	                        <div><strong>Location:</strong> ${t.location || '—'}</div>
	                        <div style="opacity:0.8;margin-top:0.25rem;">
	                            <div><strong>Zone:</strong> ${t.zone || '—'}</div>
	                            <div><strong>Greenhouse:</strong> ${gh || '—'}</div>
	                        </div>
	                    </div>
	                </div>
	            `);

	            window.trapMarkers.addLayer(marker);
	        });

	        window.trapMarkers.addTo(window.map);
	    };

	    const renderGreenhouseList = () => {
	        const container = document.getElementById('greenhouse-list');
	        container.innerHTML = '';

	        const greenhouses = window.trapData.greenhouses || [];
	        if (!greenhouses.length) {
	            container.innerHTML = '<p style="font-size:0.8125rem;color:#999;padding:0.5rem;">No greenhouses</p>';
	            return;
	        }

	        greenhouses.forEach(gh => {
	            const checked = window.filters.greenhouses.has(gh);
	            const item = document.createElement('label');
	            item.className = 'legend-item';
	            item.innerHTML = `
	                <input type="checkbox" data-type="greenhouse" value="${gh}" ${checked ? 'checked' : ''}>
	                <span class="legend-label">${gh}</span>
	            `;
	            container.appendChild(item);
	        });

	        setupFilterListeners();
	    };

	    const renderPestList = () => {
	        const container = document.getElementById('pest-list');
	        container.innerHTML = '';

	        const pests = window.trapData.pests || [];
	        if (!pests.length) {
	            container.innerHTML = '<p style="font-size:0.8125rem;color:#999;padding:0.5rem;">No pests recorded</p>';
	            return;
	        }

	        const pestCounts = {};
	        (window.trapData.trap_entries || []).forEach(entry => {
	            pestCounts[entry.pest] = (pestCounts[entry.pest] || 0) + (entry.count || 0);
	        });

	        pests.forEach(pest => {
	            const checked = window.filters.pests.has(pest);
	            const color = getPestColor(pest);
	            const count = pestCounts[pest] || 0;

	            const item = document.createElement('label');
	            item.className = 'legend-item';
	            item.innerHTML = `
	                <input type="checkbox" data-type="pest" value="${pest}" ${checked ? 'checked' : ''}>
	                <span class="color-swatch" style="background-color:${color}"></span>
	                <span class="legend-label">${pest}</span>
	                <span class="pest-count">${count}</span>
	            `;
	            container.appendChild(item);
	        });

	        setupFilterListeners();
	    };

	    const setupFilterListeners = () => {
	        document.querySelectorAll('[data-filter="location"]').forEach(btn => {
	            btn.addEventListener('click', e => {
	                document.querySelectorAll('[data-filter="location"]').forEach(b => b.classList.remove('active'));
	                e.target.classList.add('active');
	                window.filters.location = e.target.dataset.value;
	                renderTrapMarkers();
	            });
	        });

	        document.querySelectorAll('[data-type="greenhouse"]').forEach(cb => {
	            cb.addEventListener('change', e => {
	                const gh = e.target.value;
	                if (e.target.checked) window.filters.greenhouses.add(gh);
	                else window.filters.greenhouses.delete(gh);
	                renderTrapMarkers();
	            });
	        });

	        document.querySelectorAll('[data-type="pest"]').forEach(cb => {
	            cb.addEventListener('change', e => {
	                const pest = e.target.value;
	                if (e.target.checked) window.filters.pests.add(pest);
	                else window.filters.pests.delete(pest);
	                renderTrapMarkers();
	            });
	        });

	        document.querySelector('[data-action="select-all-gh"]')?.addEventListener('click', () => {
	            window.filters.greenhouses = new Set(window.trapData.greenhouses || []);
	            renderGreenhouseList();
	            renderTrapMarkers();
	        });

	        document.querySelector('[data-action="select-none-gh"]')?.addEventListener('click', () => {
	            window.filters.greenhouses.clear();
	            renderGreenhouseList();
	            renderTrapMarkers();
	        });

	        document.querySelector('[data-action="select-all-pests"]')?.addEventListener('click', () => {
	            window.filters.pests = new Set(window.trapData.pests || []);
	            renderPestList();
	            renderTrapMarkers();
	        });

	        document.querySelector('[data-action="select-none-pests"]')?.addEventListener('click', () => {
	            window.filters.pests.clear();
	            renderPestList();
	            renderTrapMarkers();
	        });
	    };

	    initializeMap();
	};
</script>
{% endblock %}
